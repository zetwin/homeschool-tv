<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklist: the day as a list to tick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2128; --ink2:#525965; --line:#e3e6eb; --side:#f1f3f6; --paper:#fff;
  --accent:#2d5bd7; --accent-ink:#fff; --accent-soft:#eaf0fd; --late:#b42318; --warn:#8a5300;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px}
html.t2{font-size:19px} html.t3{font-size:21px}
body{font-family:Figtree,system-ui,sans-serif;color:var(--ink);background:var(--paper);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;line-height:1.35}
body.admin-on{overflow:auto;height:auto;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
svg{display:block}

/* ---------- pad ---------- */
.app{display:grid;grid-template-columns:292px 1fr;height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:22px 14px 18px;display:flex;flex-direction:column;gap:2px;min-height:0}
.nav{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border-radius:10px;width:100%;font-weight:500}
.nav:hover{background:#e6e9ee}
.nav.on{background:#fff;box-shadow:0 1px 2px rgba(20,30,50,.10),0 0 0 1px rgba(20,30,50,.04)}
.nav .n{margin-left:auto;color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:500}
.nav .n.late{color:var(--late);font-weight:700}
.nav .ic{width:24px;height:24px;flex:none;display:grid;place-items:center}
.side-h{color:var(--ink2);font-weight:600;padding:16px 12px 4px}
.kidnav{min-height:58px;align-items:center}
.kidnav .face{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}
.kidnav .who{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.kidnav .who b{font-weight:600}
.bar{height:5px;border-radius:3px;background:#dcdfe5;overflow:hidden;width:100%}
.bar i{display:block;height:100%;border-radius:3px}
.kidnav .n{align-self:center}
.spacer{flex:1}

main{display:flex;flex-direction:column;padding:26px 44px 18px 48px;min-width:0;min-height:0}
header{display:flex;align-items:flex-start;gap:14px}
.title{display:flex;align-items:center;gap:14px}
h1{font-size:2.15rem;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.date{color:var(--ink2);margin-top:6px}
.summary{color:var(--ink2);margin-top:6px}
.tools{margin-left:auto;display:flex;gap:6px}
.icon{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.icon:hover{background:var(--side)}
.icon.text{font-weight:700;font-size:1.05rem;width:auto;padding:0 12px}

.list{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;margin-top:14px}
.gh{display:flex;align-items:baseline;gap:10px;font-weight:700;font-size:1.12rem;padding:0 0 8px;border-bottom:1px solid var(--line)}
.gh .c{color:var(--ink2);font-weight:500;font-size:1rem}
.gh.now{color:var(--accent)}
.gh.wait{color:var(--warn)}

.row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;column-gap:6px;padding:7px 0;border-bottom:1px solid var(--line);min-height:58px;cursor:pointer;transition:background .15s;border-radius:0;position:relative}
.row:hover{background:#fafbfc}
.row.sel{background:var(--accent-soft)}
.row .txt{min-width:0;display:flex;flex-direction:column;gap:4px;padding-right:12px}
.row .l2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.row .l1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.row .t{font-weight:600;font-size:1.06rem}
.row .s{color:var(--ink2)}
.row .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .end{display:flex;align-items:center;gap:12px}
.row .time{color:var(--ink2);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.row.hero{min-height:100px;padding:12px 0}
.row.hero .t{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}

.tag{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px 2px 6px;font-weight:600;line-height:1.35;white-space:nowrap}
.tag.off{background:#eef0f3!important;color:var(--ink2)!important;font-weight:500}
.tag .e{font-size:15px}

.tick{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.tick .ring{width:28px;height:28px;border-radius:50%;border:2px solid #9aa1ab;display:grid;place-items:center;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s,border-color .2s}
.tick:hover .ring{border-color:var(--accent)}
.row.hero .tick .ring{width:32px;height:32px}
.tick svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .12s ease-out}
.row.checked .tick .ring{background:var(--accent);border-color:var(--accent);transform:scale(1.12)}
.row.checked .tick svg{stroke-dashoffset:0}
.row.checked .t{color:var(--ink2);text-decoration:line-through;text-decoration-thickness:2px}
.row.leaving{transition:opacity .35s, max-height .4s .1s, min-height .4s .1s, padding .4s .1s;opacity:0;max-height:0!important;min-height:0!important;padding:0;overflow:hidden;border-width:0}
.row.isdone .tick .ring{background:#9aa1ab;border-color:#9aa1ab}
.row.isdone .tick svg{stroke-dashoffset:0}
.row.isdone .t{color:var(--ink2)}

.btn{min-height:44px;padding:0 18px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:#244bb5}
.btn.sec{background:#fff;border:1.5px solid #c9ced6}
.btn.sec:hover{border-color:var(--ink2)}
.btn.big{min-height:52px;font-size:1.06rem;padding:0 22px;border-radius:14px}

.more{display:flex;align-items:center;gap:10px;min-height:52px;color:var(--ink2);font-weight:500;width:100%;border-bottom:1px solid var(--line)}
.more svg{transition:transform .2s}
.more.open svg{transform:rotate(90deg)}
.done-wrap{display:none}
.done-wrap.open{display:block}

/* popover */
.scrim{position:fixed;inset:0;z-index:20;display:none}
.scrim.on{display:block}
.pop{position:fixed;z-index:21;width:440px;max-width:calc(100vw - 32px);background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(20,30,50,.22),0 0 0 1px rgba(20,30,50,.07);padding:20px 22px 20px;display:none;transform-origin:top right}
.pop.on{display:block;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
.pop h3{font-size:1.3rem;font-weight:800;letter-spacing:-.01em;padding-right:40px}
.pop .sub{color:var(--ink2);margin-top:4px}
.pop .x{position:absolute;right:8px;top:8px}
.pop .kids{margin:14px 0 4px;display:flex;flex-direction:column}
.pop .kr{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;min-height:56px;border-top:1px solid var(--line)}
.pop .kr .face{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px}
.pop .kr .st{color:var(--ink2)}
.pop .kr .st b{color:var(--ink)}
.pop .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.pop .mk{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}
.pop .mk button{min-height:48px;border-radius:12px;border:1.5px solid #c9ced6;text-align:center;font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.pop .mk button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pop label{display:block;font-weight:600;margin-top:14px}
.pop input{font:inherit;width:100%;min-height:48px;border:1.5px solid #c9ced6;border-radius:12px;padding:0 14px;margin-top:6px}
.pop .chips{display:flex;gap:8px;margin-top:8px}
.pop .chip{min-height:44px;padding:0 14px;border-radius:99px;border:1.5px solid #c9ced6;font-weight:600}
.pop .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pop .line{display:flex;justify-content:space-between;gap:12px;min-height:50px;align-items:center;border-top:1px solid var(--line)}
.pop .line span:last-child{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.pop .line .late{color:var(--late)}
.seg{display:flex;gap:8px;margin-top:14px}
.seg button{flex:1;min-height:56px;border-radius:12px;border:1.5px solid #c9ced6;text-align:center;font-weight:700}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120px);background:var(--ink);color:#fff;border-radius:14px;padding:6px 6px 6px 20px;display:flex;align-items:center;gap:14px;transition:transform .3s cubic-bezier(.2,1.2,.4,1);z-index:30;max-width:calc(100vw - 32px)}
.toast.on{transform:translate(-50%,0)}
.toast button{color:#9fbcff;font-weight:700;min-height:44px;padding:0 14px}

/* ---------- admin ---------- */
.admin{display:none;min-height:100vh;grid-template-columns:320px 1fr}
body.admin-on .app{display:none}
body.admin-on .admin{display:grid}
.admin aside{position:sticky;top:0;height:100vh}
.back{display:flex;align-items:center;gap:6px;min-height:48px;padding:0 10px 0 4px;color:var(--accent);font-weight:700;font-size:1.06rem;border-radius:10px}
.back:hover{background:#e6e9ee}
.admin h1{padding:14px 12px 10px}
.admin .sec{padding:44px 56px 64px;max-width:820px}
.admin .sec h2{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.admin .sec .lead{color:var(--ink2);margin-top:8px;max-width:60ch}
.grp{margin-top:26px}
.grp h4{font-weight:700;color:var(--ink2);margin-bottom:8px;font-size:1rem}
.grp .box{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.grp .r{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:58px;padding:0 18px;border-top:1px solid var(--line);width:100%}
.grp .r:first-child{border-top:0}
.grp .r .v{color:var(--ink2);text-align:right}
.grp button.r:hover{background:#fafbfc}
.grp .r .face{font-size:20px;margin-right:10px}

/* ---------- upright ---------- */
@media (max-aspect-ratio:1/1){
  .app{display:flex;flex-direction:column}
  main{display:contents}
  header{order:1;padding:28px 32px 0}
  .app aside{order:2;border-right:0;background:transparent;padding:16px 32px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .app aside .side-h,aside .spacer{display:none}
  .app aside .nav{border:1px solid var(--line);background:#fff;min-height:56px}
  .app aside .nav.on{background:var(--accent-soft);border-color:#b8c8f3;box-shadow:none}
  .app aside .nav.today{grid-column:1}
  .app aside .kidnav{min-height:64px}
  .app aside .views{display:contents}
  .app aside .views .nav .ic,aside .nav[data-act=feedback] .ic{display:none}
  .app aside .nav{white-space:nowrap;gap:8px}
  .list{order:3;padding:0 32px 22px;margin-top:20px}
  .admin{grid-template-columns:1fr;align-content:start}
  .admin aside{position:static;height:auto;display:flex;flex-direction:row;align-content:flex-start;flex-wrap:wrap;gap:8px;padding:22px 32px 18px;border-right:0;border-bottom:1px solid var(--line)}
  .admin aside .back,.admin aside h1{flex-basis:100%}
  .admin aside h1{padding:4px 0 6px}
  .admin aside .nav{width:auto;border:1px solid var(--line);background:#fff}
  .admin aside .nav.on{background:var(--accent-soft);border-color:#b8c8f3;box-shadow:none}
  .admin .sec{padding:24px 32px 64px}
}
/* largest text: fewer words per row, nothing cut */
html.t3 .row:not(.hero) .s{display:none}
html.t3 .list{gap:8px;margin-top:8px}
html.t3 main{padding-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="pad">
  <aside id="side"></aside>
  <main>
    <header id="head"></header>
    <div class="list" id="list"></div>
  </main>
</div>
<div class="admin" id="admin"></div>
<div class="scrim" id="scrim"></div>
<div class="pop" id="pop" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="tundo">Undo</button></div>

<script src="../data.js"></script>
<script>
const P = window.PAD, K = P.kids, C = P.classes;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shade = (hex, f = .8) => { const n = parseInt(hex.slice(1), 16); return `rgb(${Math.round((n >> 16) * f)},${Math.round(((n >> 8) & 255) * f)},${Math.round((n & 255) * f)})`; };
const tint = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const I = {
  star: '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="#e8a400"/></svg>',
  starBig: '<svg width="34" height="34" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="#e8a400"/></svg>',
  gear: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  check: '<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg>',
  tv: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
  chev: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  back: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  x: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  book: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>',
  chart: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>',
  home: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  pen: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
};

/* ---------- the checklist, built from the one sample day ---------- */
const stWord = { done: 'Done', now: 'Watching now', later: 'Later today', missed: 'Missed' };
const kidOf = (text) => K.findIndex((k) => text.includes(k.name));
let items = [];
C.forEach((c, ci) => {
  const st = c.state;
  if (c.now) items.push({ id: 'c' + ci, group: 'now', ci, kids: K.map((_, j) => j).filter((j) => st[j] === 'now'), off: K.map((_, j) => j).filter((j) => st[j] === 'done') });
  else if (st.every((s) => s === 'later')) items.push({ id: 'c' + ci, group: 'today', ci, kids: [0, 1, 2], off: [] });
  else items.push({ id: 'c' + ci, group: 'done', ci, kids: K.map((_, j) => j).filter((j) => st[j] === 'done'), off: K.map((_, j) => j).filter((j) => st[j] === 'missed') });
});
P.needsYou.forEach((n, ni) => {
  const k = kidOf(n.what);
  items.push({ id: 'n' + ni, group: 'wait', ni, kids: k >= 0 ? [k] : [0, 1, 2], off: [] });
});
let filter = -1, openDone = innerHeight > innerWidth, lastDone = null;

function tag(j, off, extra) {
  const k = K[j];
  return `<span class="tag${off ? ' off' : ''}" style="background:${tint(k.color, .1)};color:${shade(k.color)}"><span class="e" aria-hidden="true">${k.face}</span>${esc(k.name)}${extra ? ' ' + esc(extra) : ''}</span>`;
}
function rowHTML(it) {
  const hero = it.group === 'now';
  let t, s = '', end = '', tags = '';
  if (it.ci !== undefined) {
    const c = C[it.ci];
    t = `${c.subject}: ${c.title}`;
    if (it.group === 'now') s = `Started ${c.time}, video lesson`;
    tags = it.kids.map((j) => tag(j)).join('') + it.off.map((j) => tag(j, true, it.group === 'done' ? 'missed' : 'done')).join('');
    if (it.group === 'done') tags = it.kids.map((j) => tag(j, false, c.marks && c.marks[j] ? 'mark ' + c.marks[j] : '')).join('') + it.off.map((j) => tag(j, true, 'missed')).join('');
    end = hero ? `<button class="btn pri big" data-act="play">${I.tv}Play on the TV</button>` : `<span class="time">${c.time}</span>`;
  } else {
    const n = P.needsYou[it.ni];
    t = n.what; s = n.detail;
    tags = it.kids.map((j) => tag(j)).join('');
    end = `<button class="btn sec" data-act="need">${esc(n.action)}</button>`;
  }
  const done = it.group === 'done';
  return `<div class="row${hero ? ' hero' : ''}${done ? ' isdone' : ''}" data-id="${it.id}" tabindex="0" role="button" aria-label="${esc(t)}">
    <button class="tick" data-act="tick" aria-label="${done ? 'Done' : 'Tick off'}"><span class="ring">${I.check}</span></button>
    <div class="txt">${hero ? `<div class="t">${esc(t)}</div><div class="l2"><span class="s">${esc(s)}</span><span class="tags">${tags}</span></div>` : `<div class="l1"><span class="t">${esc(t)}</span><span class="tags">${tags}</span></div>${s ? `<div class="s">${esc(s)}</div>` : ''}`}</div>
    <div class="end">${end}</div></div>`;
}
const visible = (it) => filter < 0 || it.kids.includes(filter) || it.off.includes(filter);

function renderList() {
  const g = (k) => items.filter((it) => it.group === k && visible(it));
  const now = g('now'), today = g('today'), wait = g('wait'), done = g('done');
  let h = '';
  h += `<section><div class="gh now">Now<span class="c">${P.now}</span></div>${now.map(rowHTML).join('') || '<div class="row"><span></span><div class="txt"><div class="s">Nothing running right now.</div></div></div>'}</section>`;
  h += `<section><div class="gh">Today<span class="c">${today.length} still to come</span></div>${today.map(rowHTML).join('')}
    ${done.length ? `<button class="more${openDone ? ' open' : ''}" data-act="more">${I.chev}<span>${done.length} done this morning: ${done.map((d) => C[d.ci].subject).join(' and ')}</span></button>
    <div class="done-wrap${openDone ? ' open' : ''}">${done.map(rowHTML).join('')}</div>` : ''}</section>`;
  h += `<section><div class="gh wait">Waiting for you<span class="c">${wait.length ? wait.length + (wait.length === 1 ? ' thing' : ' things') : 'Nothing, all clear'}</span></div>${wait.map(rowHTML).join('')}</section>`;
  $('#list').innerHTML = h;
}
function renderHead() {
  const k = K[filter];
  $('#head').innerHTML = k
    ? `<div><div class="title"><span style="font-size:34px" aria-hidden="true">${k.face}</span><h1>${k.name}’s day</h1></div>
       <p class="summary">${k.year}. ${k.done} of ${k.of} classes done, average ${k.average}, ${k.homework ? k.homework + ' homework' + (k.late ? ', ' + k.late + ' late' : '') : 'no homework'}.</p></div>`
    : `<div><div class="title">${I.starBig}<h1>Today</h1></div><p class="date">${P.today}</p></div>`;
  $('#head').insertAdjacentHTML('beforeend', `<div class="tools"><button class="icon text" data-act="size" aria-label="Text size">Aa</button><a class="icon" href="#admin" aria-label="Admin: account, family and plan">${I.gear}</a></div>`);
}
function renderSide() {
  const hw = K.reduce((a, k) => a + k.homework, 0), late = K.reduce((a, k) => a + k.late, 0);
  $('#side').innerHTML = `
    <button class="nav today${filter < 0 ? ' on' : ''}" data-kid="-1"><span class="ic">${I.star}</span>Everyone</button>
    <div class="side-h">Children</div>
    ${K.map((k, j) => `<button class="nav kidnav${filter === j ? ' on' : ''}" data-kid="${j}">
      <span class="face" style="background:${tint(k.color, .12)}" aria-hidden="true">${k.face}</span>
      <span class="who"><b>${k.name}</b><span class="bar"><i style="width:${(k.done / k.of) * 100}%;background:${k.color}"></i></span></span>
      <span class="n">${k.done} of ${k.of}</span></button>`).join('')}
    <div class="side-h">Look up</div>
    <div class="views">
    <button class="nav" data-act="homework"><span class="ic">${I.pen}</span>Homework<span class="n${late ? ' late' : ''}">${late ? late + ' late' : hw}</span></button>
    <button class="nav" data-act="scores"><span class="ic">${I.chart}</span>Scores<span class="n">${P.scores.length} new</span></button>
    <button class="nav" data-act="program"><span class="ic">${I.book}</span>Program<span class="n">${P.program.subjects} subjects</span></button>
    </div>
    <div class="spacer"></div>
    <button class="nav" data-act="feedback"><span class="ic">${I.home}</span>Send feedback</button>`;
}
function render() { renderHead(); renderSide(); renderList(); }

/* ---------- popover ---------- */
let popFor = null;
function openPop(html, anchor) {
  const pop = $('#pop');
  pop.innerHTML = `<button class="icon x" data-act="close" aria-label="Close">${I.x}</button>` + html;
  pop.classList.add('on'); $('#scrim').classList.add('on');
  const r = anchor.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight, vw = innerWidth, vh = innerHeight;
  let left = Math.min(vw - pw - 16, Math.max(16, r.right - pw));
  let top = r.bottom + 8;
  if (top + ph > vh - 16) top = Math.max(16, r.top - ph - 8);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
  pop.querySelector('button:not(.x)')?.focus({ preventScroll: true });
}
function closePop() { $('#pop').classList.remove('on'); $('#scrim').classList.remove('on'); document.querySelectorAll('.row.sel').forEach((r) => r.classList.remove('sel')); popFor = null; }

function classPop(it) {
  const c = C[it.ci];
  const rows = K.map((k, j) => {
    const s = c.state[j], mark = c.marks && c.marks[j];
    return `<div class="kr"><span class="face" style="background:${tint(k.color, .12)}" aria-hidden="true">${k.face}</span>
      <span class="st"><b>${k.name}</b>. ${stWord[s]}${mark ? `, mark <b>${mark}</b>` : ''}</span>
      ${s === 'done' ? `<button class="btn sec" data-act="mark" data-k="${j}">${mark ? 'Change mark' : 'Give a mark'}</button>` : s === 'missed' ? `<button class="btn sec" data-act="hw" data-k="${j}">Set as homework</button>` : ''}</div>`;
  }).join('');
  return `<h3>${esc(c.subject)}</h3><p class="sub">${esc(c.title)}. Starts ${c.time}${c.lesson ? ', video lesson' : ''}.</p>
    <div class="kids">${rows}</div>
    <div class="acts">${c.lesson ? `<button class="btn pri" data-act="play">${I.tv}Play on the TV</button>` : ''}<button class="btn sec" data-act="hw" data-k="-1">Set homework</button></div>`;
}
function needPop(it) {
  const n = P.needsYou[it.ni];
  return `<h3>${esc(n.what)}</h3><p class="sub">${esc(n.detail)}.</p><div class="acts"><button class="btn pri" data-act="needgo">${esc(n.action)}</button><button class="btn sec" data-act="close">Later</button></div>`;
}
function markPop(ci, j) {
  const c = C[ci], k = K[j], cur = c.marks && c.marks[j];
  return `<h3>Mark for ${k.name}</h3><p class="sub">${esc(c.subject)}: ${esc(c.title)}. Out of 12.</p>
    <div class="mk">${Array.from({ length: 12 }, (_, i) => `<button class="${String(i + 1) === cur ? 'on' : ''}" data-mk="${i + 1}">${i + 1}</button>`).join('')}</div>
    <div class="acts"><button class="btn pri" data-act="savemark" data-ci="${ci}" data-k="${j}">Save mark</button><button class="btn sec" data-act="close">Cancel</button></div>`;
}
function hwPop(ci, j) {
  const c = C[ci], who = j >= 0 ? K[j].name : 'all three';
  return `<h3>Homework for ${who}</h3><p class="sub">${esc(c.subject)}: ${esc(c.title)}</p>
    <label for="hwt">What to do</label><input id="hwt" placeholder="For example: read pages 16 to 18">
    <label>Due</label><div class="chips"><button class="chip on" data-chip>Tomorrow</button><button class="chip" data-chip>Wednesday</button><button class="chip" data-chip>Friday</button></div>
    <div class="acts"><button class="btn pri" data-act="savehw" data-who="${who}">Set homework</button><button class="btn sec" data-act="close">Cancel</button></div>`;
}
function listPop(kind) {
  if (kind === 'scores') return `<h3>New scores</h3><p class="sub">Tests marked since yesterday.</p><div style="margin-top:12px">${P.scores.map((s) => {
    const j = kidOf(s.kid); return `<div class="line"><span>${tag(j)} ${esc(s.what)}, ${s.when.toLowerCase()}</span><span>${s.score}</span></div>`; }).join('')}
    </div><div style="margin-top:14px" class="sub">Averages: ${K.map((k) => `${k.name} ${k.average}`).join(', ')}.</div>`;
  if (kind === 'homework') return `<h3>Homework</h3><p class="sub">Set and not yet handed in.</p><div style="margin-top:12px">${K.map((k, j) => `<div class="line"><span>${tag(j)}</span><span${k.late ? ' class="late"' : ''}>${k.homework ? k.homework + ' to do' + (k.late ? ', ' + k.late + ' late' : '') : 'Nothing set'}</span></div>`).join('')}</div>
    <p class="sub" style="margin-top:12px">Late: English, read pages 12 to 15, due Friday (Leo).</p>`;
  if (kind === 'program') return `<h3>The program</h3><p class="sub">${esc(P.admin.plan)}.</p><div style="margin-top:12px">
    <div class="line"><span>Subjects</span><span>${P.program.subjects}</span></div>
    <div class="line"><span>Video lessons ready</span><span>${P.program.readyLessons}</span></div>
    <div class="line"><span>Where you are</span><span style="max-width:60%">${esc(P.program.where)}</span></div></div>`;
  if (kind === 'size') return `<h3>Text size</h3><p class="sub">Bigger text shows fewer things at once.</p><div class="seg">
    ${['Normal', 'Large', 'Largest'].map((n, i) => `<button data-size="${i + 1}" class="${document.documentElement.className === 't' + (i + 1) || (!document.documentElement.className && i === 0) ? 'on' : ''}" style="font-size:${17 + i * 3}px">${n}</button>`).join('')}</div>`;
  if (kind === 'feedback') return `<h3>Send feedback</h3><p class="sub">Tell us what works and what doesn’t. We read every note.</p>
    <label for="fb">Your note</label><input id="fb" placeholder="Write here">
    <div class="acts"><button class="btn pri" data-act="sendfb">Send</button><button class="btn sec" data-act="close">Cancel</button></div>`;
}

function toast(msg, undo) {
  $('#tmsg').textContent = msg; $('#tundo').style.display = undo ? '' : 'none';
  $('#toast').classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => $('#toast').classList.remove('on'), 4000);
}

/* ---------- taps ---------- */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act],[data-kid],[data-mk],[data-chip],[data-size]');
  const row = e.target.closest('.row');
  if (e.target.id === 'scrim') return closePop();
  if (b && b.dataset.kid !== undefined) { filter = +b.dataset.kid; closePop(); return render(); }
  if (b && b.dataset.mk) { b.parentNode.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); return; }
  if (b && b.dataset.chip !== undefined) { b.parentNode.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === b)); return; }
  if (b && b.dataset.size) { document.documentElement.className = b.dataset.size === '1' ? '' : 't' + b.dataset.size; b.parentNode.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); return; }
  const act = b && b.dataset.act;
  const it = row && items.find((i) => i.id === row.dataset.id);
  if (act === 'tick' && it) {
    e.stopPropagation();
    if (it.group === 'done') return;
    row.classList.add('checked');
    setTimeout(() => { row.style.maxHeight = row.offsetHeight + 'px'; requestAnimationFrame(() => row.classList.add('leaving')); }, 650);
    setTimeout(() => { lastDone = { it, group: it.group }; it.group = 'done'; it.kids = it.kids.concat(it.off.filter(() => false)); render(); toast('Done: ' + (it.ci !== undefined ? C[it.ci].subject : P.needsYou[it.ni].what), true); }, 1150);
    return;
  }
  if (act === 'more') { openDone = !openDone; return renderList(); }
  if (act === 'close') return closePop();
  if (act === 'play') { closePop(); return toast('Playing Science on the TV: The skeleton'); }
  if (act === 'need' && it) { row.classList.add('sel'); return openPop(needPop(it), row); }
  if (act === 'needgo') { const n = P.needsYou[popFor.ni]; closePop(); return toast(n.action === 'Remind' ? 'Reminder sent to Leo' : n.action === 'Rate' ? 'Opening the rating for the Muscles lesson' : 'Opening Leo’s 3 answers'); }
  if (act === 'mark') return openPop(markPop(popFor.ci, +b.dataset.k), $('.row.sel') || $('#list'));
  if (act === 'hw') return openPop(hwPop(popFor.ci, +b.dataset.k), $('.row.sel') || $('#list'));
  if (act === 'savemark') { const m = $('#pop .mk .on'); if (!m) return; closePop(); return toast(`Mark ${m.textContent} saved for ${K[b.dataset.k].name}`); }
  if (act === 'savehw') { closePop(); return toast('Homework set for ' + b.dataset.who); }
  if (act === 'sendfb') { closePop(); return toast('Thank you. Your note is sent.'); }
  if (['scores', 'homework', 'program', 'size', 'feedback'].includes(act)) { popFor = null; return openPop(listPop(act), b); }
  if (row && it && !e.target.closest('button')) {
    document.querySelectorAll('.row.sel').forEach((r) => r.classList.remove('sel'));
    row.classList.add('sel'); popFor = it;
    return openPop(it.ci !== undefined ? classPop(it) : needPop(it), row);
  }
});
document.addEventListener('click', (e) => { const b = e.target.closest('[data-act="need"]'); if (b) { const row = b.closest('.row'); popFor = items.find((i) => i.id === row.dataset.id); } }, true);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closePop();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('row')) { e.preventDefault(); e.target.click(); }
});
$('#tundo').onclick = () => { if (lastDone) { lastDone.it.group = lastDone.group; lastDone = null; render(); } $('#toast').classList.remove('on'); };

/* ---------- admin, its own page ---------- */
const A = P.admin;
const adminSec = {
  'Your account': `<h2>Your account</h2><p class="lead">How you sign in, and how the app looks for you.</p>
    <div class="grp"><div class="box"><div class="r"><span>Name</span><span class="v">${A.account.name}</span></div><div class="r"><span>Username</span><span class="v">${A.account.username}</span></div><button class="r"><span>Password</span><span class="v">Change</span></button><button class="r"><span>Text size</span><span class="v">${A.account.textSize}</span></button></div></div>
    <div class="grp"><div class="box"><button class="r"><span style="color:var(--late);font-weight:600">Sign out</span><span></span></button></div></div>`,
  'Family': `<h2>Family</h2><p class="lead">Everyone in the family uses one sign-in. Children have their own logins inside your account, with no email.</p>
    <div class="grp"><h4>Parents</h4><div class="box">${P.parents.map((p) => `<div class="r"><span>${p.name}</span><span class="v">${p.you ? 'You' : 'Parent'}</span></div>`).join('')}<button class="r"><span style="color:var(--accent);font-weight:600">Invite a parent</span><span></span></button></div></div>
    <div class="grp"><h4>Children</h4><div class="box">${K.map((k) => `<button class="r"><span><span class="face">${k.face}</span>${k.name}</span><span class="v">${k.year}</span></button>`).join('')}</div></div>`,
  'Learning plan': `<h2>Learning plan</h2><p class="lead">What the program follows. We say the program follows a curriculum; it is not approved by anyone.</p>
    <div class="grp"><div class="box"><button class="r"><span>Curriculum</span><span class="v">${A.plan}</span></button><button class="r"><span>Word help</span><span class="v">${A.wordHelp}</span></button><div class="r"><span>Subjects</span><span class="v">${P.program.subjects}</span></div><div class="r"><span>Video lessons ready</span><span class="v">${P.program.readyLessons}</span></div></div></div>`,
  'Plan and billing': `<h2>Plan and billing</h2><p class="lead">The service is charged per child. You are on the free family trial.</p>
    <div class="grp"><div class="box"><div class="r"><span>Your plan</span><span class="v">${A.billing}</span></div><div class="r"><span>Children on the plan</span><span class="v">${K.length}</span></div></div></div>`,
  'Feedback and checks': `<h2>Feedback and checks</h2><p class="lead">Tell us what to fix, and keep exams fair.</p>
    <div class="grp"><div class="box"><button class="r" data-act="feedback"><span>Send feedback</span><span class="v">Write a note</span></button><button class="r"><span>Exam PIN</span><span class="v">${A.examPin}</span></button></div></div>`,
};
let adminCur = A.sections[0];
function renderAdmin() {
  $('#admin').innerHTML = `<aside><a class="back" href="#">${I.back}Today</a><h1>Admin</h1>
    ${A.sections.map((s) => `<button class="nav${s === adminCur ? ' on' : ''}" data-sec="${s}">${s}</button>`).join('')}</aside>
    <div class="sec">${adminSec[adminCur]}</div>`;
}
$('#admin').addEventListener('click', (e) => { const b = e.target.closest('[data-sec]'); if (b) { adminCur = b.dataset.sec; renderAdmin(); } });

function route() {
  closePop();
  const admin = location.hash === '#admin';
  document.body.classList.toggle('admin-on', admin);
  if (admin) { renderAdmin(); scrollTo(0, 0); } else render();
}
addEventListener('hashchange', route); route();
</script>
</body>
</html>
