<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Materials: Shelves</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,800&display=swap">
<link rel="stylesheet" href="../lab.css">
<style>
/* A. Shelves. Learnt from the App Store's Today tab and Apple Books (one big story on top), and Netflix and the Khan Kids Library (rows by kind).
   Ladder: 1 main: this week's pack, its pages fanned out, one red Print. 2 secondary: shelf names. 3 supporting: each page and its title. 4 quiet: time and sheets, the bars. */
:root { --sec: calc(var(--fs) * 1.5); --cw: clamp(130px, 13vw, 175px); }
.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: center; gap: 1.2em; margin: .4em 0 1.4em; padding: 1.1em 1.6em; background: var(--surface); border-radius: 28px; box-shadow: 0 1px 2px #17131F14; }
.hero h2 { font: 800 var(--main)/1.02 var(--dfont); letter-spacing: -.02em; }
.hero .when { margin-top: .3em; color: var(--mute); }
.who { display: flex; flex-wrap: wrap; align-items: center; gap: .4em; }
.who > .quiet { margin-right: .2em; }
.hero .who { margin: .8em 0 .9em; }
.hero .acts { display: flex; flex-wrap: wrap; gap: .6em; }
.fan { position: relative; height: clamp(220px, 32vh, 290px); }
.fan .page { position: absolute; top: 50%; height: 92%; transform-origin: 50% 100%; transition: transform .3s ease-out; }
.fan button { position: absolute; inset: 0; background: none; border: 0; padding: 0; }
.shelves { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: dense; gap: 0 2.4em; }
.shelf { min-width: 0; margin-bottom: 1.5em; }
.shelf.wide { grid-column: 1 / -1; }
.paper { margin-top: .5em; }
.shelf h2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 .5em; font: 800 var(--sec)/1.1 var(--dfont); letter-spacing: -.01em; }
.shelf h2 .ic { align-self: center; width: .8em; height: .8em; color: var(--mute); }
.shelf h2 .quiet { font-family: var(--font); font-weight: 400; letter-spacing: 0; }
.row { display: grid; grid-auto-flow: column; grid-auto-columns: var(--cw); gap: 1.1em; overflow-x: auto; scroll-snap-type: x mandatory; padding: .7em .2em 1em; margin-inline: -.2em; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.item { display: grid; gap: .55em; align-content: start; padding: 0; background: none; border: 0; text-align: left; scroll-snap-align: start; }
.item .page { transition: transform .15s ease-out; }
.item:hover .page { transform: translateY(-3px); }
.item span { line-height: 1.2; }
/* The sheet: one page, large, with what it is and the two ways to use it */
.sheet { position: fixed; inset: 0; z-index: 10; display: grid; align-items: end; background: #17131F66; opacity: 0; pointer-events: none; transition: opacity .25s ease-out; }
.sheet.open { opacity: 1; pointer-events: auto; }
.sheetBox { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2em; max-height: 92vh; padding: 1.6em 2em 1.8em; background: var(--bg); border-radius: 28px 28px 0 0; transform: translateY(40px); transition: transform .3s ease-out; overflow-y: auto; }
.sheet.open .sheetBox { transform: none; }
.sheetBox > .page { height: min(66vh, 560px); }
.info { display: flex; flex-direction: column; gap: .7em; min-width: 0; }
.sheetBox { position: relative; }
.x { position: absolute; top: 1em; right: 1.2em; z-index: 1; }
.info { padding-top: 2.6em; }
.info h2 { font: 800 var(--main)/1.02 var(--dfont); letter-spacing: -.02em; }
.info .acts { display: flex; flex-wrap: wrap; gap: .6em; margin-top: .4em; }
.info .facts { color: var(--mute); }
@media (max-width: 600px) {
  :root { --main: 32px; --cw: 128px; }
  .hero { grid-template-columns: 1fr; padding: 1em; border-radius: 22px; }
  .fan { order: -1; height: 190px; }
  .hero .acts .btn { flex: 1 1 100%; }
  .sheetBox { grid-template-columns: 1fr; gap: 1em; padding: 1em 14px 1.4em; }
  .sheetBox > .page { height: 30vh; justify-self: center; margin-top: 2.6em; }
  .info { padding-top: 0; }
  .shelves { grid-template-columns: 1fr; }
  .info .acts .btn { flex: 1 1 100%; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Material"><div class="sheetBox" id="sheetBox"></div></div>
<script src="../../assets/colombia-map.js"></script>
<script src="../data.js"></script>
<script src="../thumbs.js"></script>
<script src="../chrome.js"></script>
<script>
(function () {
  const { kids, SHELVES, ITEMS, WEEK, byId, sheetsOf } = window.MAT, { icon, head, nav, page, esc, names, kidChips, STATUS, sheets, SEND, EACH } = window.UI;
  const time = (i) => (i.mins ? `${i.mins} min` : 'Any time');
  const card = (i) => `<button class="item" data-open="${i.id}">${page(i.kind)}<span>${esc(i.title)}</span><span class="quiet">${i.perKid ? EACH() : `${sheets(i.pages)}, ${time(i)}`}</span></button>`;
  const fan = () => { const pages = WEEK.items.slice(0, 5), mid = (pages.length - 1) / 2;
    return pages.map((id, n) => { const d = n - mid; return `<div class="page" style="left:calc(50% - 16% + ${d * 13}%);transform:translateY(-50%) rotate(${d * 5}deg) translateY(${Math.abs(d) * 6}px);z-index:${10 - Math.abs(Math.round(d))}">${window.THUMB(byId(id).kind)}</div>`; }).join(''); };
  /* Short shelves sit two side by side, so the iPad's width is used and the page stays short. */
  const shelves = () => `<div class="shelves">${SHELVES.map((s) => { const list = ITEMS.filter((i) => i.shelf === s.id); return list.length ? `<section class="shelf ${list.length > 3 ? 'wide' : ''}"><h2>${s.id === 'parents' ? icon('lock') : ''}${esc(s.title)}<span class="quiet">${esc(s.say)}</span></h2><div class="row">${list.map(card).join('')}</div></section>` : ''; }).join('')}</div>`;
  function draw() {
    const total = sheetsOf(WEEK.items, kids.length);
    document.getElementById('app').innerHTML = `${head('Materials')}<main class="main">
      <section class="hero"><div><h2>${esc(WEEK.title)}</h2><p class="when">${esc(WEEK.dates)}. ${WEEK.items.length} pages from this week’s lessons and timetable</p>
        <div class="who" aria-label="Who gets it"><span class="quiet">For</span>${kidChips(kids)}</div>
        <div class="acts"><button class="btn fill">${icon('print')}Print the pack</button><button class="btn">${icon('tablet')}${SEND()}</button></div><p class="quiet paper">${total} sheets of paper in all</p></div>
        <div class="fan" aria-hidden="true">${fan()}<button data-open="mu-sheet" tabindex="-1"></button></div></section>
      ${shelves()}</main>${nav()}`;
  }
  const sheet = document.getElementById('sheet'), box = document.getElementById('sheetBox');
  function open(id) {
    const i = byId(id) || byId('mu-sheet'), shelf = SHELVES.find((s) => s.id === i.shelf);
    const who = i.parentOnly ? `<p>${icon('lock')} Only parents can see this. Children never get it early.</p>` : `<div class="who" aria-label="Who gets it"><span class="quiet">For</span>${kidChips(kids)}</div>`;
    box.innerHTML = `<button class="btn x" data-close aria-label="Close">${icon('close')}Close</button>${page(i.kind)}<div class="info">
      <p class="quiet">${esc(shelf.title)}</p><h2>${esc(i.title)}</h2><p>${esc(i.what)}</p>
      <p class="facts">${i.perKid ? EACH() : sheets(i.pages)}, ${time(i)}. ${esc(i.from)}</p>${who}
      <div class="acts"><button class="btn fill">${icon('print')}Print${i.perKid ? ` for ${names(kids)}` : ''}</button>${i.both && !i.parentOnly ? `<button class="btn">${icon('tablet')}${SEND()}</button>` : ''}</div>
      <p class="quiet">${STATUS[i.status]}</p></div>`;
    sheet.classList.add('open'); box.querySelector('[data-close]').focus({ preventScroll: true });
  }
  const close = () => sheet.classList.remove('open');
  document.addEventListener('click', (e) => {
    const o = e.target.closest('[data-open]'); if (o) { open(o.dataset.open); return; }
    if (e.target.closest('[data-close]') || e.target === sheet) close();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  draw();
  if (location.hash === '#open') open('mu-sheet');
})();
</script>
</body>
</html>
