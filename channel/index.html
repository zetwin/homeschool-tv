.whCheck { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); gap: 10px 28px; }
.whCheck label { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); align-items: center; gap: 10px; font-weight: 600; }
@media (max-width: 760px) { .whCheck label { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
.whCheck input { font: inherit; font-size: 17px; padding: 8px 10px; border: 2px solid #CFCADC; border-radius: 8px; min-width: 0; }

.famFirst { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--paper); }
.famFirst .famCard { width: min(560px, 100%); }
.famFirst h1 { margin: 0; }
.removeAsk { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; background: #FBE4E1; border-radius: 10px; color: #17131F; }
.removeAsk p { flex: 1 1 280px; }
.dangerBtn { background: #B3261E; color: #fff; }
/* ---------- Tests and exams: one question, one screen, no scrolling. The action is always at the bottom ---------- */
.tq { height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
.tqTop, .tqBar { display: flex; align-items: center; gap: clamp(8px, 1.2vw, 18px); background: var(--panel) var(--panI, none); background-size: var(--panS, auto); padding: 10px max(16px, env(safe-area-inset-left, 0px)); color: var(--tx); }
.tqTop { padding-right: 76px; min-height: 48px; border-bottom: var(--panB, 1px solid var(--line)); }
.tqDots { list-style: none; margin: 0; padding: 0; flex: 1 1 120px; display: flex; gap: 4px; min-width: 60px; }
.tqDots li { flex: 1; height: 10px; background: var(--inp); border-radius: var(--rb, 99px); box-shadow: inset 0 0 0 1px var(--line); }
.tqDots .on { background: var(--acc); box-shadow: none; } .tqDots .yes { background: var(--ok); box-shadow: none; } .tqDots .no { background: var(--no); box-shadow: none; }
.tqCount { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tqTitle { flex: 1 1 auto; font-family: var(--head); font-style: var(--hs, normal); font-weight: var(--hw, 800); min-width: 0; color: var(--title, var(--tx)); }
.tqMain { --fit: 1; position: relative; min-height: 0; overflow: hidden; display: grid; }
.tqMain.hasPic { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.tqMain.noPic { grid-template-columns: minmax(0, 1fr); } .tqMain.noPic .tqPic { display: none; }
.tqAsk { display: grid; gap: calc(clamp(8px, 1.6vh, 20px) * var(--fit)); align-content: center; padding: calc(clamp(12px, 2.4vw, 40px) * var(--fit)); min-width: 0; min-height: 0; color: var(--tx); }
.tqMain:not(.hasPic):not(.tqType-tap, .tqType-region, .tqType-estimate) .tqAsk { width: min(100%, 1100px); justify-self: center; }
.tqKind { font-size: calc(clamp(14px, 1.05vw, 17px) * var(--fit)); font-weight: 700; color: var(--mu); }
.tq .tqAsk h1 { margin: 0; font-size: calc(clamp(24px, min(3vw, 5.2vh), 52px) * var(--fit)); line-height: 1.08; text-transform: var(--hcq, none); text-wrap: balance; }
.tqPic { margin: 0; min-height: 0; min-width: 0; background: var(--inp); overflow: hidden; }
.tqPic img { display: block; width: 100%; height: 100%; object-fit: contain; }
.tqBar { justify-content: space-between; min-height: 76px; padding-block: 10px; padding-right: max(16px, env(safe-area-inset-right, 0px)); border-top: var(--panB, 1px solid var(--line)); }
.tqSay { flex: 1 1 auto; min-width: 0; font-size: clamp(15px, 1.3vw, 22px); line-height: 1.22; color: var(--mu); }
.tqSay b { font-family: var(--head); font-style: var(--hs, normal); font-weight: var(--hw, 800); margin-right: 6px; }
.tqBar.good { background: var(--ok); } .tqBar.bad { background: var(--no); }
.tqBar.good .tqSay { color: var(--okT, #fff); } .tqBar.bad .tqSay { color: #fff; }
.tqBar.good .btn, .tqBar.bad .btn { background: #fff; color: #17131F; box-shadow: none; text-shadow: none; }
.tq .tqBar .btn { flex: none; }
.tqBtns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
/* Figure questions: the thing on the left, the question on the right */
.tqMain:is(.tqType-tap, .tqType-region, .tqType-estimate) .tqAsk { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); grid-template-rows: 1fr auto auto 1fr; column-gap: clamp(20px, 3vw, 60px); row-gap: 8px; padding-block: 12px; align-content: stretch; }
.tqMain:is(.tqType-tap, .tqType-region, .tqType-estimate) #qBox { grid-column: 1; grid-row: 1 / -1; justify-items: center; align-self: center; }
.tqMain:is(.tqType-tap, .tqType-region, .tqType-estimate) .tqKind { grid-column: 2; grid-row: 2; }
.tqMain:is(.tqType-tap, .tqType-region, .tqType-estimate) h1 { grid-column: 2; grid-row: 3; }
.xray { background: radial-gradient(circle at 50% 38%, #24496B, #0B1724 74%); border-radius: var(--rs, 10px); box-shadow: inset 0 0 0 2px #FFFFFF1A; }
.tq .tapFig { height: calc((100dvh - 170px) * var(--fit)); max-height: 680px; width: auto; aspect-ratio: 240 / 645; justify-self: center; padding-block: 6px; box-sizing: border-box; }
.tq .tapFig svg { display: block; width: 100%; height: 100%; }
.tq .rmap { width: auto; max-width: 100%; height: calc((100dvh - 170px) * var(--fit)); max-height: 680px; }
.tq .qMountain, .tq .qEstimate input { height: calc((100dvh - 190px) * var(--fit)); max-height: 620px; }
.tq .qEstimate { width: 100%; max-width: 760px; }
/* Answer cards */
.qCards { display: grid; gap: calc(10px * var(--fit, 1)); grid-template-columns: repeat(2, minmax(0, 1fr)); }
.qCards.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .qCards.n5, .qCards.n6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.hasPic .qCards { grid-template-columns: minmax(0, 1fr); }
.hasPic .qCards.n5, .hasPic .qCards.n6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.qCard { display: flex; align-items: center; gap: 12px; width: 100%; min-height: calc(clamp(56px, 8.4vh, 88px) * var(--fit, 1)); padding: 8px 16px; text-align: left; background: var(--q-card); color: var(--q-ink); border: var(--ansL, var(--inB, 2px solid var(--q-line))); border-radius: var(--rs, 10px); box-shadow: var(--ansS, none); font: inherit; font-weight: 700; font-size: calc(clamp(17px, 1.5vw, 26px) * var(--fit, 1)); line-height: 1.15; cursor: pointer; transition: transform .1s; }
.qCard:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--ansS, none), 0 0 0 3px var(--q-accent); }
.qCard:active:not(:disabled) { transform: scale(.98); }
.qCard > i { flex: none; display: grid; place-items: center; width: 1.7em; height: 1.7em; font-style: normal; font-weight: 800; font-size: .85em; background: var(--sel, #0001); border-radius: var(--rk, 6px); }
.qCard.on { background: var(--sel, #0001); box-shadow: inset 0 0 0 3px var(--q-accent); }
.qCard.on > i { background: var(--q-accent); color: var(--q-accent-fg); }
.qCard.right { background: var(--q-good); color: var(--okT, #fff); border-color: var(--q-good); box-shadow: none; animation: qPop .3s; } .qCard.right > i { background: #0003; color: inherit; }
.qCard.wrong { background: var(--q-bad); color: #fff; border-color: var(--q-bad); box-shadow: none; animation: qShake .3s; } .qCard.wrong > i { background: #0003; color: inherit; }
.qCard.wrong::after { content: "Your answer"; margin-left: auto; font-size: .72em; font-weight: 800; white-space: nowrap; }
.qCard.dim { opacity: .4; }
.qCard.missed { box-shadow: inset 0 0 0 3px var(--q-good); }
.qCard.missed::after { content: "You missed this"; margin-left: auto; font-size: .72em; font-weight: 800; color: var(--q-good); white-space: nowrap; }
@keyframes qPop { 40% { transform: scale(1.04); } } @keyframes qShake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { .qCard.right, .qCard.wrong { animation: none; } }
/* True or false: a card to swipe */
.tfStage { display: grid; gap: calc(14px * var(--fit, 1)); justify-items: center; overflow: hidden; padding: 6px 4px; }
.tfCard { position: relative; width: min(100%, 640px); min-height: calc(clamp(130px, 26vh, 260px) * var(--fit, 1)); display: grid; place-items: center; padding: 20px 24px; text-align: center; background: var(--q-card); color: var(--q-ink); border: var(--ansL, var(--inB, 2px solid var(--q-line))); border-radius: var(--r, 14px); box-shadow: 0 6px 18px #0002; font-weight: 700; font-size: calc(clamp(20px, 2vw, 32px) * var(--fit, 1)); line-height: 1.2; cursor: grab; user-select: none; }
.tfCard[data-lean="true"] { box-shadow: inset 0 0 0 4px var(--q-good); } .tfCard[data-lean="false"] { box-shadow: inset 0 0 0 4px var(--q-bad); }
.tfBtns { display: flex; align-items: center; gap: 16px; font-weight: 700; color: var(--q-soft); }
.tfBtns button { min-height: 58px; min-width: 130px; padding: 6px 20px; border: 0; border-radius: var(--rs, 10px); color: #fff; font: inherit; font-weight: 800; font-size: clamp(18px, 1.5vw, 24px); cursor: pointer; }
.tfNo { background: var(--q-bad); } .tfYes { background: var(--q-good); color: var(--okT, #fff) !important; }
.qGrid { display: grid; gap: calc(8px * var(--fit, 1)); }
.qRow { display: flex; justify-content: space-between; align-items: center; gap: 14px; width: 100%; padding: calc(10px * var(--fit, 1)) 14px; text-align: left; background: var(--q-card); color: var(--q-ink); border: var(--inB, 2px solid var(--q-line)); border-radius: var(--rs, 10px); font: inherit; font-size: calc(clamp(16px, 1.35vw, 22px) * var(--fit, 1)); font-weight: 600; }
.qRow b { flex: none; }
/* Words built from letter tiles */
.qSlots, .qTiles { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.qSlot, .qTile { display: grid; place-items: center; width: calc(clamp(38px, 4vw, 58px) * var(--fit, 1)); height: calc(clamp(44px, 4.6vw, 66px) * var(--fit, 1)); padding: 0; font: inherit; font-weight: 800; font-size: calc(clamp(20px, 2vw, 32px) * var(--fit, 1)); text-transform: uppercase; border-radius: var(--rs, 8px); cursor: pointer; }
.qSlot { background: transparent; color: var(--q-ink); border: 0; border-bottom: 4px solid var(--q-line); border-radius: 0; }
.qTile { background: var(--q-accent); color: var(--q-accent-fg); border: var(--btnB, 0); box-shadow: var(--btnS, none); transition: transform .1s; }
.qTile:hover:not(:disabled) { transform: translateY(-2px); } .qTile:disabled { opacity: .18; cursor: default; }
.qTiles { margin-top: calc(14px * var(--fit, 1)); }
.qSlots.right .qSlot { color: var(--q-good); border-color: var(--q-good); } .qSlots.wrong .qSlot { color: var(--q-bad); border-color: var(--q-bad); }
/* Number pad */
.qDisplay { display: flex; align-items: baseline; justify-content: center; gap: 10px; min-height: 1.3em; padding: 2px 16px; font-size: calc(clamp(30px, 3.4vw, 54px) * var(--fit, 1)); font-variant-numeric: tabular-nums; background: var(--q-card); color: var(--q-ink); border: var(--inB, 2px solid var(--q-line)); border-radius: var(--rs, 10px); }
.qDisplay b { font-family: var(--display); } .qDisplay span { font-size: .5em; font-weight: 700; }
.qDisplay.right { background: var(--q-good); color: var(--okT, #fff); } .qDisplay.wrong { background: var(--q-bad); color: #fff; }
.qPad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(6px * var(--fit, 1)); width: min(100%, 340px); justify-self: center; margin-inline: auto; }
.qPad button { min-height: calc(clamp(40px, 7vh, 62px) * var(--fit, 1)); background: var(--q-card); color: var(--q-ink); border: var(--ansL, var(--inB, 2px solid var(--q-line))); border-radius: var(--rs, 8px); box-shadow: var(--ansS, none); font: inherit; font-weight: 800; font-size: calc(clamp(20px, 2vw, 30px) * var(--fit, 1)); cursor: pointer; }
.qPad button:active { background: var(--q-accent); color: var(--q-accent-fg); }
/* Number line */
.qLine { position: relative; padding-top: calc(52px * var(--fit, 1)); width: min(100%, 860px); margin-inline: auto; }
.qLine.small { padding-top: 36px; width: min(100%, 560px); }
.qLine output { position: absolute; top: 0; transform: translateX(-50%); padding: 3px 12px; white-space: nowrap; font: 800 calc(clamp(18px, 1.8vw, 28px) * var(--fit, 1)) var(--display); background: var(--q-accent); color: var(--q-accent-fg); border-radius: var(--rs, 8px); font-variant-numeric: tabular-nums; }
.qLine.small output { font-size: 16px; background: transparent; color: var(--q-ink); }
.qLine output.right { background: var(--q-good); color: #fff; } .qLine output.wrong { background: var(--q-bad); color: #fff; }
.qTrack { position: relative; }
.qTrack input { position: relative; width: 100%; height: 44px; margin: 0; accent-color: var(--q-accent); display: block; }
.qBand { position: absolute; top: 10px; height: 24px; background: var(--q-good); opacity: .55; border-radius: 6px; }
.qEnds { display: flex; justify-content: space-between; gap: 12px; color: var(--q-soft); font-size: calc(15px * var(--fit, 1)); } .qEnds b { color: var(--q-ink); }
.qRuler svg { display: block; width: 100%; max-width: 760px; max-height: 24vh; margin-inline: auto; }
.qRuler .rBody { fill: #F3E7B5; stroke: #8A7338; stroke-width: 2; } .qRuler line { stroke: #5A4A1C; stroke-width: 1.5; } .qRuler text { font: 700 13px Arial, sans-serif; fill: #3D3210; }
.qRuler .rBone { fill: #E9E3D2; stroke: #17131F; stroke-width: 2; }
/* Muscle */
.qMuscle svg { display: block; width: 100%; max-width: 620px; max-height: calc(30vh * var(--fit, 1)); margin-inline: auto; }
.qMuscleAsk { display: grid; gap: 8px; } .qMuscleAsk[hidden] { display: none; }
.qAskLine { font-weight: 700; font-size: calc(clamp(17px, 1.5vw, 24px) * var(--fit, 1)); }
.qPlay { display: inline-flex; align-items: center; justify-self: center; gap: 10px; min-height: 60px; padding: 6px 22px; background: var(--q-accent); color: var(--q-accent-fg); border: 0; border-radius: var(--rs, 10px); font: inherit; font-weight: 800; font-size: clamp(17px, 1.5vw, 24px); cursor: pointer; }
.qPlay svg { width: 30px; height: 30px; }
/* Dragging */
.qGhost { position: fixed; z-index: 60; margin: 0; pointer-events: none; transform: translate(-50%, -50%) rotate(2deg) scale(1.05); box-shadow: 0 10px 24px #0005; }
.qLifted { opacity: .35; }
.tq .chip { font-size: calc(clamp(16px, 1.4vw, 23px) * var(--fit, 1)); min-height: calc(50px * var(--fit, 1)); padding-inline: 18px; cursor: grab; touch-action: none; }
.tq .labelBank { justify-content: center; }
.tq .qSentence { font-size: calc(clamp(21px, 2.2vw, 36px) * var(--fit, 1)); line-height: 1.7; }
.qGap.cur { border-color: var(--q-accent); box-shadow: 0 0 0 3px var(--q-accent); }
.qGap.over, .sortBin.over, [data-right].over, .labelPin.over { outline: 4px solid var(--q-accent); outline-offset: 2px; }
.tq .sortChip { font-size: calc(clamp(16px, 1.4vw, 22px) * var(--fit, 1)); min-height: calc(50px * var(--fit, 1)); touch-action: none; }
.tq .sortChip img { width: calc(46px * var(--fit, 1)); height: calc(46px * var(--fit, 1)); }
.tq .sortBin { min-height: calc(clamp(120px, 26vh, 240px) * var(--fit, 1)); }
.tq .sortBank { justify-content: center; min-height: calc(54px * var(--fit, 1)); }
.tq .sortBank:empty { min-height: 0; }
/* Connect */
.tq .qMatch { gap: clamp(40px, 8vw, 130px); }
.tq .matchCol { gap: calc(8px * var(--fit, 1)); }
.tq .matchItem { position: relative; min-height: calc(clamp(52px, 8.6vh, 84px) * var(--fit, 1)); font-size: calc(clamp(16px, 1.4vw, 23px) * var(--fit, 1)); background: var(--q-card); color: var(--q-ink); border: var(--ansL, var(--inB, 2px solid var(--q-line))); border-radius: var(--rs, 10px); box-shadow: var(--ansS, none); cursor: grab; touch-action: none; }
.tq .matchItem .dot { position: absolute; top: 50%; right: -8px; width: 16px; height: 16px; margin-top: -8px; background: var(--q-accent); border-radius: 50%; box-shadow: 0 0 0 3px var(--panel, #fff); }
.tq [data-right] .dot { right: auto; left: -8px; }
.tq .matchItem.hasImg { padding-right: 16px; } .tq .matchItem.hasImg img { height: calc(clamp(52px, 8.6vh, 84px) * var(--fit, 1)); width: calc(clamp(70px, 8vw, 120px) * var(--fit, 1)); border-radius: var(--rs, 8px) 0 0 var(--rs, 8px); }
.tq .matchItem.picked { background: var(--q-accent); color: var(--q-accent-fg); }
/* Order */
.tq .qOrder { gap: calc(7px * var(--fit, 1)); }
.tq .qOrder li { position: relative; min-height: calc(clamp(48px, 7.8vh, 74px) * var(--fit, 1)); padding-block: 4px; overflow: hidden; font-size: calc(clamp(16px, 1.45vw, 24px) * var(--fit, 1)); cursor: grab; touch-action: none; user-select: none; background: var(--q-card); color: var(--q-ink); border: var(--ansL, var(--inB, 2px solid var(--q-line))); border-radius: var(--rs, 10px); box-shadow: var(--ansS, none); }
.tq .qOrder li > i { position: absolute; left: 0; top: 0; bottom: 0; width: 12px; margin: 0; border-radius: 0; }
.tq .qOrder li:has(> i) { padding-left: 24px; }
.tq .qOrder li.picked { box-shadow: inset 0 0 0 3px var(--q-accent); }
.tq .qOrder li.qLifted { opacity: 1; z-index: 2; box-shadow: 0 8px 20px #0004, inset 0 0 0 3px var(--q-accent); }
.tq .qOrder em { font-style: normal; font-size: 1.3em; color: var(--q-soft); }
.tq .qOrder small { font-weight: 700; font-size: .75em; white-space: nowrap; }
.tq .qOrder li.right { background: var(--q-good); color: var(--okT, #fff); } .tq .qOrder li.wrong { background: var(--q-bad); color: #fff; }
/* Label: names go on the figure itself */
.labelQ { display: flex; flex-wrap: wrap; gap: clamp(16px, 3vw, 44px); align-items: center; justify-content: center; }
.labelFig { height: calc((100dvh - 250px) * var(--fit, 1)); max-height: 600px; aspect-ratio: 240 / 645; width: auto; }
.labelFig svg { display: block; width: 100%; height: 100%; }
.labelQ .labelBank { flex: 0 1 300px; }
.labelPin::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; }
.labelPin { position: absolute; width: 36px; height: 36px; margin: -18px; padding: 0; background: var(--q-accent); color: var(--q-accent-fg); border: 3px solid #fff; border-radius: 50%; font: 800 17px var(--display); cursor: pointer; }
.labelPin.right { background: var(--q-good); } .labelPin.wrong { background: var(--q-bad); color: #fff; }
.labelTag { position: absolute; top: 50%; transform: translateY(-50%); white-space: nowrap; padding: 3px 10px; background: var(--panel, #fff); color: var(--tx, #17131F); border-radius: 6px; font: 700 clamp(14px, 1.1vw, 18px) var(--body); box-shadow: 0 3px 10px #0004; pointer-events: none; }
.labelTag.r { left: 130%; } .labelTag.l { right: 130%; }
/* Pictures */
.qPics img { height: calc(clamp(120px, 28vh, 280px) * var(--fit, 1)); }
/* Exam */
.tqExamBody { display: grid; grid-template-columns: minmax(0, 1fr) clamp(190px, 16vw, 250px); min-height: 0; }
.tqPalette { padding: 12px; overflow: hidden; background: var(--panel) var(--panI, none); background-size: var(--panS, auto); border-left: var(--panB, 1px solid var(--line)); color: var(--tx); display: grid; gap: 8px; align-content: start; }
.tqPalette h3 { margin: 0; font-size: 13px; grid-column: 1 / -1; }
.tqPalette .palette button { min-height: clamp(30px, 5vh, 44px); }
.tqPalette .key { list-style: none; margin: 0; padding: 0; font-size: 14px; display: grid; gap: 3px; }
/* Checking written answers after the exam: the child's answer beside the model answer, point by point. One mark a ticked point. */
.tqType-check .tqAsk { align-content: start; padding-top: calc(clamp(16px, 5vh, 56px) * var(--fit)); }
.checkIntro { margin: 0; font-size: calc(clamp(15px, 1.2vw, 19px) * var(--fit)); font-weight: 700; color: var(--tx); }
.checkGrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: calc(clamp(14px, 2.2vw, 36px) * var(--fit)); align-items: start; }
.tq :is(.checkMine, .checkModel) h2 { margin: 0 0 calc(8px * var(--fit)); font-size: calc(clamp(15px, 1.15vw, 19px) * var(--fit)); font-weight: 800; color: var(--mu); }
.checkMine blockquote { margin: 0; padding: calc(12px * var(--fit)) calc(16px * var(--fit)); background: var(--inp); border-left: 4px solid var(--line); border-radius: var(--rs, 10px); font-size: calc(clamp(17px, 1.45vw, 24px) * var(--fit)); line-height: 1.4; max-height: 44dvh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.checkBlank { margin: 0; font-size: calc(clamp(17px, 1.45vw, 24px) * var(--fit)); color: var(--mu); }
.checkHow { margin: 0; font-size: calc(clamp(16px, 1.25vw, 20px) * var(--fit)); line-height: 1.3; font-weight: 600; }
.tq .checkPoints .qCard:not(.on) > i { background: transparent; box-shadow: inset 0 0 0 2px var(--tx); }
.tq .checkPoints .qCard:disabled:not(.on) > i { box-shadow: inset 0 0 0 2px var(--mu); }
