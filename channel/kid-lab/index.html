<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screen Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Inter:wght@400;500;600;700&family=Figtree:wght@500;600;700&family=Manrope:wght@500;600;700;800&family=Fraunces:ital,opsz,SOFT,wght@0,9..144,0..100,400;0,9..144,0..100,500;1,9..144,0..100,400&family=Anton&family=Barlow+Condensed:wght@600;800&family=Chakra+Petch:wght@500;700&family=Archivo:wght@500;700;900&family=Baloo+2:wght@500;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Fredoka:wght@500;600;700&family=Gochi+Hand&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600;700&family=Jersey+20&family=Lilita+One&family=Nunito:wght@600;700;800;900&family=Outfit:wght@400;500;700;800&family=Patrick+Hand&family=Rubik:wght@500;700;800;900&display=swap">
<style>
/* Layout concept: a light table of real kids' screens. Each screen is a true iPad or phone size, scaled to fit, so directions can be compared side by side. */
:root { color-scheme: dark; --shell: #1C1B22; --shellPanel: #2A2832; --shellInk: #F4F2F8; --shellMute: #B5B1C2; --shellAcc: #FFC400; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--shell); color: var(--shellInk); font: 500 15px/1.35 Outfit, system-ui, sans-serif; min-height: 100vh; padding-block: 12px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
.labHead { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; margin-bottom: 10px; }
.labHead h1 { margin: 0; font: 800 26px/1 "Bricolage Grotesque", sans-serif; }
.seg { display: flex; flex-wrap: wrap; gap: 3px; background: var(--shellPanel); padding: 3px; border-radius: 9px; }
.seg button { min-height: 38px; padding: 4px 12px; background: none; border: 0; border-radius: 7px; font-weight: 700; color: var(--shellMute); }
.seg [aria-pressed="true"] { background: var(--shellAcc); color: #17131F; }
.pick { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
.pick button { min-height: 38px; padding: 4px 11px; background: var(--shellPanel); border: 0; border-radius: 7px; font-weight: 700; }
.pick [aria-pressed="true"] { background: #fff; color: #17131F; }
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 18px 14px; }
.tile { display: grid; gap: 6px; cursor: pointer; }
.tile:focus-visible { outline: 3px solid var(--shellAcc); outline-offset: 3px; }
.tile b { font: 800 17px "Bricolage Grotesque", sans-serif; } .tile small { color: var(--shellMute); }
.fit { position: relative; overflow: hidden; border-radius: 10px; background: #000; }
.fit > .screen { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
.solo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, 300px); gap: 16px; align-items: start; }
.solo .fit > .screen { pointer-events: auto; }
.notes { display: grid; gap: 9px; background: var(--shellPanel); padding: 14px 16px; border-radius: 10px; }
.notes h2 { margin: 0; font: 800 24px/1.05 "Bricolage Grotesque", sans-serif; }
.notes p { margin: 0; }
.notes dl { margin: 0; display: grid; gap: 7px; } .notes dt { font-weight: 800; color: var(--shellAcc); font-size: 13px; } .notes dd { margin: 0; font-size: 14.5px; }
@media (max-width: 860px) { .solo { grid-template-columns: minmax(0, 1fr); } }

/* Every screen is a real device size */
.screen { container: screen / size; width: 1180px; height: 820px; overflow: hidden; position: relative; font-family: var(--font); color: var(--ink); background: var(--bg); }
.screen.phone { width: 390px; height: 844px; }
.screen * { box-sizing: border-box; }
.screen button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; transition: transform .12s; }
.screen button:active { transform: scale(.97); }
.screen img { display: block; }
.screen h2, .screen h3, .screen p, .screen ul, .screen ol { margin: 0; padding: 0; list-style: none; }

/* ---------- A. Big Three: giant blocks of color, edge to edge ---------- */
.dA { --font: Fredoka, sans-serif; --head: "Bricolage Grotesque", sans-serif; --bg: #fff; --ink: #111; --card: #fff; --cardInk: #111; --acc: #FF3D2E; --accInk: #fff; --line: #111; --r: 0; --shadow: none; --border: 0; }
.dA .h { display: grid; grid-template-columns: 1.55fr 1fr; grid-template-rows: 1fr 1fr; height: 100%; }
.dA .learn { grid-row: 1 / 3; position: relative; background: #FF3D2E; color: #fff; padding: 34px; display: grid; align-content: space-between; overflow: hidden; width: 100%; }
.dA .learn > img { position: absolute; right: -40px; top: 110px; width: 480px; height: 480px; object-fit: cover; border-radius: 50%; }
.dA .learn big { position: relative; font: 800 112px/.88 var(--head); letter-spacing: -.03em; }
.dA .learn small { position: relative; font-size: 26px; font-weight: 600; max-width: 420px; line-height: 1.1; }
.dA .me { position: relative; display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 700; } .dA .me img { position: static; width: 58px; height: 58px; }
.dA .todo { background: #FFC400; padding: 28px; display: grid; align-content: space-between; width: 100%; } .dA .day { background: #1457FF; color: #fff; padding: 28px; display: grid; align-content: space-between; width: 100%; }
.dA .todo big, .dA .day big { font: 800 92px/.9 var(--head); letter-spacing: -.03em; } .dA .todo span, .dA .day span { font-size: 25px; font-weight: 600; line-height: 1.1; }
@container screen (max-width: 600px) { .dA .h { grid-template-columns: 1fr 1fr; grid-template-rows: 1.8fr 1fr; } .dA .learn { grid-column: 1 / 3; grid-row: 1; padding: 22px; } .dA .learn big { font-size: 78px; } .dA .learn > img { width: 240px; height: 240px; top: 150px; right: -30px; } .dA .learn small { font-size: 21px; max-width: 200px; } .dA .todo, .dA .day { padding: 18px; } .dA .todo big, .dA .day big { font-size: 62px; } .dA .todo span, .dA .day span { font-size: 19px; } }

/* ---------- B. Poster: a magazine cover ---------- */
.dB { --font: Archivo, sans-serif; --head: Anton, sans-serif; --bg: #0B0B0C; --ink: #fff; --card: #fff; --cardInk: #0B0B0C; --acc: #FFE500; --accInk: #0B0B0C; --line: #FFFFFF40; --r: 0; --shadow: none; --border: 0; }
.dB .h { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
.dB .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.dB .h::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #000D 0, #0004 58%, #000C 100%), linear-gradient(0deg, #000E 0, #0000 40%); }
.dB .h > *:not(.bg) { position: relative; z-index: 1; }
.dB .top { display: flex; justify-content: space-between; align-items: center; padding: 18px 28px; font-weight: 900; font-size: 18px; text-transform: uppercase; letter-spacing: .03em; }
.dB nav { display: flex; gap: 22px; } .dB nav .on { color: #FFE500; }
.dB .mid { display: grid; grid-template-columns: 1fr 300px; gap: 30px; padding: 0 28px; align-items: end; }
.dB .tag { display: inline-block; background: #FFE500; color: #0B0B0C; padding: 2px 12px; font: 900 24px var(--font); text-transform: uppercase; }
.dB h2 { font: 400 124px/.92 var(--head); text-transform: uppercase; margin: 10px 0 16px !important; }
.dB .go { display: inline-block; background: #fff; color: #0B0B0C; padding: 13px 26px; font-weight: 900; font-size: 25px; text-transform: uppercase; }
.dB .list li { display: flex; justify-content: space-between; gap: 10px; padding: 11px 0; border-top: 2px solid #fff; font-weight: 700; font-size: 18px; line-height: 1.15; } .dB .list h3 { font: 400 34px var(--head); text-transform: uppercase; color: #FFE500; margin-bottom: 8px; }
.dB .tick { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 2px solid #fff; margin-top: 18px; } .dB .tick button { padding: 10px 14px 14px; border-left: 2px solid #FFFFFF40; } .dB .tick b { display: block; font: 400 30px var(--head); } .dB .tick span { font-size: 15px; font-weight: 500; line-height: 1.1; display: block; }
@container screen (max-width: 600px) { .dB .top { padding: 12px 16px; font-size: 14px; } .dB nav { gap: 10px; } .dB nav button:not(.on) { display: none; } .dB .mid { grid-template-columns: 1fr; padding: 0 16px; gap: 12px; } .dB h2 { font-size: 74px; } .dB .go { font-size: 20px; padding: 10px 18px; } .dB .list li { font-size: 15px; padding: 7px 0; } .dB .list h3 { font-size: 24px; margin-bottom: 2px; } .dB .list li:nth-child(n+3) { display: none; } .dB .tick { grid-template-columns: repeat(3, 1fr); } .dB .tick button:nth-child(n+4) { display: none; } .dB .tick button { padding: 6px 8px 8px; } .dB .tick b { font-size: 22px; } .dB .tick span { font-size: 13px; } }

/* ---------- C. Console: a big focused tile, like a games console's home ---------- */
.dC { --font: Outfit, sans-serif; --head: Outfit, sans-serif; --bg: #05070D; --ink: #F5F7FF; --card: #182033; --cardInk: #F5F7FF; --acc: #fff; --accInk: #05070D; --line: #FFFFFF22; --r: 14px; --shadow: 0 16px 40px #0009; --border: 0; }
.dC .h { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding: 22px 36px 30px; }
.dC .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .5; }
.dC .h::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(0deg, #05070D 8%, #05070D66 60%, #05070DAA); }
.dC .h > *:not(.bg) { position: relative; z-index: 2; }
.dC .top { display: flex; align-items: center; gap: 26px; font-size: 21px; font-weight: 500; color: #FFFFFFA8; } .dC .top .on { color: #fff; font-weight: 800; border-bottom: 3px solid #fff; padding-bottom: 3px; } .dC .top img { width: 42px; height: 42px; margin-left: auto; border-radius: 50%; background: #fff; padding: 3px; }
.dC .info { align-self: end; display: grid; gap: 10px; justify-items: start; margin-bottom: 24px; } .dC .info small { font-size: 21px; color: #FFFFFFC8; } .dC .info h2 { font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -.02em; max-width: 900px; } .dC .go { background: #fff; color: #05070D; padding: 13px 30px; border-radius: 99px; font-weight: 800; font-size: 22px; }
.dC .row { display: flex; gap: 14px; align-items: end; } .dC .row button { position: relative; width: 150px; height: 150px; border-radius: 14px; overflow: hidden; background: var(--c, #182033); padding: 12px; display: grid; align-content: end; flex: none; }
.dC .row .big { width: 290px; height: 196px; outline: 4px solid #fff; outline-offset: 3px; } .dC .row .big img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.dC .row button > img.ic { position: absolute; right: 8px; top: 8px; width: 54px; height: 54px; } .dC .row b { position: relative; font-size: 17px; line-height: 1.1; font-weight: 700; } .dC .row small { position: relative; font-size: 14px; opacity: .85; }
@container screen (max-width: 600px) { .dC .h { padding: 14px 16px 18px; } .dC .top { font-size: 16px; gap: 12px; } .dC .top button:nth-child(n+3):not(.on) { display: none; } .dC .info h2 { font-size: 40px; } .dC .info small { font-size: 16px; } .dC .go { font-size: 18px; padding: 10px 22px; } .dC .row { flex-wrap: nowrap; overflow: hidden; } .dC .row button:nth-child(n+4) { display: none; } .dC .row .big { width: 124px; height: 112px; } .dC .row button { width: 100px; height: 100px; padding: 8px; } .dC .row b { font-size: 13px; } .dC .row small { display: none; } .dC .row button > img.ic { width: 36px; height: 36px; } }

/* ---------- D. Bento: tiles of very different sizes ---------- */
.dD { --font: Nunito, sans-serif; --head: Nunito, sans-serif; --bg: #EEF0F7; --ink: #1B2140; --card: #fff; --cardInk: #1B2140; --acc: #5B3DF5; --accInk: #fff; --line: #D9DDEB; --r: 26px; --shadow: 0 2px 8px #1B21400F; --border: 0; }
.dD .h { display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: 150px repeat(4, 1fr); gap: 12px; height: 100%; padding: 14px; }
.dD .t { border-radius: 26px; padding: 18px; overflow: hidden; position: relative; display: grid; align-content: space-between; width: 100%; height: 100%; }
.dD .me { grid-column: 1 / 3; background: #FFD84D; display: flex; align-items: center; gap: 12px; } .dD .me img { width: 84px; height: 84px; } .dD .me b { font-size: 31px; font-weight: 900; line-height: 1; }
.dD .week { grid-column: 3 / 5; background: #CFF5E1; } .dD .week b { font-size: 62px; font-weight: 900; line-height: 1; } .dD .week span { font-size: 18px; font-weight: 800; }
.dD .mark { grid-column: 5 / 7; background: #FFD5E2; } .dD .mark b { font-size: 62px; font-weight: 900; line-height: 1; } .dD .mark span { font-size: 18px; font-weight: 800; }
.dD .next { grid-column: 1 / 5; grid-row: 2 / 5; color: #fff; align-content: end; gap: 8px; } .dD .next img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; } .dD .next::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, #1B2140EE, #0000 62%); } .dD .next > *:not(img) { position: relative; z-index: 1; } .dD .next small { font-size: 18px; font-weight: 800; } .dD .next h2 { font-size: 46px; font-weight: 900; line-height: 1.02; } .dD .go { justify-self: start; background: #fff; color: #1B2140; padding: 10px 24px; border-radius: 99px; font-weight: 900; font-size: 21px; }
.dD .do { grid-column: 5 / 7; grid-row: 2 / 5; background: #fff; align-content: start; gap: 10px; } .dD .do h3 { font-size: 30px; font-weight: 900; } .dD .do li { padding: 12px 14px; background: #EEF0F7; border-radius: 16px; font-weight: 800; font-size: 20px; line-height: 1.12; } .dD .do li small { display: block; font-weight: 700; font-size: 16px; color: #5A6185; }
.dD .cls { grid-column: 1 / 7; display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; } .dD .cls button { border-radius: 20px; padding: 12px 14px; background: var(--t); color: #1B2140; position: relative; display: grid; align-content: end; overflow: hidden; } .dD .cls img { position: absolute; right: 6px; top: 6px; width: 46px; height: 46px; } .dD .cls b { font-size: 16px; font-weight: 800; line-height: 1.1; } .dD .cls small { font-size: 14px; font-weight: 700; }
.dD nav { display: none; }
@container screen (max-width: 600px) { .dD .h { grid-template-columns: 1fr 1fr; grid-template-rows: 92px 92px 1.5fr 1fr; gap: 8px; padding: 10px; } .dD .t { border-radius: 20px; padding: 12px; } .dD .me { grid-column: 1 / 3; } .dD .me img { width: 60px; height: 60px; } .dD .week, .dD .mark { grid-column: auto; } .dD .week b, .dD .mark b { font-size: 36px; } .dD .week span, .dD .mark span { font-size: 14px; } .dD .next { grid-column: 1 / 3; grid-row: auto; } .dD .next h2 { font-size: 30px; } .dD .do { grid-column: 1 / 3; grid-row: auto; } .dD .do h3 { font-size: 20px; } .dD .do li:nth-child(n+3) { display: none; } .dD .do li { font-size: 15px; padding: 6px 10px; } .dD .cls { display: none; } }

/* ---------- E. Day Path: the day as a journey across a landscape ---------- */
.dE { --font: "Baloo 2", sans-serif; --head: "Baloo 2", sans-serif; --bg: #BEE9FF; --ink: #17314A; --card: #fff; --cardInk: #17314A; --acc: #FF7A1A; --accInk: #fff; --line: #17314A22; --r: 22px; --shadow: 0 5px 0 #17314A26; --border: 0; }
.dE .h { position: relative; height: 100%; overflow: hidden; background: linear-gradient(#8AD8FF 0, #D8F4FF 56%); }
.dE svg.land { position: absolute; inset: 0; width: 100%; height: 100%; } .dE .forPhone { display: none; }
.dE .top { position: absolute; left: 22px; right: 22px; top: 16px; display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 26px; } .dE .top img { width: 60px; height: 60px; background: #fff; border-radius: 50%; padding: 4px; } .dE .bag { margin-left: auto; background: #fff; padding: 8px 20px; border-radius: 99px; box-shadow: var(--shadow); font-size: 21px; font-weight: 800; }
.dE .node { position: absolute; left: var(--x); top: var(--y); width: 116px; display: grid; justify-items: center; gap: 2px; text-align: center; transform: translate(-50%, -50%); }
.dE .node i { display: grid; place-items: center; width: 92px; height: 92px; background: #fff; border-radius: 50%; box-shadow: 0 7px 0 #17314A33; border: 6px solid #fff; } .dE .node i img { width: 56px; height: 56px; } .dE .node b { font-size: 17px; font-weight: 800; line-height: 1.05; } .dE .node small { font-size: 15px; font-weight: 700; }
.dE .node.done i { background: #BDF0C8; border-color: #27B35A; } .dE .node.now i { width: 118px; height: 118px; background: #FFE9A8; border-color: #FF7A1A; }
.dE .card { position: absolute; left: 400px; top: 84px; width: 430px; background: #fff; padding: 16px 20px; border-radius: 22px; box-shadow: var(--shadow); display: grid; gap: 6px; } .dE .card h2 { font-size: 33px; font-weight: 800; line-height: 1.02; } .dE .card small { font-size: 18px; font-weight: 700; } .dE .go { justify-self: start; background: #FF7A1A; color: #fff; padding: 7px 26px; border-radius: 99px; font-weight: 800; font-size: 23px; box-shadow: 0 5px 0 #B9520A; }
@container screen (max-width: 600px) { .dE .card { left: 14px; right: 14px; top: 80px; width: auto; } .dE .node { left: var(--px); top: var(--py); } .dE .forPad { display: none; } .dE .forPhone { display: block; } .dE .card h2 { font-size: 27px; } .dE .node { width: 92px; } .dE .node i { width: 66px; height: 66px; border-width: 4px; } .dE .node i img { width: 40px; height: 40px; } .dE .node.now i { width: 82px; height: 82px; } .dE .node b { font-size: 14px; } .dE .node small { font-size: 12.5px; } .dE .top { font-size: 21px; } .dE .bag { font-size: 16px; padding: 6px 12px; } .dE .top img { width: 46px; height: 46px; } }

/* ---------- F. Desk: a real diary on a desk, with tape and sticky notes ---------- */
.dF { --font: "Patrick Hand", sans-serif; --head: "Gochi Hand", cursive; --bg: #2E5A58; --ink: #24303F; --card: #FFFDF4; --cardInk: #24303F; --acc: #D6452B; --accInk: #fff; --line: #BFD3E4; --r: 3px; --shadow: 2px 4px 10px #0004; --border: 0; }
.dF .h { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; height: 100%; padding: 20px 76px 20px 22px; position: relative; }
.dF .paper { background: #FFFDF4 repeating-linear-gradient(transparent 0 37px, #BFD3E4 37px 38px); box-shadow: 3px 6px 14px #0005; padding: 16px 22px; position: relative; }
.dF .left { display: grid; grid-template-rows: auto 1fr; gap: 12px; } .dF .hi { display: flex; align-items: center; gap: 10px; font: 400 38px/1 var(--head); color: #FFFDF4; } .dF .hi img { width: 58px; height: 58px; background: #FFFDF4; border-radius: 50%; padding: 4px; }
.dF .polar { position: relative; background: #fff; padding: 14px 14px 18px; box-shadow: 3px 6px 16px #0006; transform: rotate(-1.6deg); display: grid; gap: 8px; align-content: start; min-height: 0; width: 100%; } .dF .polar img { width: 100%; height: 430px; object-fit: cover; } .dF .polar h2 { font: 400 38px/1.02 var(--head); } .dF .polar small { font-size: 21px; color: #5E6875; } .dF .tape { position: absolute; left: 44%; top: -13px; width: 110px; height: 30px; background: #FFE27ACC; transform: rotate(-3deg); }
.dF .go { justify-self: start; background: #D6452B; color: #fff; padding: 5px 22px; font-size: 25px; border-radius: 3px; transform: rotate(-.5deg); }
.dF .right { display: grid; grid-template-rows: 1fr auto; gap: 14px; min-height: 0; }
.dF .tt h3 { font: 400 32px/38px var(--head); color: #D6452B; } .dF .tt li { display: grid; grid-template-columns: 62px 1fr; font-size: 23px; line-height: 38px; white-space: nowrap; overflow: hidden; } .dF .tt li span { color: #6B7584; }

.dF nav { position: absolute; right: 0; top: 30px; display: grid; gap: 6px; } .dF nav button { width: 64px; padding: 12px 6px; background: var(--n, #FFFDF4); border-radius: 8px 0 0 8px; font-size: 16px; text-align: center; box-shadow: -2px 2px 5px #0004; } .dF nav .on { width: 72px; font-size: 18px; }
