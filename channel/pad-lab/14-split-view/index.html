<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Split view</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Split view: learns from iPad Mail and Settings. A list of places on the left, the chosen place on the right.
   Upright, the list folds into a row of choices at the top. Grouped lists, sheets with Cancel and Done. */
:root{
  --side:#E9E9EF; --pane:#F2F2F7; --cell:#FFFFFF; --ink:#16161A; --sub:#55555F; --sep:#D3D3DA;
  --tint:#0A5BC4; --tint-bg:#0A5BC4; --red:#C0291D; --green:#1B7A3E; --amber:#8A5300;
  --ana:#D42A20; --leo:#0F766E; --mia:#1D4ED8;
}
html{font-size:18px}
html[data-size="s"]{font-size:17px}
html[data-size="xl"]{font-size:20px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Figtree",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--pane);font-size:1rem;line-height:1.3;-webkit-font-smoothing:antialiased;overflow:hidden}
body.is-admin{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:3px solid var(--tint);outline-offset:2px}
svg.i{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- split ---------- */
.split{display:grid;grid-template-columns:330px 1fr;height:100vh}
.sidebar{background:var(--side);border-right:1px solid var(--sep);display:flex;flex-direction:column;padding:14px 14px 16px;min-height:0}
.sbar{display:flex;align-items:center;justify-content:flex-end;gap:4px;min-height:48px}
.ibtn{min-width:48px;min-height:48px;border-radius:24px;display:inline-flex;align-items:center;justify-content:center;color:var(--tint);gap:6px;font-weight:600}
.ibtn:active{background:rgba(10,91,196,.1)}
.sidebar h1{font-size:2.05rem;font-weight:800;letter-spacing:-.02em;padding:2px 8px 12px}
.grp{margin-bottom:16px}
.grp .gh{font-size:1rem;font-weight:700;color:var(--sub);padding:0 10px 6px}
.row{width:100%;display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 12px;border-radius:12px;font-size:1.05rem;font-weight:600}
.row .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.row .ic svg{width:20px;height:20px}
.row .face{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}
.row .lbl{flex:1;min-width:0}
.row .tr{color:var(--sub);font-weight:500;font-size:1rem;white-space:nowrap}
.row .badge{background:var(--red);color:#fff;font-weight:700;border-radius:12px;padding:1px 9px;font-size:1rem}
.row .late{color:var(--red);font-weight:700}
.row.sel{background:var(--tint-bg);color:#fff}
.row.sel .tr,.row.sel .late{color:#fff}
.row.sel .badge{background:#fff;color:var(--red)}
.sfoot{margin-top:auto;display:flex;gap:8px}
.sfoot .row{flex:1;justify-content:center;background:rgba(255,255,255,.6);color:var(--tint);font-weight:700}

.detail{display:flex;flex-direction:column;min-height:0;min-width:0}
.nav{display:flex;align-items:flex-end;gap:10px;padding:14px 32px 12px;min-height:96px}
.nav .tt{flex:1;min-width:0}
.nav h2{font-size:2.05rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;display:flex;align-items:center;gap:12px}
.nav h2 .face{font-size:34px}
.nav .st{color:var(--sub);margin-top:2px}
.nav .acts{display:flex;gap:6px}
.body{flex:1;min-height:0;padding:4px 32px 24px;display:flex;flex-direction:column;gap:18px}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}

.ghd{font-size:1rem;font-weight:700;color:var(--sub);padding:0 16px 6px;display:flex;align-items:center}
.ghd .more{margin-left:auto;color:var(--tint);font-weight:700;min-height:44px;display:inline-flex;align-items:center;margin-block:-12px}
.list{background:var(--cell);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;min-height:58px;padding:8px 16px;position:relative;width:100%}
.li+.li::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.li .tm{width:58px;color:var(--sub);font-variant-numeric:tabular-nums;flex:none}
.li .main{flex:1;min-width:0}
.li .main b{display:block;font-weight:700}
.li .main span{display:block;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .chev{color:#8A8A93;width:20px;height:20px}
.li.now{background:#FFF6E5}
.li.now .tm{color:var(--amber);font-weight:800}
.chips{display:flex;gap:6px;flex:none}
.chip{width:96px;height:40px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 9px 0 5px;font-weight:700;font-size:1rem;border:1.5px solid transparent}
.chip .f{font-size:19px}
.chip.done{background:var(--kb);color:var(--k)}
.chip.now{border-color:var(--k);color:var(--k);background:#fff}
.chip.missed{background:#FBE9E7;color:var(--red)}
.chip.later{color:var(--sub);background:#F2F2F5}
.pbtn{min-height:48px;padding:0 20px;border-radius:24px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.pbtn.fill{background:var(--tint);color:#fff}
.pbtn.tinted{background:#E3ECFA;color:var(--tint)}
.pbtn.line{border:1.5px solid var(--sep);background:#fff}

/* now card */
.nowc{background:var(--cell);border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:20px}
.nowc .when{color:var(--amber);font-weight:800}
.nowc h3{font-size:1.45rem;font-weight:800;line-height:1.15;margin:2px 0 6px}
.nowc .who{color:var(--sub)}
.nowc .txt{flex:1;min-width:0}
.nowc .pbtn{min-height:56px;font-size:1.05rem;padding:0 24px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--cell);border-radius:14px}
.stats div{padding:14px 18px}
.stats div+div{border-left:1px solid var(--sep)}
.stats b{display:block;font-size:1.5rem;font-weight:800}
.stats span{color:var(--sub)}
.big{font-size:1.25rem}
.note{color:var(--sub);padding:0 16px}

/* portrait: the sidebar folds into a row of choices */
.picker{display:none}
.only-p{display:none}
@media (max-aspect-ratio:1/1){
  .split{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .sidebar{display:none}
  .picker{display:flex;flex-direction:column;gap:6px;padding:12px 20px 6px;background:var(--side);border-bottom:1px solid var(--sep)}
  .ptop{display:flex;align-items:center;gap:4px;justify-content:flex-end}
  .seg{display:flex;background:#DCDCE3;border-radius:14px;padding:4px;gap:2px}
  .seg button{flex:1 1 auto;min-height:48px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;padding:0 8px;white-space:nowrap}
  .seg button.sel{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .seg .badge{background:var(--red);color:#fff;border-radius:10px;padding:0 7px;font-size:1rem}
  .nav{padding:14px 24px 10px;min-height:80px}
  .body{padding:4px 24px 24px}
  .cols{grid-template-columns:1fr}
  .only-p{display:block}
  .only-l{display:none}
}

/* ---------- form sheet ---------- */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.dim.on{opacity:1;pointer-events:auto}
.fsheet{position:fixed;z-index:50;left:50%;top:50%;width:min(560px,calc(100vw - 40px));max-height:calc(100vh - 60px);background:var(--pane);border-radius:16px;transform:translate(-50%,100vh);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.fsheet.on{transform:translate(-50%,-50%)}
.fnav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 10px;background:#F9F9FB;border-bottom:1px solid var(--sep)}
.fnav b{font-size:1.05rem;text-align:center}
.fnav .ibtn{padding:0 10px}
.fnav .ibtn:last-child{justify-self:end;font-weight:800}
.fbody{padding:18px 18px 22px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.stepper{display:inline-flex;align-items:center;background:#E7E7EC;border-radius:12px;flex:none}
.stepper button{width:48px;height:44px;display:grid;place-items:center;font-size:1.4rem;font-weight:700}
.stepper output.none{color:var(--sub);font-weight:600}
.stepper output{min-width:86px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.toggle{width:58px;height:34px;border-radius:17px;background:#C9C9D0;position:relative;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.toggle[aria-checked="true"]{background:#2E8B4A}
.toggle[aria-checked="true"]::after{left:27px}
.tgl-wrap{min-height:44px;display:flex;align-items:center}
.fbody textarea{width:100%;min-height:150px;border:0;border-radius:14px;padding:14px 16px;font:inherit;background:#fff}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{min-height:46px;padding:0 16px;border-radius:23px;background:#fff;font-weight:700}
.opts button.sel{background:var(--tint);color:#fff}
.toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-90px);background:rgba(30,30,34,.94);color:#fff;padding:12px 22px;border-radius:24px;font-weight:700;transition:.3s;z-index:60}
.toast.on{transform:translate(-50%,0)}

/* ---------- admin (Settings) ---------- */
.adminv{display:none}
body.is-admin .split.pad{display:none}
body.is-admin .adminv{display:grid}
.adminv .detail .body{overflow:auto}
.adminv .sidebar .back{color:var(--tint);font-weight:700;font-size:1.05rem;min-height:48px;display:inline-flex;align-items:center;gap:2px;padding-right:10px}
.prof{display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:12px 14px;margin:0 0 16px}
.prof .av{width:56px;height:56px;border-radius:50%;background:#5B5BD6;color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.5rem}
.prof b{display:block;font-size:1.1rem}
.prof span{color:var(--sub)}
@media (max-aspect-ratio:1/1){
  .adminv .apicker{display:flex}
  .adminv .seg button{font-size:1rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="split pad">
  <nav class="sidebar" id="sidebar" aria-label="Places"></nav>
  <div class="picker" id="picker"></div>
  <main class="detail" id="detail"></main>
</div>
<div class="split adminv" id="adminv">
  <nav class="sidebar" id="asidebar" aria-label="Admin"></nav>
  <div class="picker apicker" id="apicker"></div>
  <main class="detail" id="adetail"></main>
</div>
<div class="dim" id="dim"></div>
<div class="fsheet" id="fsheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>

<script src="../data.js"></script>
<script>
const P = window.PAD, K = P.kids, C = P.classes;
const $ = (s) => document.querySelector(s);
const KC = ['var(--ana)', 'var(--leo)', 'var(--mia)'], KB = ['#FBE4E2', '#DDF1EE', '#E1E9FB'];
const nowC = C.find((c) => c.now);
const ic = {
  cal: '<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  bell: '<path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/>',
  chart: '<path d="M5 20V11M12 20V5M19 20v-6"/>',
  book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.8 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3.1 14H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  play: '<path d="M7 4.5v15l13-7.5z" fill="currentColor"/>',
  chev: '<path d="M9 5l7 7-7 7"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  text: '<path d="M4 19l5-14 5 14M5.8 14h6.4M15 19l3-8 3 8M15.9 16.5h4.2"/>',
  chat: '<path d="M4 5h16v11H9l-5 4z"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  family: '<circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2.5 20a5.5 5.5 0 0 1 11 0M13.5 20a4 4 0 0 1 8 0"/>',
  card: '<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18"/>',
  check: '<path d="M4 12.5l5 5L20 6.5"/>',
};
const I = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24">${ic[n]}</svg>`;
let sel = 'today', asel = 'account';
const given = {}, hwSet = {};

const places = [
  { id: 'today', name: 'Today', icon: 'cal', col: '#C0291D', tr: () => `${nowC.subject} now` },
  ...K.map((k, i) => ({ id: 'kid' + i, kid: i, name: k.name, tr: () => `${k.done} of ${k.of}`, late: k.late })),
  { id: 'needs', name: 'Needs you', icon: 'bell', col: '#B5470B', badge: P.needsYou.length },
  { id: 'scores', name: 'Scores', icon: 'chart', col: '#1B7A3E' },
  { id: 'program', name: 'Program', icon: 'book', col: '#5B4BC4' },
];
function rowHTML(p) {
  const lead = p.kid != null ? `<span class="face" style="background:${KB[p.kid]}">${K[p.kid].face}</span>` : `<span class="ic" style="background:${p.col}">${I(p.icon)}</span>`;
  const trail = p.badge ? `<span class="badge">${p.badge}</span>` : p.late ? `<span class="tr"><span class="late">${p.late} late</span>, ${p.tr()}</span>` : p.tr ? `<span class="tr">${p.tr()}</span>` : '';
  return `<button class="row ${sel === p.id ? 'sel' : ''}" data-go="${p.id}">${lead}<span class="lbl">${p.name}</span>${trail}</button>`;
}
function renderSide() {
  $('#sidebar').innerHTML = `<div class="sbar"><button class="ibtn" data-act="admin" aria-label="Admin">${I('gear')}Admin</button></div>
    <h1>School</h1>
    <div class="grp">${rowHTML(places[0])}</div>
    <div class="grp"><div class="gh">Children</div>${places.slice(1, 4).map(rowHTML).join('')}</div>
    <div class="grp">${places.slice(4).map(rowHTML).join('')}</div>
    <div class="sfoot"><button class="row" data-act="size">${I('text')}Text size</button><button class="row" data-act="feedback">${I('chat')}Feedback</button></div>`;
  $('#picker').innerHTML = `<div class="ptop"><button class="ibtn" data-act="size" aria-label="Text size">${I('text')}</button><button class="ibtn" data-act="feedback" aria-label="Send feedback">${I('chat')}</button><button class="ibtn" data-act="admin" aria-label="Admin">${I('gear')}Admin</button></div>
    <div class="seg" role="tablist">${places.map((p) => `<button role="tab" class="${sel === p.id ? 'sel' : ''}" data-go="${p.id}">${p.kid != null ? K[p.kid].face + ' ' : ''}${p.name}${p.badge ? ` <span class="badge">${p.badge}</span>` : ''}</button>`).join('')}</div>`;
}

function chip(c, ci, i) {
  const st = c.state[i], mk = given[ci + '-' + i] || (c.marks && c.marks[i]);
  const word = mk ? mk : st === 'done' ? '✓' : st === 'now' ? 'now' : st === 'missed' ? 'missed' : 'later';
  return `<span class="chip ${st}" style="--k:${KC[i]};--kb:${KB[i]}" title="${K[i].name}: ${st}"><span class="f">${K[i].face}</span>${word}</span>`;
}
function stateWord(st) { return { done: 'Done', now: 'Watching now', missed: 'Missed', later: 'Later' }[st]; }

const views = {
  today() {
    const watching = K.filter((k, i) => nowC.state[i] === 'now').map((k) => k.name).join(' and ');
    const fin = K.filter((k, i) => nowC.state[i] === 'done').map((k) => k.name).join(' and ');
    return {
      title: 'Today', sub: `${P.today}, ${P.now}`,
      body: `<div class="nowc"><div class="txt"><div class="when">Now, ${nowC.time}, ${nowC.subject}</div><h3>${nowC.title}</h3><div class="who">${watching} watching. ${fin} has finished.</div></div>
        <button class="pbtn fill" data-act="play">${I('play')}Play on the TV</button></div>
        <div><div class="ghd">Classes today<button class="more" data-act="soon" data-t="The week">The week</button></div><div class="list">${C.map((c, ci) => `<button class="li ${c.now ? 'now' : ''}" data-act="class" data-c="${ci}"><span class="tm">${c.now ? 'Now' : c.time}</span><span class="main"><b>${c.subject}</b><span>${c.title}</span></span><span class="chips">${K.map((k, i) => chip(c, ci, i)).join('')}</span>${I('chev', 'i chev')}</button>`).join('')}</div></div>
        <div class="only-p"><div class="ghd">Children</div><div class="stats">${K.map((k, i) => `<button data-go="kid${i}" style="text-align:left;padding:12px 18px;min-height:44px${i ? ';border-left:1px solid var(--sep)' : ''}"><b style="font-size:1.2rem">${k.face} ${k.name}</b><span>${k.done} of ${k.of} done${k.late ? `, <b style="display:inline;font-size:1rem;color:var(--red)">${k.late} late</b>` : ''}</span></button>`).join('')}</div></div>
        <div class="only-p"><div class="ghd">Needs you</div><div class="list">${P.needsYou.map((n, j) => `<div class="li"><span class="main"><b>${n.what}</b><span>${n.detail}</span></span><button class="pbtn ${j === 0 ? 'fill' : 'tinted'}" data-act="need" data-j="${j}">${n.action}</button></div>`).join('')}</div></div>
        <div class="list only-l"><button class="li" data-go="needs"><span class="main"><b>${P.needsYou.length} things need you</b><span>${P.needsYou[0].what}, and ${P.needsYou.length - 1} more</span></span>${I('chev', 'i chev')}</button></div>`,
    };
  },
  kid(i) {
    const k = K[i];
    const hwRows = [];
    if (k.late) { const n = P.needsYou.find((x) => x.what.includes(k.name) && x.action === 'Remind'); hwRows.push(`<div class="li"><span class="main"><b style="color:var(--red)">Late</b><span>${n ? n.detail : 'Homework'}</span></span><button class="pbtn tinted" data-act="remind" data-i="${i}">Remind</button></div>`); }
    if (k.homework - k.late > 0) hwRows.push(`<div class="li"><span class="main"><b>${k.homework - k.late} on time</b><span>Not due yet</span></span></div>`);
    if (!k.homework) hwRows.push(`<div class="li"><span class="main"><b>No homework</b><span>Nothing set right now</span></span></div>`);
    const sc = P.scores.filter((s) => s.kid === k.name);
    return {
      title: `<span class="face">${k.face}</span>${k.name}`, sub: k.year,
      acts: `<button class="pbtn tinted" data-act="hw" data-i="${i}">Set homework</button>`,
      body: `<div class="stats"><div><b>${k.done} of ${k.of}</b><span>classes done today</span></div><div><b>${k.average}</b><span>average mark</span></div><div><b>${k.homework}</b><span>homework${k.late ? `, <span style="color:var(--red);font-weight:700">${k.late} late</span>` : ''}</span></div></div>
        <div class="cols"><div><div class="ghd">Today</div><div class="list">${C.map((c, ci) => { const st = c.state[i], mk = given[ci + '-' + i] || (c.marks && c.marks[i]); return `<button class="li ${c.now ? 'now' : ''}" data-act="class" data-c="${ci}"><span class="tm">${c.time}</span><span class="main"><b>${c.subject}</b><span style="${st === 'missed' ? 'color:var(--red);font-weight:700' : ''}">${stateWord(st)}</span></span>${mk ? `<b class="big">${mk}</b>` : ''}${I('chev', 'i chev')}</button>`; }).join('')}</div></div>
        <div style="display:flex;flex-direction:column;gap:18px"><div><div class="ghd">Homework</div><div class="list">${hwRows.join('')}</div></div>
        <div><div class="ghd">Latest score</div><div class="list">${sc.length ? sc.map((s) => `<div class="li"><span class="main"><b>${s.what}</b><span>${s.when}</span></span><b class="big">${s.score}</b></div>`).join('') : '<div class="li"><span class="main"><span>No new score</span></span></div>'}</div></div></div></div>`,
    };
  },
  needs() {
    return {
      title: 'Needs you', sub: 'Most urgent first. When this list is empty, all is well.',
      body: `<div class="list">${P.needsYou.map((n, j) => `<div class="li" style="min-height:92px"><span class="ic" style="width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:${['#5B4BC4', '#C0291D', '#B5470B'][j]};color:#fff">${I(['check', 'bell', 'chart'][j])}</span><span class="main"><b class="big">${n.what}</b><span>${n.detail}</span></span><button class="pbtn ${j === 0 ? 'fill' : 'tinted'}" data-act="need" data-j="${j}">${n.action}</button></div>`).join('')}</div>`,
    };
  },
  scores() {
    return {
      title: 'Scores', sub: 'Latest tests and each child’s average',
      acts: `<button class="pbtn tinted" data-act="need" data-j="0">Mark written answers</button>`,
      body: `<div><div class="ghd">Latest</div><div class="list">${P.scores.map((s) => { const i = K.findIndex((k) => k.name === s.kid); return `<div class="li"><span style="font-size:24px">${K[i].face}</span><span class="main"><b>${s.kid}, ${s.what}</b><span>${s.when}</span></span><b class="big">${s.score}</b></div>`; }).join('')}</div></div>
        <div><div class="ghd">Average mark</div><div class="list">${K.map((k, i) => `<button class="li" data-go="kid${i}"><span style="font-size:24px">${k.face}</span><span class="main"><b>${k.name}</b><span>${k.year}</span></span><b class="big">${k.average}</b>${I('chev', 'i chev')}</button>`).join('')}</div></div>
        <div class="list"><button class="li" data-act="soon" data-t="Every score"><span class="main"><b>Every score, by date</b></span>${I('chev', 'i chev')}</button></div>`,
    };
  },
  program() {
    const m = P.program.where.match(/^(.*), lesson (\d+) of (\d+)$/);
    return {
      title: 'Program', sub: P.admin.plan,
      body: `<div><div class="ghd">Where we are</div><div class="list"><div class="li" style="min-height:96px"><span class="main"><b class="big">${m[1]}</b><span>Lesson ${m[2]} of ${m[3]}</span></span><span style="display:flex;gap:6px">${Array.from({ length: +m[3] }, (_, n) => `<i style="width:28px;height:10px;border-radius:5px;background:${n < +m[2] ? 'var(--tint)' : '#D9D9E0'}"></i>`).join('')}</span></div></div></div>
        <div class="stats" style="grid-template-columns:1fr 1fr"><div><b>${P.program.subjects}</b><span>subjects this year</span></div><div><b>${P.program.readyLessons}</b><span>video lessons ready</span></div></div>
        <div class="list"><button class="li" data-act="soon" data-t="The full program"><span class="main"><b>Open the full program</b><span>Every subject, unit and lesson</span></span>${I('chev', 'i chev')}</button></div>`,
    };
  },
};
function renderDetail() {
  const v = sel.startsWith('kid') ? views.kid(+sel.slice(3)) : views[sel]();
  $('#detail').innerHTML = `<div class="nav"><div class="tt"><h2>${v.title}</h2><div class="st">${v.sub}</div></div><div class="acts">${v.acts || ''}</div></div><div class="body">${v.body}</div>`;
}
function go(id) { sel = id; renderSide(); renderDetail(); }

/* ---------- sheets ---------- */
const sh = $('#fsheet'), dim = $('#dim');
function openSheet(title, body, done = 'Done', doneAct = 'close', doneT = '') {
  sh.innerHTML = `<div class="fnav"><button class="ibtn" data-act="close">Cancel</button><b>${title}</b><button class="ibtn" data-act="${doneAct}" data-t="${doneT}">${done}</button></div><div class="fbody">${body}</div>`;
  sh.classList.add('on'); dim.classList.add('on');
}
function closeSheet() { sh.classList.remove('on'); dim.classList.remove('on'); }
let tt; function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), 2300); }

let draft = {};
function classSheet(ci) {
  const c = C[ci]; draft = { ci };
  const rows = K.map((k, i) => {
    const st = c.state[i], mk = given[ci + '-' + i] || (c.marks && c.marks[i]) || '';
    draft[i] = mk ? +mk : (st === 'later' ? '' : 9);
    return `<div class="li"><span style="font-size:26px">${k.face}</span><span class="main"><b>${k.name}</b><span>${stateWord(st)}</span></span>${st === 'later' ? '<span class="note">Not yet</span>' : `<span class="stepper"><button data-act="step" data-i="${i}" data-d="-1" aria-label="Lower">−</button><output id="o${i}" class="${mk ? '' : 'none'}">${mk || 'No mark'}</output><button data-act="step" data-i="${i}" data-d="1" aria-label="Higher">+</button></span>`}</div>`;
  }).join('');
  const hw = K.map((k, i) => `<div class="li"><span class="main"><b>Homework for ${k.name}</b></span><span class="tgl-wrap"><button class="toggle" role="switch" aria-checked="false" aria-label="Homework for ${k.name}" data-act="toggle"></button></span></div>`).join('');
  openSheet(`${c.subject}, ${c.time}`, `<p class="note">${c.title}</p><div><div class="ghd">Mark, out of 12</div><div class="list">${rows}</div></div><div><div class="ghd">Set homework</div><div class="list">${hw}</div></div>${c.lesson ? `<button class="pbtn fill" data-act="play">${I('play')}Play on the TV</button>` : ''}`, 'Done', 'savemarks');
}

const act = {
  admin: () => { location.hash = '#admin'; },
  back: () => { location.hash = ''; },
  close: closeSheet,
  soon: (e) => { closeSheet(); toast(`${e.dataset.t} opens here`); },
  play: () => { closeSheet(); toast(`Playing “${nowC.title}” on the TV`); },
  class: (e) => classSheet(+e.dataset.c),
  step: (e) => { const i = +e.dataset.i; const o = $('#o' + i); let v = o.classList.contains('none') ? 10 : Math.min(12, Math.max(0, +draft[i] + +e.dataset.d)); o.classList.remove('none'); draft[i] = v; $('#o' + i).textContent = v; draft['t' + i] = true; },
  toggle: (e) => { e.setAttribute('aria-checked', e.getAttribute('aria-checked') !== 'true'); },
  savemarks: () => { K.forEach((k, i) => { if (draft['t' + i]) given[draft.ci + '-' + i] = String(draft[i]); }); closeSheet(); renderDetail(); toast('Saved'); },
  remind: (e) => toast(`Reminder sent to ${K[+e.dataset.i].name}`),
  hw: (e) => { const k = K[+e.dataset.i]; openSheet(`Homework for ${k.name}`, `<div><div class="ghd">Class</div><div class="opts">${C.map((c, j) => `<button class="${j === 0 ? 'sel' : ''}" data-act="opt">${c.subject}</button>`).join('')}</div></div><div><div class="ghd">What to do</div><textarea placeholder="For example: read pages 16 to 19"></textarea></div><div><div class="ghd">Due</div><div class="opts"><button class="sel" data-act="opt">Tomorrow</button><button data-act="opt">Friday</button><button data-act="opt">Next week</button></div></div>`, 'Set', 'soon', `Homework for ${k.name} is set. It`); },
  opt: (e) => { e.parentNode.querySelectorAll('button').forEach((b) => b.classList.remove('sel')); e.classList.add('sel'); },
  need: (e) => {
    const n = P.needsYou[+e.dataset.j];
    if (n.action === 'Mark now') openSheet('Leo’s written answers', `<p class="note">${n.detail}</p><div class="list">${[1, 2, 3].map((q) => `<div class="li"><span class="main"><b>Answer ${q}</b></span><div class="opts"><button data-act="opt">Right</button><button data-act="opt">Partly</button><button data-act="opt">Wrong</button></div></div>`).join('')}</div>`, 'Save', 'soon', 'Saved. Leo’s marks');
    else if (n.action === 'Remind') toast('Reminder sent to Leo');
    else openSheet('Rate the lesson', `<p class="note">Muscles. ${n.detail}.</p><div class="opts" style="justify-content:center">${[1, 2, 3, 4, 5].map((s) => `<button data-act="opt" aria-label="${s} stars">${'★'.repeat(s)}</button>`).join('')}</div>`, 'Save', 'soon', 'Thanks. Your rating');
  },
  size: () => { const cur = document.documentElement.dataset.size || 'l'; openSheet('Text size', `<p class="note">Makes all the words on the pad bigger or smaller.</p><div class="list">${[['s', 'Standard', 17], ['l', 'Large', 18], ['xl', 'Extra large', 20]].map(([v, t, px]) => `<button class="li" data-act="setsize" data-v="${v}"><span class="main"><b style="font-size:${px}px">${t}</b></span>${v === cur ? I('check') : ''}</button>`).join('')}</div>`); },
  setsize: (e) => { document.documentElement.dataset.size = e.dataset.v; closeSheet(); },
  feedback: () => openSheet('Send feedback', `<p class="note">What works, what doesn’t, and what you wish it did.</p><textarea></textarea>`, 'Send', 'soon', 'Thank you. Your feedback'),
};
document.addEventListener('click', (ev) => {
  const g = ev.target.closest('[data-go]'); if (g && !location.hash.startsWith('#admin')) { go(g.dataset.go); return; }
  const a = ev.target.closest('[data-act]'); if (a) { act[a.dataset.act]?.(a); return; }
  const s = ev.target.closest('[data-ago]'); if (s) { asel = s.dataset.ago; renderAdmin(); return; }
  if (ev.target === dim) closeSheet();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

/* ---------- Admin, like iPad Settings ---------- */
const A = P.admin;
const asecs = [
  { id: 'account', name: 'Your account', icon: 'user', col: '#5B5BD6', rows: [['Name', A.account.name], ['Username', A.account.username], ['Text size', A.account.textSize], ['Password', 'Change']] },
  { id: 'family', name: 'Family', icon: 'family', col: '#1B7A3E', groups: [['Parents', P.parents.map((p) => [p.name, p.you ? 'You' : 'Parent'])], ['Children', K.map((k) => [`${k.face} ${k.name}`, k.year])], ['', [['Add a child', '']]]] },
  { id: 'plan', name: 'Learning plan', icon: 'book', col: '#B5470B', rows: [['Curriculum', A.plan], ['Word help', A.wordHelp.replace('Spanish key words: ', 'Spanish key words, ')], ['Subjects', P.program.subjects]] },
  { id: 'billing', name: 'Plan and billing', icon: 'card', col: '#0A5BC4', rows: [['Plan', A.billing], ['How it’s charged', 'Per child'], ['See plans', '']] },
  { id: 'checks', name: 'Feedback and checks', icon: 'check', col: '#C0291D', rows: [['Exam PIN', A.examPin], ['Send feedback', '']] },
];
function renderAdmin() {
  const s = asecs.find((x) => x.id === asel);
  $('#asidebar').innerHTML = `<div class="sbar" style="justify-content:flex-start"><button class="back" data-act="back">${I('back')}Pad</button></div><h1>Admin</h1>
    <div class="prof"><span class="av">${A.account.name[0]}</span><span><b>${A.account.name}</b><span>Parent, signed in</span></span></div>
    <div class="grp">${asecs.map((x) => `<button class="row ${x.id === asel ? 'sel' : ''}" data-ago="${x.id}"><span class="ic" style="background:${x.col}">${I(x.icon)}</span><span class="lbl">${x.name}</span></button>`).join('')}</div>
    <div class="sfoot"><button class="row" data-act="soon" data-t="Sign out">Sign out</button></div>`;
  $('#apicker').innerHTML = `<div class="ptop" style="justify-content:space-between"><button class="ibtn back" data-act="back">${I('back')}Pad</button><b style="font-size:1.1rem">Admin</b><span style="width:80px"></span></div><div class="seg">${asecs.map((x) => `<button class="${x.id === asel ? 'sel' : ''}" data-ago="${x.id}">${x.name.replace('Feedback and checks', 'Checks').replace('Plan and billing', 'Billing')}</button>`).join('')}</div>`;
  const li = (r) => { const tap = r[1] === '' || r[1] === 'Change'; return `<${tap ? 'button' : 'div'} class="li" ${tap ? `data-act="${r[0] === 'Send feedback' ? 'feedback' : 'soon'}" data-t="${r[0]}"` : ''}><span class="main"><b style="${tap && r[1] === '' ? 'color:var(--tint)' : ''}">${r[0]}</b></span><span class="note" style="padding:0">${r[1]}</span>${tap ? I('chev', 'i chev') : ''}</${tap ? 'button' : 'div'}>`; };
  const groups = s.groups || [['', s.rows]];
  $('#adetail').innerHTML = `<div class="nav"><div class="tt"><h2>${s.name}</h2></div></div><div class="body">${groups.map(([h, rows]) => `<div>${h ? `<div class="ghd">${h}</div>` : ''}<div class="list">${rows.map(li).join('')}</div></div>`).join('')}</div>`;
}

function route() {
  closeSheet();
  const admin = location.hash === '#admin';
  document.body.classList.toggle('is-admin', admin);
  if (admin) renderAdmin(); else { renderSide(); renderDetail(); }
}
route();
addEventListener('hashchange', route);
</script>
</body>
</html>
