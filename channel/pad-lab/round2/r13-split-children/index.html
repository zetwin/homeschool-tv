<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Split view by child</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Round 2, from 14 Split view. Tests: is the iPad sidebar better when its rows are the children themselves,
   and the detail shows the chosen child as a row of class cards with big ticks instead of a list of text? */
:root{
  --side:#E7EAF0; --pane:#F4F5F8; --card:#FFFFFF; --ink:#15171C; --sub:#535865; --line:#D6DAE2; --soft:#ECEEF2;
  --red:#B42318; --amber-bg:#FFE6A8; --amber-ink:#4D3300; --now:#8A4B00;
  --ana:#D42A20; --leo:#0F766E; --mia:#1D4ED8;
  --ana-l:#FCE5E3; --leo-l:#DDF2EF; --mia-l:#E2EAFC;
  --ana-d:#A71D16; --leo-d:#0B5C56; --mia-d:#1A43BF;
}
html{font-size:18px}
html[data-size="l"]{font-size:20px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Onest",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--pane);font-size:1rem;line-height:1.3;-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
svg.i{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- frame ---------- */
.split{display:grid;grid-template-columns:300px 1fr;height:100vh}
.side{background:var(--side);display:flex;flex-direction:column;padding:14px 14px 18px;gap:6px;min-height:0;border-right:1px solid var(--line)}
.tools{display:flex;gap:4px;justify-content:flex-end}
.ib{min-width:48px;min-height:48px;border-radius:24px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;padding:0 10px}
.ib:hover{background:rgba(0,0,0,.06)}
.date{padding:4px 10px 14px}
.date b{display:block;font-size:1.25rem;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.date span{color:var(--sub)}
.who{display:flex;flex-direction:column;gap:6px}
.pick{width:100%;display:flex;align-items:center;gap:14px;min-height:76px;padding:8px 12px;border-radius:18px;transition:background .15s}
.pick:hover{background:rgba(255,255,255,.6)}
.pick .nm{font-size:1.25rem;font-weight:700;line-height:1.1}
.pick .tx{flex:1;min-width:0}
.pick .st{color:var(--sub);display:block;margin-top:2px}
.pick .late{color:var(--red);font-weight:700}
.pick[aria-current="true"]{background:var(--card);box-shadow:0 1px 2px rgba(20,23,28,.08),0 0 0 2px var(--k,var(--ink)) inset}
.ring{position:relative;width:58px;height:58px;flex:none}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring svg circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .f{position:absolute;inset:7px;border-radius:50%;display:grid;place-items:center;font-size:26px}
.today-ic{width:58px;height:58px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.today-ic svg{width:28px;height:28px}
.gap{flex:1}
.hint{color:var(--sub);padding:0 12px}

.detail{display:flex;flex-direction:column;min-width:0;min-height:0;padding:22px 32px 28px;gap:18px}
.head{display:flex;align-items:center;gap:16px;min-height:64px}
.head h1{font-size:2.15rem;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.head .sub{color:var(--sub);margin-top:2px}
.head .tt{flex:1;min-width:0}
.head .big-face{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:34px;flex:none}
.badge{min-height:48px;padding:0 16px 0 12px;border-radius:24px;background:var(--amber-bg);color:var(--amber-ink);font-weight:700;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.badge .n{background:var(--amber-ink);color:#fff;border-radius:12px;min-width:26px;height:26px;display:grid;place-items:center;font-size:1rem}
.btn{min-height:52px;padding:0 22px;border-radius:26px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap}
.btn.ink{background:var(--ink);color:#fff}
.btn.line{background:var(--card);box-shadow:0 0 0 2px var(--line) inset}
.btn.k{background:var(--kl);color:var(--k)}
.card{background:var(--card);border-radius:22px;padding:18px 20px;box-shadow:0 1px 2px rgba(20,23,28,.06);min-width:0;position:relative}
button.card{display:block;width:100%;transition:transform .15s,box-shadow .15s}
button.card:hover{box-shadow:0 6px 20px rgba(20,23,28,.1)}
button.card:active{transform:scale(.985)}
.lbl{color:var(--sub);font-weight:600}

/* now card */
.nowc{display:flex;align-items:center;gap:24px;padding:20px 24px}
.nowc .tx{flex:1;min-width:0}
.nowc .when{color:var(--now);font-weight:700}
.nowc h2{font-size:2.1rem;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:4px 0 2px}
.nowc .t{font-size:1.1rem;color:var(--sub)}
.faces{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.fc{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:22px;background:var(--kl);color:var(--kd);font-weight:600}
.fc i{font-style:normal;width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:19px}
.nowc .btn{min-height:64px;padding:0 28px;font-size:1.15rem}

/* the three children on Today */
.kids{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;flex:1;min-height:0;max-height:330px}
.kc{padding:18px 18px 16px;display:flex!important;flex-direction:column;justify-content:space-between;gap:12px}
.kc .top{display:flex;align-items:center;gap:10px}
.kc .fa{width:44px;height:44px;border-radius:50%;background:var(--kl);display:grid;place-items:center;font-size:24px;flex:none}
.kc .nm{font-size:1.3rem;font-weight:800}
.kc .count{margin-left:auto;font-size:1.6rem;font-weight:800;color:var(--kd);line-height:1}
.kc .count small{font-size:1rem;color:var(--sub);font-weight:600}
.dots{display:flex;gap:6px}
.dot{flex:1;aspect-ratio:1;max-width:52px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 2.5px var(--line) inset}
.dot svg{width:60%;height:60%;stroke-width:3}
.dot.done{background:var(--k);box-shadow:none;color:#fff}
.dot.now{box-shadow:0 0 0 3px var(--k) inset;color:var(--k)}
.dot.now svg{width:44%;height:44%}
.dot.missed{box-shadow:0 0 0 2.5px var(--red) inset;color:var(--red)}
.kf{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.kf>span{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.kf b{font-size:1.2rem;font-weight:800;color:var(--kd);white-space:nowrap}
.flag{background:#FDE4E1;color:var(--red);font-weight:700;padding:0 10px;border-radius:10px}

.pair{display:grid;grid-template-columns:1fr auto;gap:16px}
.prog{display:flex!important;align-items:center;gap:24px}
.prog .pl{flex:1;min-width:0}
.prog .segs{width:34%;margin:0}
.allsc{display:flex!important;flex-direction:column;justify-content:center;gap:2px;padding:14px 22px}
.allsc b{font-size:1.4rem;letter-spacing:.1em}
.segs{display:flex;gap:6px;margin:12px 0 8px}
.segs i{flex:1;height:10px;border-radius:5px;background:var(--soft)}
.segs i.on{background:var(--ink)}
.prog b{display:block;font-size:1.2rem;font-weight:700;margin-top:6px}

/* a child */
.day{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;flex:1;min-height:0;max-height:340px}
.cls{display:flex!important;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:16px 10px 14px;min-height:0}
.cls .tick{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 3px var(--line) inset;color:var(--sub)}
.cls .tick svg{width:46px;height:46px;stroke-width:3}
.cls.done .tick{background:var(--k);box-shadow:none;color:#fff}
.cls.now{background:var(--kl)}
.cls.now .tick{background:#fff;box-shadow:0 0 0 4px var(--k) inset;color:var(--k)}
.cls.now .tick svg{width:36px;height:36px;stroke-width:0}
.cls.missed .tick{box-shadow:0 0 0 3px var(--red) inset;color:var(--red)}
.cls .sj{font-size:1.3rem;font-weight:800;line-height:1.1}
.cls .ss{color:var(--sub);font-weight:600}
.cls.now .ss{color:var(--kd)}
.cls.missed .ss{color:var(--red)}
.cls .mk{color:var(--kd);font-weight:800}
.strip{display:flex;align-items:center;gap:18px;padding:14px 16px 14px 22px;background:var(--kl)}
.strip .tx{flex:1;min-width:0;font-size:1.15rem}
.strip .tx b{color:var(--kd)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;flex:none}
.three .card{min-height:168px}
.three .card{display:flex!important;flex-direction:column;gap:6px}
.num{font-size:2.6rem;font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--kd);margin-top:auto}
.num small{font-size:1.05rem;color:var(--sub);font-weight:600;letter-spacing:0;margin-left:6px}
.meter{display:flex;align-items:center;gap:14px;margin-top:auto}
.meter svg{transform:rotate(-90deg);flex:none}
.meter svg circle{fill:none;stroke-width:10;stroke-linecap:round}
.meter b{font-size:1.6rem;font-weight:800;color:var(--kd);line-height:1.05;display:block}
.three .act{margin-top:6px;align-self:flex-start;min-height:44px;padding:0 16px;border-radius:22px;background:#FDE4E1;color:var(--red);font-weight:700}

/* upright: the children move to the top as a row */
.picker{display:none}
@media (max-aspect-ratio:1/1){
  .split{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{display:none}
  .picker{display:flex;flex-direction:column;gap:10px;padding:14px 24px 14px;background:var(--side);border-bottom:1px solid var(--line)}
  .picker .row1{display:flex;align-items:center;gap:6px}
  .picker .row1 .date{padding:0;flex:1}
  .picker .row1 .date b{display:inline;font-size:1.3rem;margin-right:10px}
  .picker .who{flex-direction:row;gap:8px}
  .picker .pick{flex:1;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 6px;min-height:0;text-align:center}
  .picker .pick .tx{flex:none}
  .picker .pick .nm{font-size:1.15rem}
  .picker .pick .st{font-size:1rem}
  .detail{padding:20px 24px 24px}
  .kids{gap:12px}
  .kc{padding:16px 14px 14px}
  .kids{max-height:400px}
  .kf{grid-template-columns:1fr}
  .day{grid-template-columns:repeat(5,1fr);gap:10px}
  .cls{padding:14px 12px 12px}
  .cls .tick{width:76px;height:76px}
  .day{max-height:380px}
  .cls .tick{width:96px!important;height:96px!important}
  .meter{flex-direction:column;align-items:flex-start;gap:10px}
  .meter b{white-space:nowrap}
  .three{flex:1;max-height:280px}
}
html[data-size="l"] .pick{min-height:70px}
html[data-size="l"] .ring,html[data-size="l"] .today-ic{width:52px;height:52px}
html[data-size="l"] .detail{gap:14px;padding-top:18px}
html[data-size="l"] .cls .tick{width:76px;height:76px}
html[data-size="l"] .three .card{min-height:150px}
html[data-size="l"] .nowc{padding:16px 22px}
@media (max-aspect-ratio:1/1){
  html[data-size="l"] .picker .pick{padding:8px 4px}
  html[data-size="l"] .picker .st{display:none}
}

/* ---------- sheets ---------- */
.dim{position:fixed;inset:0;background:rgba(15,17,22,.36);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;left:50%;top:50%;width:min(600px,calc(100vw - 40px));max-height:calc(100vh - 60px);background:var(--pane);border-radius:24px;transform:translate(-50%,100vh);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.sheet.on{transform:translate(-50%,-50%)}
.snav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.snav b{font-size:1.1rem;text-align:center}
.snav .ib:last-child{justify-self:end;font-weight:800}
.sbody{padding:20px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.sbody p{color:var(--sub)}
.grp{background:var(--card);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 16px;position:relative;width:100%}
.li+.li::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.li .m{flex:1;min-width:0}
.li .m b{display:block}
.li .m span{display:block;color:var(--sub)}
.li .v{font-weight:800;font-size:1.2rem}
.gh{font-weight:700;color:var(--sub);padding:0 4px 6px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{min-height:48px;padding:0 18px;border-radius:24px;background:var(--card);font-weight:700;box-shadow:0 0 0 2px var(--line) inset;display:inline-flex;align-items:center;gap:6px}
.opts button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
textarea{width:100%;min-height:120px;border:0;border-radius:16px;padding:14px 16px;font:inherit;background:var(--card);box-shadow:0 0 0 2px var(--line) inset;resize:none}
.stepper{display:inline-flex;align-items:center;background:var(--soft);border-radius:14px}
.stepper button{width:52px;height:48px;display:grid;place-items:center;font-size:1.4rem;font-weight:700}
.stepper output{min-width:96px;text-align:center;font-weight:800}
.toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-100px);background:var(--ink);color:#fff;padding:14px 24px;border-radius:26px;font-weight:700;transition:transform .3s;z-index:60}
.toast.on{transform:translate(-50%,0)}

/* ---------- admin ---------- */
.admin{display:none}
body.is-admin .pad{display:none}
body.is-admin .admin{display:grid}
.admin .detail{overflow:auto}
.back{color:var(--ink);font-weight:700;min-height:48px;display:inline-flex;align-items:center;gap:4px;padding:0 14px 0 6px;border-radius:24px;align-self:flex-start}
.back:hover{background:rgba(0,0,0,.06)}
.me{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:14px;margin:6px 0 10px}
.me .av{width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.4rem;flex:none}
.me b{display:block;font-size:1.15rem}
.me b{color:var(--ink)}
.me b+span{color:var(--sub)}
.sec{width:100%;display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 14px;border-radius:16px;font-weight:700;font-size:1.05rem}
.sec[aria-current="true"]{background:var(--ink);color:#fff}
.admin .grp+.grp{margin-top:18px}
.apick{display:none}
@media (max-aspect-ratio:1/1){
  .admin .side{display:none}
  .apick{display:flex;flex-direction:column;gap:10px;padding:14px 24px;background:var(--side);border-bottom:1px solid var(--line)}
  .apick .secs{display:flex;gap:6px;flex-wrap:wrap}
  .apick .sec{flex:none;width:auto;font-size:1rem;padding:6px 16px;background:var(--card)}
  .apick .sec[aria-current="true"]{background:var(--ink)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="split pad">
  <nav class="side" id="side" aria-label="Children"></nav>
  <div class="picker" id="picker"></div>
  <main class="detail" id="detail"></main>
</div>
<div class="split admin" id="admin">
  <nav class="side" id="aside" aria-label="Admin"></nav>
  <div class="apick" id="apick"></div>
  <main class="detail" id="adetail"></main>
</div>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>

<script src="../../data.js"></script>
<script>
const P = window.PAD, K = P.kids, C = P.classes, A = P.admin;
const $ = (s) => document.querySelector(s);
const KV = ['ana', 'leo', 'mia'];
const kvars = (i) => `--k:var(--${KV[i]});--kd:var(--${KV[i]}-d);--kl:var(--${KV[i]}-l)`;
const nowC = C.find((c) => c.now), nowI = C.indexOf(nowC), nextC = C[nowI + 1];
const ic = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.8 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3.1 14H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  play: '<path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  dash: '<path d="M7 12h10"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  text: '<path d="M4 19l5-14 5 14M5.8 14h6.4M15 19l3-8 3 8M15.9 16.5h4.2"/>',
  chat: '<path d="M4 5h16v11H9l-5 4z"/>',
  pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
};
const I = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ic[n]}</svg>`;
const word = { done: 'Done', now: 'Watching', missed: 'Missed', later: '' };
let sel = 'today', asel = 0, given = {};
const mark = (ci, i) => given[ci + '-' + i] || (C[ci].marks && C[ci].marks[i]) || '';
const scoreOf = (k) => P.scores.find((s) => s.kid === k.name);

function ringSVG(k, i, size = 58) {
  const r = size / 2 - 3, L = 2 * Math.PI * r;
  return `<span class="ring" style="${kvars(i)}"><svg viewBox="0 0 ${size} ${size}" width="100%" height="100%"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="#fff"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="var(--k)" stroke-dasharray="${L * k.done / k.of} ${L}"/></svg><span class="f" style="background:var(--kl)">${k.face}</span></span>`;
}
function pickHTML(id) {
  if (id === 'today') return `<button class="pick" data-go="today" aria-current="${sel === 'today'}"><span class="today-ic">${I('sun')}</span><span class="tx"><span class="nm">Today</span><span class="st">${nowC.subject} now</span></span></button>`;
  const i = +id.slice(3), k = K[i];
  return `<button class="pick" data-go="${id}" aria-current="${sel === id}" style="${kvars(i)}">${ringSVG(k, i)}<span class="tx"><span class="nm">${k.name}</span><span class="st">${k.done} of ${k.of} done${k.late ? `, <span class="late">${k.late} late</span>` : ''}</span></span></button>`;
}
const ids = ['today', 'kid0', 'kid1', 'kid2'];
function renderSide() {
  const tools = `<button class="ib" data-act="size" aria-label="Text size">${I('text')}</button><button class="ib" data-act="feedback" aria-label="Send feedback">${I('chat')}</button><button class="ib" data-act="admin">${I('gear')}Admin</button>`;
  $('#side').innerHTML = `<div class="tools">${tools}</div><div class="date"><b>${P.today}</b><span>${P.now}</span></div><div class="who">${ids.map(pickHTML).join('')}</div>`;
  $('#picker').innerHTML = `<div class="row1"><div class="date"><b>${P.today}</b><span>${P.now}</span></div>${tools}</div><div class="who">${ids.map(pickHTML).join('')}</div>`;
}

/* ---------- Today ---------- */
function dotHTML(st) { return `<span class="dot ${st}">${st === 'done' ? I('check') : st === 'now' ? I('play') : st === 'missed' ? I('dash') : ''}</span>`; }
function todayView() {
  const faces = K.map((k, i) => `<span class="fc" style="${kvars(i)}"><i>${k.face}</i>${k.name} ${nowC.state[i] === 'now' ? 'watching' : 'done'}</span>`).join('');
  const leo = P.needsYou[0];
  return `<div class="head"><div class="tt"><h1>Today</h1><div class="sub">${P.today}</div></div>
      <button class="badge" data-act="answers"><span class="n">3</span>answers to mark</button></div>
    <div class="card nowc"><div class="tx"><div class="when">On now, ${nowC.time} to ${nextC.time}</div><h2>${nowC.subject}</h2><div class="t">${nowC.title}</div><div class="faces">${faces}</div></div>
      <button class="btn ink" data-act="play">${I('play')}Play on the TV</button></div>
    <div class="kids">${K.map((k, i) => `<button class="card kc" data-go="kid${i}" style="${kvars(i)}" aria-label="Open ${k.name}">
      <span class="top"><span class="fa">${k.face}</span><span class="nm">${k.name}</span><span class="count">${k.done}<small> of ${k.of}</small></span></span>
      <span class="dots">${C.map((c) => dotHTML(c.state[i])).join('')}</span>
      <span class="kf"><span><span class="lbl">Last test</span><b>${scoreOf(k).score}</b></span><span><span class="lbl">Homework</span><b>${k.homework ? `${k.homework} to do` : 'None'}</b>${k.late ? `<span class="flag">${k.late} late</span>` : ''}</span></span></button>`).join('')}</div>
    <div class="pair">
      <button class="card prog" data-act="program"><span class="pl"><span class="lbl">Program, Science, lesson 2 of 4</span><b>Human skeleton and muscles</b></span><span class="segs">${[1, 2, 3, 4].map((n) => `<i class="${n <= 2 ? 'on' : ''}"></i>`).join('')}</span></button>
      <button class="card allsc" data-act="scores"><span class="lbl">All scores</span><b>${K.map((k) => k.face).join(' ')}</b></button>
    </div>`;
}

/* ---------- a child ---------- */
function kidView(i) {
  const k = K[i], sc = scoreOf(k), st = nowC.state[i];
  const avg = k.average.match(/\d+/g).map(Number);
  const r = 34, L = 2 * Math.PI * r;
  const strip = st === 'now'
    ? `<div class="card strip"><span class="tx"><b>${k.name} is watching ${nowC.subject}.</b> ${nextC.subject} is next, at ${nextC.time}.</span><button class="btn ink" data-act="play">${I('play')}Play on the TV</button></div>`
    : `<div class="card strip"><span class="tx"><b>${k.name} has finished ${nowC.subject}.</b> ${nextC.subject} is next, at ${nextC.time}.</span></div>`;
  const hw = k.homework
    ? `<span class="num">${k.homework}<small>to do</small></span>${k.late ? `<button class="act" data-act="remind" data-i="${i}">${k.late} late: remind ${k.name}</button>` : `<span class="lbl">All on time</span>`}`
    : `<span class="num">0<small>to do</small></span><span class="lbl">Nothing set</span>`;
  return `<div class="head" style="${kvars(i)}"><span class="big-face" style="background:var(--kl)">${k.face}</span><div class="tt"><h1>${k.name}</h1><div class="sub">${k.year}, ${k.done} of ${k.of} classes done</div></div>
      <button class="btn line" data-act="hw">Add homework</button></div>
    <div class="day">${C.map((c, ci) => { const s = c.state[i], m = mark(ci, i); return `<button class="card cls ${s}" data-act="class" data-c="${ci}" data-i="${i}" style="${kvars(i)}">
      <span class="tick">${s === 'done' ? I('check') : s === 'now' ? I('play') : s === 'missed' ? I('dash') : ''}</span>
      <span><span class="sj">${c.subject}</span><br><span class="ss">${m ? `<b class="mk">Mark ${m}</b>` : word[s] || c.time}</span></span></button>`; }).join('')}</div>
    ${strip}
    <div class="three" style="${kvars(i)}">
      <div class="card"><span class="lbl">Homework</span>${hw}</div>
      <button class="card" data-act="scores"><span class="lbl">Latest score</span><span class="num">${sc.score.replace(' of ', '<small>of </small>')}</span><span class="lbl">${sc.what.split(',')[0]}, ${sc.when.toLowerCase()}</span></button>
      <button class="card" data-act="scores"><span class="lbl">Average mark</span><span class="meter"><svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" stroke="var(--soft)"/><circle cx="42" cy="42" r="${r}" stroke="var(--k)" stroke-dasharray="${L * avg[0] / avg[1]} ${L}"/></svg><span><b>${avg[0]} of ${avg[1]}</b><span class="lbl">all tests</span></span></span></button>
    </div>`;
}
function renderDetail() { $('#detail').innerHTML = sel === 'today' ? todayView() : kidView(+sel.slice(3)); }
function go(id) { sel = id; renderSide(); renderDetail(); }

/* ---------- sheets ---------- */
const sh = $('#sheet'), dim = $('#dim');
function openSheet(title, body, done = 'Done', msg = '') {
  sh.innerHTML = `<div class="snav"><button class="ib" data-act="close">Cancel</button><b>${title}</b><button class="ib" data-act="done" data-msg="${msg}">${done}</button></div><div class="sbody">${body}</div>`;
  sh.classList.add('on'); dim.classList.add('on');
}
function closeSheet() { sh.classList.remove('on'); dim.classList.remove('on'); }
let tt; function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), 2400); }
const opts = (arr, on = 0, name = '') => `<div class="opts" data-group="${name}">${arr.map((o, n) => `<button aria-pressed="${n === on}" data-act="opt">${o}</button>`).join('')}</div>`;

function homeworkSheet(ci = nowI) {
  openSheet('Add homework', `<div><div class="gh">For</div>${opts(['Everyone', ...K.map((k) => `${k.face} ${k.name} only`)], 0, 'who')}</div>
    <div><div class="gh">Class</div>${opts(C.map((c) => c.subject), ci)}</div>
    <div><div class="gh">What to do</div><textarea placeholder="For example: read pages 16 to 19"></textarea></div>
    <div><div class="gh">Due</div>${opts(['Tomorrow', 'Friday', 'Next week'])}</div>`, 'Add', 'hw');
}
function classSheet(ci, i) {
  const c = C[ci], k = K[i], s = c.state[i], m = mark(ci, i);
  const sc = c.lesson && s === 'done' ? scoreOf(k) : null;
  let body = `<p>${c.title}</p><div class="grp"><div class="li"><span style="font-size:28px">${k.face}</span><span class="m"><b>${k.name}</b><span>${s === 'later' ? 'Starts at ' + c.time : word[s]}</span></span>${m ? `<span class="v">${m} of 12</span>` : ''}</div></div>`;
  if (c.lesson) body += `<p>${sc ? `The lesson test marked itself: ${sc.score}.` : 'The lesson test marks itself when it ends.'}</p><button class="btn ink" data-act="play">${I('play')}Play on the TV</button>`;
  else if (s !== 'later') body += `<div><div class="gh">Add a mark, if you like</div><div class="grp"><div class="li"><span class="m"><b>Out of 12</b></span><span class="stepper"><button data-act="step" data-d="-1" aria-label="Lower">−</button><output id="mk">${m || 'No mark'}</output><button data-act="step" data-d="1" aria-label="Higher">+</button></span></div></div></div>`;
  body += `<button class="btn line" data-act="hwc" data-c="${ci}">Add homework for ${c.subject}</button>`;
  openSheet(`${c.subject}, ${c.time}`, body, 'Done', s !== 'later' && !c.lesson ? 'mark:' + ci + '-' + i : '');
}
function answersSheet() {
  const n = P.needsYou[0];
  openSheet('Leo’s written answers', `<p>${n.detail}. Tests mark themselves; only written answers need you.</p><div class="grp">${[1, 2, 3].map((q) => `<div class="li"><span class="m"><b>Answer ${q}</b></span>${opts(['Right', 'Partly', 'Wrong'], -1)}</div>`).join('')}</div>`, 'Save', 'Marks saved for Leo');
}
function scoresSheet() {
  openSheet('Scores', `<div><div class="gh">Latest</div><div class="grp">${P.scores.map((s) => { const i = K.findIndex((k) => k.name === s.kid); return `<div class="li"><span style="font-size:26px">${K[i].face}</span><span class="m"><b>${s.kid}</b><span>${s.what}, ${s.when.toLowerCase()}</span></span><span class="v">${s.score}</span></div>`; }).join('')}</div></div>
    <div><div class="gh">Average mark</div><div class="grp">${K.map((k) => `<div class="li"><span style="font-size:26px">${k.face}</span><span class="m"><b>${k.name}</b><span>${k.year}</span></span><span class="v">${k.average}</span></div>`).join('')}</div></div>`);
}
function programSheet() {
  openSheet('Program', `<p>Following ${P.admin.plan}. ${P.program.subjects} subjects, ${P.program.readyLessons} video lessons ready.</p>
    <div class="grp"><div class="li"><span class="m"><b>Where we are</b><span>${P.program.where}</span></span></div><button class="li" data-act="soon" data-t="The full program"><span class="m"><b>Open the full program</b><span>Every subject, unit and lesson</span></span></button></div>
    <div><div class="gh">${P.needsYou[2].what}</div><div class="grp"><div class="li"><span class="m"><span>${P.needsYou[2].detail}</span></span>${opts(['1', '2', '3', '4', '5'].map((s) => s + ' ★'), -1)}</div></div></div>`, 'Done', 'Thanks for rating');
}
const act = {
  admin: () => { location.hash = '#admin'; },
  back: () => { location.hash = ''; },
  close: closeSheet,
  done: (e) => {
    const m = e.dataset.msg;
    if (m === 'hw') { const who = sh.querySelector('[data-group="who"] [aria-pressed="true"]').textContent.replace(/^\S+ /, '').replace(' only', ''); toast(who === 'Everyone' ? 'Homework added for all three' : `Homework added for ${who}`); }
    else if (m.startsWith('mark:')) { const o = $('#mk').textContent; if (o !== 'No mark') { given[m.slice(5)] = o; renderDetail(); toast('Mark saved'); } }
    else if (m) toast(m);
    closeSheet();
  },
  soon: (e) => { closeSheet(); toast(`${e.dataset.t} opens here`); },
  play: () => { closeSheet(); toast(`Playing “${nowC.title}” on the TV`); },
  answers: answersSheet, scores: scoresSheet, program: programSheet,
  hw: () => homeworkSheet(), hwc: (e) => homeworkSheet(+e.dataset.c),
  class: (e) => classSheet(+e.dataset.c, +e.dataset.i),
  remind: (e) => toast(`${K[+e.dataset.i].name} will see a reminder on his screen`),
  step: (e) => { const o = $('#mk'); const v = o.textContent === 'No mark' ? 10 : Math.min(12, Math.max(0, +o.textContent + +e.dataset.d)); o.textContent = v; },
  opt: (e) => { e.parentNode.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === e)); },
  size: () => { const cur = document.documentElement.dataset.size || 'n'; openSheet('Text size', `<p>Makes every word on the pad bigger. The layout stays the same.</p>${opts(['Normal', 'Large'], cur === 'l' ? 1 : 0, 'size')}`, 'Done', 'size'); },
  feedback: () => openSheet('Send feedback', `<p>What works, what doesn’t, and what you wish it did.</p><textarea></textarea>`, 'Send', 'Thank you. Feedback sent'),
};
document.addEventListener('click', (ev) => {
  const g = ev.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  const a = ev.target.closest('[data-act]');
  if (a) {
    if (a.dataset.act === 'opt' && a.parentNode.dataset.group === 'size') { act.opt(a); document.documentElement.dataset.size = a.textContent === 'Large' ? 'l' : ''; return; }
    act[a.dataset.act]?.(a); return;
  }
  const s = ev.target.closest('[data-sec]'); if (s) { asel = +s.dataset.sec; renderAdmin(); return; }
  if (ev.target === dim) closeSheet();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

/* ---------- Admin: its own page ---------- */
const secs = [
  { name: 'Your account', groups: [['', [['Name', A.account.name], ['Username', A.account.username], ['Text size', A.account.textSize], ['Password', 'Change']]], ['', [['Sign out', '']]]] },
  { name: 'Family', groups: [['Parents', P.parents.map((p) => [p.name, p.you ? 'You' : 'Parent'])], ['Children', K.map((k) => [`${k.face} ${k.name}`, k.year])], ['', [['Add a child', '']]]] },
  { name: 'Learning plan', groups: [['', [['Curriculum', A.plan], ['Subjects', String(P.program.subjects)], ['Word help', A.wordHelp.replace('Spanish key words: ', 'Spanish key words, ')]]]] },
  { name: 'Plan and billing', groups: [['', [['Plan', A.billing], ['Charged', 'Per child'], ['Children on the plan', String(K.length)]]], ['', [['See plans', '']]]] },
  { name: 'Feedback and checks', groups: [['', [['Exam PIN', A.examPin], ['Send feedback', '']]]] },
];
function renderAdmin() {
  const s = secs[asel];
  const list = secs.map((x, n) => `<button class="sec" data-sec="${n}" aria-current="${n === asel}">${x.name}</button>`).join('');
  $('#aside').innerHTML = `<button class="back" data-act="back">${I('back')}Back to the pad</button><div class="me"><span class="av">${A.account.name[0]}</span><span><b>${A.account.name}</b><span>Parent, signed in</span></span></div>${list}`;
  $('#apick').innerHTML = `<button class="back" data-act="back">${I('back')}Back to the pad</button><div class="secs">${list}</div>`;
  const row = ([a, b]) => { const tap = b === '' || b === 'Change'; return `<${tap ? 'button' : 'div'} class="li"${tap ? ` data-act="${a === 'Send feedback' ? 'feedback' : 'soon'}" data-t="${a}"` : ''}><span class="m"><b>${a}</b></span><span style="color:var(--sub)">${b}</span></${tap ? 'button' : 'div'}>`; };
  $('#adetail').innerHTML = `<div class="head"><div class="tt"><h1>${s.name}</h1><div class="sub">Admin</div></div></div>${s.groups.map(([h, rows]) => `<div>${h ? `<div class="gh">${h}</div>` : ''}<div class="grp">${rows.map(row).join('')}</div></div>`).join('')}`;
}
function route() {
  closeSheet();
  const admin = location.hash === '#admin';
  document.body.classList.toggle('is-admin', admin);
  admin ? renderAdmin() : (renderSide(), renderDetail());
}
route();
addEventListener('hashchange', route);
</script>
</body>
</html>
