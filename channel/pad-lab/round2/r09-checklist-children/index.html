<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklist by child: three lists to tick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Round 2 from 10 Checklist. Same ticks, but the day is grouped by child, not by time. */
:root{
  --ink:#1c2128; --ink2:#525965; --line:#e3e6eb; --bg:#eef0f3; --paper:#fff;
  --accent:#2d5bd7; --accent-soft:#eaf0fd; --late:#b42318; --late-soft:#fdecea;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px}
html.t2{font-size:19px} html.t3{font-size:21px}
body{font-family:Figtree,system-ui,sans-serif;color:var(--ink);background:var(--bg);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;line-height:1.3}
body.scroll{height:auto;min-height:100vh;overflow:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
svg{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}
.page{display:none}
.page.on{display:flex}

/* ---------- pad ---------- */
#pad{flex-direction:column;height:100vh;padding:20px 28px 18px;gap:14px}
.top{display:flex;align-items:center;gap:12px}
.top h1{font-size:2.1rem;font-weight:800;letter-spacing:-.025em;line-height:1.05}
.top .date{color:var(--ink2);font-weight:500;margin-top:2px}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon{min-width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--paper);font-weight:800;font-size:1.05rem;box-shadow:0 0 0 1px var(--line)}
.icon:hover{background:#f7f8fa}
.badge{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px 0 8px;border-radius:99px;background:var(--paper);box-shadow:0 0 0 1px var(--line);font-weight:600;white-space:nowrap}
.badge .n{min-width:32px;height:32px;border-radius:99px;background:var(--late);color:#fff;display:grid;place-items:center;font-weight:800}
.badge:hover{background:#f7f8fa}

/* now */
.now{display:flex;align-items:center;gap:18px;background:var(--ink);color:#fff;border-radius:20px;padding:12px 12px 12px 22px}
.now .lv{width:14px;height:14px;border-radius:50%;background:#ff6b5e;box-shadow:0 0 0 5px rgba(255,107,94,.25);flex:none;animation:beat 2s ease-in-out infinite}
@keyframes beat{50%{box-shadow:0 0 0 9px rgba(255,107,94,.08)}}
.now .w{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.now .w b{font-size:1.25rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .w span{color:#c9cfd8}
.play{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 24px;border-radius:14px;background:#fff;color:var(--ink);font-weight:800;font-size:1.06rem;white-space:nowrap}
.play:hover{background:#e9edf3}

/* three lists */
.cols{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.col{background:var(--paper);border-radius:22px;display:flex;flex-direction:column;min-height:0;padding:6px 8px 10px;box-shadow:0 1px 2px rgba(20,30,50,.06)}
.ch{display:flex;align-items:center;gap:12px;min-height:64px;padding:6px 10px;border-radius:16px}
.ch:hover{background:#f7f8fa}
.ch .face{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:27px;background:var(--ct);flex:none}
.ch .nm{display:flex;flex-direction:column;min-width:0}
.ch .nm b{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.ch .nm span{color:var(--ink2)}
.ch .cnt{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--ink2)}
.ch .cnt b{font-size:1.5rem;font-weight:800;color:var(--cd)}
.prog{height:6px;border-radius:3px;background:#e6e8ec;margin:2px 10px 6px;overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:var(--c);border-radius:3px}
.ticks{list-style:none;flex:1;min-height:0;display:flex;flex-direction:column}
.it{flex:1 1 0;min-height:50px;max-height:78px;display:flex;align-items:center;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.tk{width:52px;height:100%;min-height:48px;display:grid;place-items:center;flex:none}
.ring{width:38px;height:38px;border-radius:50%;border:2.5px solid #9aa1ab;display:grid;place-items:center;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s,border-color .2s}
.ring svg{width:20px;height:20px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .1s ease-out}
.tk:hover .ring{border-color:var(--c)}
.s-done .ring{background:var(--c);border-color:var(--c)}
.s-done .ring svg{stroke-dashoffset:0}
.s-done.pop .ring{transform:scale(1.15)}
.s-now .ring{border-color:var(--c);background:conic-gradient(var(--c) 0 50%,transparent 50%);background-clip:padding-box}
.s-missed .ring{border-color:var(--late);border-style:dashed}
.s-missed .ring svg{stroke:var(--late);stroke-dashoffset:0;opacity:0}
.it .lb{flex:1;min-width:0;align-self:stretch;display:flex;align-items:center;gap:8px;padding:0 8px 0 4px;border-radius:12px;min-height:48px}
.it .lb:hover{background:#f7f8fa}
.it .lb b{font-weight:600;font-size:1.06rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.it .meta{margin-left:auto;white-space:nowrap;color:var(--ink2)}
.meta.mk{font-weight:800;color:var(--ink);background:#eef0f3;border-radius:10px;padding:2px 10px}
.meta.nw{font-weight:700;color:#fff;background:var(--cd);border-radius:99px;padding:2px 12px}
.meta.ms{font-weight:700;color:var(--late)}
.s-done .lb b{color:var(--ink2)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;flex:none}
.stat{border-radius:14px;background:#f3f4f7;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;min-height:62px}
.stat span{color:var(--ink2)}
.stat b{font-size:1.25rem;font-weight:800;line-height:1.15}
button.stat:hover{background:#eaecf0}
.stat.bad{background:var(--late-soft)}
.stat.bad b,.stat.bad span{color:var(--late)}

/* footer */
.foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.you{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:16px;padding:0 16px 0 2px;min-height:56px;box-shadow:0 1px 2px rgba(20,30,50,.06)}
.you .tk{width:52px;min-height:52px}
.you .ring{--c:var(--accent)}
.you .lbl2{font-weight:600}
.you .lbl2 span{color:var(--ink2);font-weight:500}
.links{margin-left:auto;display:flex;gap:8px}
.lk{display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 16px;border-radius:14px;background:var(--paper);font-weight:600;box-shadow:0 1px 2px rgba(20,30,50,.06);white-space:nowrap}
.lk:hover{background:#f7f8fa}
.lk .c{color:var(--ink2);font-weight:500}
.lk .c.late{color:var(--late);font-weight:700}

/* ---------- sheet ---------- */
.veil{position:fixed;inset:0;background:rgba(20,26,36,.42);display:none;z-index:40;align-items:center;justify-content:center;padding:24px}
.veil.on{display:flex;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;border-radius:22px;width:580px;max-width:100%;max-height:calc(100vh - 48px);overflow:auto;box-shadow:0 24px 60px rgba(20,30,50,.25);animation:rise .24s cubic-bezier(.2,1,.3,1)}
@keyframes rise{from{transform:translateY(24px);opacity:.5}}
.sh-bar{display:flex;align-items:center;gap:12px;padding:16px 12px 4px 24px}
.sh-bar h2{font-size:1.45rem;font-weight:800;letter-spacing:-.01em;flex:1}
.x{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#f1f3f6}
.sh-in{padding:4px 24px 8px}
.sub{color:var(--ink2)}
.lines{margin-top:12px}
.line{display:flex;align-items:center;gap:12px;min-height:58px;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .lf{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.line .lf .f{font-size:22px}
.line .st{color:var(--ink2)}
.line .v{font-weight:700;text-align:right}
.st-done{color:#11663a!important} .st-now{color:var(--accent)!important;font-weight:700} .st-missed{color:var(--late)!important;font-weight:700}
.link{min-height:44px;padding:0 12px;border-radius:12px;color:var(--accent);font-weight:700;background:var(--accent-soft)}
.lbl{display:block;font-weight:700;margin:16px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:46px;padding:0 16px;border-radius:99px;border:1.5px solid #c9ced6;font-weight:600}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sheet input{font:inherit;width:100%;min-height:50px;border:1.5px solid #c9ced6;border-radius:14px;padding:0 14px}
.grid12{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}
.grid12 button{min-height:52px;border-radius:12px;border:1.5px solid #c9ced6;text-align:center;font-weight:800;font-size:1.1rem}
.grid12 button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sizes{display:flex;gap:10px;margin-top:14px}
.sizes button{flex:1;min-height:64px;border-radius:14px;border:1.5px solid #c9ced6;text-align:center;font-weight:800}
.sizes button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.sh-foot{display:flex;gap:10px;flex-wrap:wrap;padding:12px 24px 22px}
.btn{min-height:52px;padding:0 22px;border-radius:14px;font-weight:800;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:hover{background:#244bb5}
.btn.sec{background:#fff;border:1.5px solid #c9ced6}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,160%);background:var(--ink);color:#fff;border-radius:16px;padding:6px 6px 6px 20px;display:flex;align-items:center;gap:14px;transition:transform .3s cubic-bezier(.2,1.2,.4,1);z-index:60;max-width:calc(100vw - 32px);min-height:56px}
.toast.on{transform:translate(-50%,0)}
.toast button{color:#a9c2ff;font-weight:800;min-height:44px;padding:0 14px}

/* ---------- child page ---------- */
#kid{flex-direction:column;min-height:100vh;padding:18px 28px 28px;gap:14px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:48px;padding:0 16px 0 6px;border-radius:14px;color:var(--accent);font-weight:800;font-size:1.06rem;align-self:flex-start}
.back:hover{background:#e3e7ee}
.kh{display:flex;align-items:center;gap:16px}
.kh .face{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:42px;background:var(--ct)}
.kh h1{font-size:2.3rem;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.kh p{color:var(--ink2)}
.kgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
.card{background:#fff;border-radius:22px;padding:14px 18px 10px;box-shadow:0 1px 2px rgba(20,30,50,.06)}
.card h2{font-size:1.2rem;font-weight:800;margin:2px 0 4px}
.kgrid .it{min-height:66px;max-height:none}
.kgrid .it .lb{flex-direction:column;align-items:flex-start;justify-content:center;gap:0}
.kgrid .it .lb b{font-size:1.1rem}
.kgrid .it .lb .t2{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.kgrid .it .lb .meta{position:absolute;right:8px}
.kgrid .it .lb{position:relative;padding-right:110px}
.side{display:flex;flex-direction:column;gap:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles .stat{min-height:84px;background:#fff;box-shadow:0 1px 2px rgba(20,30,50,.06);border-radius:18px;padding:10px 16px}
.tiles .stat b{font-size:1.6rem}

/* ---------- admin ---------- */
#admin{min-height:100vh;display:none}
#admin.on{display:grid;grid-template-columns:300px 1fr}
#admin aside{background:#e6e9ee;padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
#admin aside h1{font-size:2rem;font-weight:800;padding:10px 12px 12px}
.nav{display:flex;align-items:center;min-height:52px;padding:0 14px;border-radius:12px;font-weight:600;width:100%}
.nav:hover{background:#dde1e7}
.nav.on{background:#fff;box-shadow:0 1px 2px rgba(20,30,50,.1)}
.asec{padding:40px 52px 64px;max-width:820px}
.asec h2{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.asec .lead{color:var(--ink2);margin-top:6px;max-width:60ch}
.grp{margin-top:24px}
.grp h3{font-weight:700;color:var(--ink2);margin:0 0 8px 4px;font-size:1rem}
.box{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(20,30,50,.06)}
.r{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:58px;padding:0 18px;border-top:1px solid var(--line);width:100%}
.r:first-child{border-top:0}
.r .v{color:var(--ink2);text-align:right}
button.r:hover{background:#fafbfc}
.r.act{color:var(--accent);font-weight:700}
.r.bad{color:var(--late);font-weight:700}

/* ---------- upright ---------- */
@media (max-aspect-ratio:1/1){
  #pad{padding:24px 22px 22px;gap:16px}
  .cols{gap:10px}
  .col{padding:6px 6px 8px}
  .ch{flex-wrap:wrap;gap:4px 10px;padding:8px}
  .ch .cnt{margin-left:0;flex-basis:100%}
  .ch .nm span{display:none}
  .it{max-height:96px}
  .it .lb{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}
  .it .meta{margin-left:0}
  .stats{grid-template-columns:1fr}
  .now{flex-wrap:wrap;padding:14px 14px 14px 22px}
  .now .w{flex-basis:calc(100% - 40px)}
  .now .play{flex:1;justify-content:center}
  .foot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .you{grid-column:1/-1}
  .links{display:contents}
  .lk{justify-content:flex-start}
  .lk .c{margin-left:auto}
  .kgrid{grid-template-columns:1fr}
  #admin.on{grid-template-columns:1fr;align-content:start}
  #admin aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:8px;padding:18px 22px}
  #admin aside .back,#admin aside h1{flex-basis:100%}
  #admin aside .nav{width:auto;background:#fff}
  #admin aside .nav.on{background:var(--ink);color:#fff}
  .asec{padding:22px 22px 60px}
}
/* bigger text: fewer words, nothing cut */
html.t2 #pad,html.t3 #pad{gap:10px;padding-top:14px;padding-bottom:14px}
html.t2 .top h1,html.t3 .top h1{font-size:1.8rem}
html.t2 .ch .nm span,html.t3 .ch .nm span{display:none}
html.t2 .stat,html.t3 .stat{min-height:54px;padding:6px 12px}
html.t3 .now .w span,html.t3 .you .lbl2 span,html.t3 .lk .c{display:none}
@media (min-aspect-ratio:1/1){
  html.t2 .stat span,html.t3 .stat span{font-size:1rem}
  html.t2 .it,html.t3 .it{min-height:46px}
  html.t2 .ch,html.t3 .ch{min-height:56px}
  html.t2 .ch .face,html.t3 .ch .face{width:44px;height:44px;font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="page" id="pad"></div>
<div class="page" id="kid"></div>
<div class="page" id="admin"></div>
<div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="tundo">Undo</button></div>

<script src="../../data.js"></script>
<script>
const P = window.PAD, K = P.kids, C = P.classes, A = P.admin;
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tint = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const NOWI = C.findIndex((c) => c.now), NOWC = C[NOWI];
const MARK = P.needsYou.find((n) => /^mark/i.test(n.action));
const NEEDS = P.needsYou.filter((n) => n !== MARK);
const ANS = MARK ? +((MARK.detail.match(/(\d+) answers?/) || [0, 0])[1]) : 0;
const kidIdx = (t) => K.findIndex((k) => t.includes(k.name));
const short = (c) => c.title.replace(/^.*\?\s*/, '').replace(/, lesson \d+$/, '');
const WORD = { done: 'Done', now: 'Watching now', later: 'Later today', missed: 'Missed' };
const I = {
  check: '<svg viewBox="0 0 16 16"><path d="M3.3 8.6l3 3 6.2-7.2"/></svg>',
  gear: '<svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  play: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>',
  back: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  x: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chart: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>',
  pen: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  book: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>',
  note: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
};

/* Each child's ticks: a copy of the day's states, so a parent's tick can be undone. */
const st = K.map((_, j) => C.map((c) => c.state[j]));
const doneOf = (j) => st[j].filter((s) => s === 'done').length;
const youDone = new Set();
const kidVars = (k) => `--c:${k.color};--cd:${k.color};--ct:${tint(k.color, .12)}`;
const face = (k) => `<span class="f" aria-hidden="true">${k.face}</span>`;

function ring() { return `<span class="ring">${I.check}</span>`; }
function itemRow(j, ci, page) {
  const c = C[ci], s = st[j][ci], m = c.marks && c.marks[j];
  const meta = s === 'now' ? '<span class="meta nw">Now</span>' : s === 'missed' ? '<span class="meta ms">Missed</span>' : m ? `<span class="meta mk num">${m} of 12</span>` : s === 'later' ? `<span class="meta num">${c.time}</span>` : '';
  const label = s === 'done' ? 'Done' : s === 'missed' ? 'Missed' : 'Tick as done';
  return `<li class="it s-${s}" data-j="${j}" data-ci="${ci}"><button class="tk" data-tick aria-label="${esc(c.subject)} for ${K[j].name}: ${label}">${ring()}</button>
    <button class="lb" data-cls="${ci}"><b>${esc(c.subject)}</b>${page ? `<span class="t2">${esc(c.title)}</span>` : ''}${meta}</button></li>`;
}
function renderPad() {
  const watching = K.filter((_, j) => st[j][NOWI] === 'now').map((k) => k.name);
  const fin = K.filter((_, j) => st[j][NOWI] === 'done').map((k) => k.name);
  const hw = K.reduce((a, k) => a + k.homework, 0), late = K.reduce((a, k) => a + k.late, 0);
  const shared = NEEDS.map((n, i) => ({ n, i })).filter(({ n }) => kidIdx(n.what) < 0);
  $('#pad').innerHTML = `
    <header class="top"><div><h1>Today</h1><p class="date">${P.today}</p></div>
      <div class="tools">${ANS ? `<button class="badge" data-answers><span class="n num">${ANS}</span>answers to mark</button>` : ''}
      <button class="icon" data-sheet="size" aria-label="Text size">Aa</button><a class="icon" href="#admin" aria-label="Admin: account, family and plan">${I.gear}</a></div></header>
    <section class="now"><span class="lv" aria-hidden="true"></span><div class="w"><b>${esc(NOWC.subject)}: ${esc(short(NOWC))}</b><span>${watching.join(' and ')} watching now. ${fin.join(' and ')} finished.</span></div>
      <button class="play" data-play>${I.play}Play on the TV</button></section>
    <div class="cols">${K.map((k, j) => {
      const late1 = NEEDS.findIndex((n) => kidIdx(n.what) === j && /late/.test(n.what));
      return `<section class="col" style="${kidVars(k)}" aria-label="${k.name}">
      <a class="ch" href="#kid-${k.name.toLowerCase()}"><span class="face" aria-hidden="true">${k.face}</span><span class="nm"><b>${k.name}</b><span>${k.year}</span></span><span class="cnt"><b class="num">${doneOf(j)}</b>of ${k.of} done</span></a>
      <div class="prog"><i style="width:${(doneOf(j) / k.of) * 100}%"></i></div>
      <ul class="ticks">${C.map((_, ci) => itemRow(j, ci)).join('')}</ul>
      <div class="stats"><div class="stat"><span>Average</span><b class="num">${k.average}</b></div>
        ${late1 >= 0 ? `<button class="stat bad" data-need="${late1}"><span>Homework</span><b>${k.late} late</b></button>`
          : `<button class="stat" data-sheet="homework"><span>Homework</span><b>${k.homework ? k.homework + ' to do' : 'None'}</b></button>`}</div></section>`; }).join('')}</div>
    <footer class="foot">
      ${shared.map(({ n, i }) => `<div class="you${youDone.has(i) ? ' s-done' : ''}" data-you="${i}"><button class="tk" data-youtick aria-label="${esc(n.what)}: tick as done">${ring()}</button><button class="lbl2" data-need="${i}" style="min-height:48px">${esc(n.what)} <span>for you</span></button></div>`).join('')}
      <div class="links"><button class="lk" data-sheet="scores">${I.chart}Scores <span class="c">${P.scores.length} new</span></button>
        <button class="lk" data-sheet="homework">${I.pen}Homework <span class="c${late ? ' late' : ''}">${late ? late + ' late' : hw}</span></button>
        <button class="lk" data-sheet="program">${I.book}Program</button>
        <button class="lk" data-sheet="feedback">${I.note}Feedback</button></div>
    </footer>`;
}

function renderKid(name) {
  const j = K.findIndex((k) => k.name.toLowerCase() === name), k = K[j];
  if (!k) { location.hash = ''; return; }
  const sc = P.scores.filter((s) => s.kid === k.name);
  const late = NEEDS.findIndex((n) => kidIdx(n.what) === j && /late/.test(n.what));
  $('#kid').style.cssText = kidVars(k);
  $('#kid').innerHTML = `<a class="back" href="#">${I.back}Today</a>
    <div class="kh"><span class="face" aria-hidden="true">${k.face}</span><div><h1>${k.name}</h1><p>${k.year}. ${doneOf(j)} of ${k.of} classes done today.</p></div></div>
    <div class="kgrid">
      <section class="card"><h2>Today</h2><ul class="ticks">${C.map((_, ci) => itemRow(j, ci, true)).join('')}</ul></section>
      <div class="side">
        <div class="tiles"><div class="stat"><span>Average</span><b class="num">${k.average}</b></div>
          ${late >= 0 ? `<button class="stat bad" data-need="${late}"><span>Homework</span><b>${k.late} late</b></button>` : `<div class="stat"><span>Homework</span><b>${k.homework ? k.homework + ' to do' : 'None'}</b></div>`}</div>
        ${(late >= 0 || (MARK && kidIdx(MARK.what) === j)) ? `<section class="card"><h2>For you</h2><div class="lines">
          ${MARK && kidIdx(MARK.what) === j ? `<div class="line"><span class="lf">${esc(MARK.detail)}</span><button class="link" data-answers>Mark</button></div>` : ''}
          ${late >= 0 ? `<div class="line"><span class="lf">${esc(NEEDS[late].detail)}</span><button class="link" data-need="${late}">${esc(NEEDS[late].action)}</button></div>` : ''}</div></section>` : ''}
        <section class="card"><h2>Latest tests</h2><div class="lines">${sc.length ? sc.map((s) => `<div class="line"><span class="lf">${esc(s.what)}</span><span class="v num">${s.score}</span></div>`).join('') : '<div class="line"><span class="sub">No new tests.</span></div>'}</div></section>
      </div>
    </div>`;
}

/* ---------- sheets (shared by every page) ---------- */
let ctx = {};
function sheet(title, body, foot) {
  $('#sheet').innerHTML = `<div class="sh-bar"><h2>${title}</h2><button class="x" data-close aria-label="Close">${I.x}</button></div><div class="sh-in">${body}</div>${foot ? `<div class="sh-foot">${foot}</div>` : ''}`;
  $('#veil').classList.add('on');
}
const closeSheet = () => $('#veil').classList.remove('on');
function toast(m, undo) {
  $('#tmsg').textContent = m; $('#tundo').style.display = undo ? '' : 'none'; toast.undo = undo;
  $('#toast').classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => $('#toast').classList.remove('on'), 4000);
}
const S = {
  cls(ci) {
    const c = C[ci]; ctx = { ci };
    sheet(esc(c.subject), `<p class="sub">${esc(c.title)}. Starts ${c.time}${c.lesson ? '. Video lesson; its test marks itself' : ''}.</p>
      <div class="lines">${K.map((k, j) => { const s = st[j][ci], m = c.marks && c.marks[j];
        return `<div class="line"><span class="lf">${face(k)}<b>${k.name}</b></span><span class="st st-${s}">${WORD[s]}${m ? `, mark ${m}` : ''}</span>${s === 'done' && !c.lesson ? `<button class="link" data-mark="${j}">${m ? 'Change mark' : 'Add a mark'}</button>` : ''}</div>`; }).join('')}</div>`,
      `${c.lesson ? `<button class="btn pri" data-play>${I.play}Play on the TV</button>` : ''}<button class="btn sec" data-hw="${ci}">Add homework</button>`);
  },
  mark(ci, j) {
    ctx = { ci, j };
    sheet(`Mark for ${K[j].name}`, `<p class="sub">${esc(C[ci].subject)}: ${esc(C[ci].title)}. Out of 12.</p>
      <div class="grid12">${Array.from({ length: 12 }, (_, n) => `<button class="num${C[ci].marks && C[ci].marks[j] == n + 1 ? ' on' : ''}" data-m="${n + 1}">${n + 1}</button>`).join('')}</div>`,
      `<button class="btn pri" data-savemark>Save mark</button><button class="btn sec" data-close>Cancel</button>`);
  },
  hw(ci = NOWI) {
    sheet('Add homework', `<p class="sub">Homework goes to everyone. Pick one child only if it is just for them.</p>
      <span class="lbl">For</span><div class="chips"><button class="chip on" data-who="-1">Everyone</button>${K.map((k, j) => `<button class="chip" data-who="${j}">${k.face} ${k.name}</button>`).join('')}</div>
      <span class="lbl">Class</span><div class="chips">${C.map((c, i) => `<button class="chip${i === ci ? ' on' : ''}">${esc(c.subject)}</button>`).join('')}</div>
      <label class="lbl" for="hwt">What to do</label><input id="hwt" placeholder="For example: read pages 16 to 18">
      <span class="lbl">Due</span><div class="chips"><button class="chip on">Tomorrow</button><button class="chip">Wednesday</button><button class="chip">Friday</button></div>`,
      `<button class="btn pri" data-savehw>Add homework</button><button class="btn sec" data-close>Cancel</button>`);
  },
  answers() {
    const k = K[kidIdx(MARK.what)];
    sheet('Answers to mark', `<p class="sub">${esc(MARK.detail)}.</p><div class="lines">${Array.from({ length: ANS }, (_, n) => `<div class="line"><span class="lf">${face(k)}<b>${k.name}, answer ${n + 1}</b></span><span class="st">Waiting for you</span></div>`).join('')}</div>`,
      `<button class="btn pri" data-go="Opening ${k.name}’s first answer">Start marking</button><button class="btn sec" data-close>Later</button>`);
  },
  need(i) {
    const n = NEEDS[i];
    sheet(esc(n.what), `<p class="sub">${esc(n.detail)}.</p>`, `<button class="btn pri" data-go="${n.action === 'Remind' ? 'Reminder sent to ' + K[kidIdx(n.what)].name : 'Opening the rating'}">${esc(n.action)}</button><button class="btn sec" data-close>Later</button>`);
  },
  scores() {
    sheet('Scores', `<p class="sub">Tests mark themselves. Newest first, out of 12 unless shown.</p><div class="lines">${P.scores.map((s) => `<div class="line"><span class="lf">${face(K[kidIdx(s.kid)])}<span><b>${s.kid}</b> ${esc(s.what)}, ${s.when.toLowerCase()}</span></span><span class="v num">${s.score}</span></div>`).join('')}</div>
      <span class="lbl">Averages</span><div class="lines">${K.map((k) => `<div class="line"><span class="lf">${face(k)}<b>${k.name}</b></span><span class="v num">${k.average}</span></div>`).join('')}</div>`);
  },
  homework() {
    const lt = NEEDS.find((n) => /late/.test(n.what));
    sheet('Homework', `<p class="sub">Set and not yet handed in.</p><div class="lines">${K.map((k) => `<div class="line"><span class="lf">${face(k)}<b>${k.name}</b></span><span class="v${k.late ? ' st-missed' : ''}">${k.homework ? `${k.homework} to do${k.late ? `, ${k.late} late` : ''}` : 'Nothing set'}</span></div>`).join('')}</div>
      ${lt ? `<p class="sub" style="margin-top:10px">Late: ${esc(lt.detail)}.</p>` : ''}`, `<button class="btn pri" data-hw="${NOWI}">Add homework</button>`);
  },
  program() {
    sheet('The program', `<p class="sub">Follows ${esc(A.plan)}.</p><div class="lines"><div class="line"><span class="lf">Subjects</span><span class="v">${P.program.subjects}</span></div><div class="line"><span class="lf">Video lessons ready</span><span class="v">${P.program.readyLessons}</span></div><div class="line"><span class="lf">Where you are</span><span class="v" style="max-width:60%">${esc(P.program.where)}</span></div></div>`);
  },
  size() {
    const cur = document.documentElement.className || 't1';
    sheet('Text size', `<p class="sub">Bigger text shows fewer words. Nothing is cut.</p><div class="sizes">${['Normal', 'Large', 'Largest'].map((n, i) => `<button data-size="${i + 1}" class="${cur === 't' + (i + 1) ? 'on' : ''}" style="font-size:${17 + i * 3}px">${n}</button>`).join('')}</div>`);
  },
  feedback() {
    sheet('Send feedback', `<p class="sub">Tell us what works and what doesn’t. We read every note.</p><label class="lbl" for="fb">Your note</label><input id="fb" placeholder="Write here">`, `<button class="btn pri" data-go="Thank you. Your note is sent.">Send</button><button class="btn sec" data-close>Cancel</button>`);
  },
};

function tick(j, ci, row) {
  const prev = st[j][ci];
  if (prev === 'done' || prev === 'missed') return S.cls(ci);
  st[j][ci] = 'done';
  row.className = 'it s-done pop';
  setTimeout(() => { route(); toast(`${C[ci].subject} ticked for ${K[j].name}`, () => { st[j][ci] = prev; route(); }); }, 450);
}

document.addEventListener('click', (e) => {
  const t = (s) => e.target.closest(s); let el;
  if (e.target.id === 'veil' || t('[data-close]')) return closeSheet();
  if (t('[data-play]')) { closeSheet(); return toast(`Playing ${NOWC.subject} on the TV: ${short(NOWC)}`); }
  if ((el = t('[data-tick]'))) { const row = el.closest('.it'); return tick(+row.dataset.j, +row.dataset.ci, row); }
  if ((el = t('[data-youtick]'))) { const box = el.closest('.you'), i = +box.dataset.you; if (youDone.has(i)) youDone.delete(i); else { youDone.add(i); box.classList.add('s-done'); setTimeout(() => toast('Done: ' + NEEDS[i].what, () => { youDone.delete(i); route(); }), 300); return; } return route(); }
  if ((el = t('#sheet .chips .chip'))) { el.parentNode.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === el)); return; }
  if ((el = t('[data-m]'))) { el.parentNode.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === el)); return; }
  if ((el = t('[data-size]'))) { document.documentElement.className = el.dataset.size === '1' ? '' : 't' + el.dataset.size; el.parentNode.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === el)); route(true); return; }
  if ((el = t('[data-cls]'))) return S.cls(+el.dataset.cls);
  if ((el = t('[data-mark]'))) return S.mark(ctx.ci, +el.dataset.mark);
  if ((el = t('[data-hw]'))) return S.hw(+el.dataset.hw);
  if (t('[data-savehw]')) { const w = +$('#sheet [data-who].on').dataset.who; closeSheet(); return toast(`Homework added for ${w < 0 ? 'everyone' : K[w].name}`); }
  if (t('[data-savemark]')) { const m = $('#sheet [data-m].on'); if (!m) return; closeSheet(); return toast(`Mark ${m.dataset.m} saved for ${K[ctx.j].name}`); }
  if ((el = t('[data-need]'))) return S.need(+el.dataset.need);
  if (t('[data-answers]')) return S.answers();
  if ((el = t('[data-go]'))) { closeSheet(); return toast(el.dataset.go); }
  if ((el = t('[data-sheet]'))) return S[el.dataset.sheet]();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); if (e.key === 'Enter' && e.target.matches('div[data-cls]')) e.target.click(); });
$('#tundo').onclick = () => { toast.undo && toast.undo(); $('#toast').classList.remove('on'); };

/* ---------- admin, its own page ---------- */
const AS = {
  'Your account': `<h2>Your account</h2><p class="lead">How you sign in, and how the app looks for you.</p>
    <div class="grp"><div class="box"><div class="r"><span>Name</span><span class="v">${A.account.name}</span></div><div class="r"><span>Username</span><span class="v">${A.account.username}</span></div><button class="r"><span>Password</span><span class="v">Change</span></button><button class="r" data-sheet="size"><span>Text size</span><span class="v">${A.account.textSize}</span></button></div></div>
    <div class="grp"><div class="box"><button class="r bad">Sign out</button></div></div>`,
  'Family': `<h2>Family</h2><p class="lead">Everyone uses one sign-in. Children have their own logins inside your account, with no email.</p>
    <div class="grp"><h3>Parents</h3><div class="box">${P.parents.map((p) => `<div class="r"><span>${p.name}</span><span class="v">${p.you ? 'You' : 'Parent'}</span></div>`).join('')}<button class="r act">Invite a parent</button></div></div>
    <div class="grp"><h3>Children</h3><div class="box">${K.map((k) => `<button class="r"><span>${k.face}&nbsp; ${k.name}</span><span class="v">${k.year}</span></button>`).join('')}</div></div>`,
  'Learning plan': `<h2>Learning plan</h2><p class="lead">The program follows a curriculum. It is not approved by anyone.</p>
    <div class="grp"><div class="box"><button class="r"><span>Curriculum</span><span class="v">${A.plan}</span></button><button class="r"><span>Word help</span><span class="v">${A.wordHelp}</span></button><div class="r"><span>Subjects</span><span class="v">${P.program.subjects}</span></div><div class="r"><span>Video lessons ready</span><span class="v">${P.program.readyLessons}</span></div></div></div>`,
  'Plan and billing': `<h2>Plan and billing</h2><p class="lead">The service is charged per child.</p>
    <div class="grp"><div class="box"><div class="r"><span>Your plan</span><span class="v">${A.billing}</span></div><div class="r"><span>Children on the plan</span><span class="v">${K.length}</span></div></div></div>`,
  'Feedback and checks': `<h2>Feedback and checks</h2><p class="lead">Tell us what to fix, and keep exams fair.</p>
    <div class="grp"><div class="box"><button class="r" data-sheet="feedback"><span>Send feedback</span><span class="v">Write a note</span></button><button class="r"><span>Exam PIN</span><span class="v">${A.examPin}</span></button></div></div>`,
};
let aCur = A.sections[0];
function renderAdmin() {
  $('#admin').innerHTML = `<aside><a class="back" href="#">${I.back}Today</a><h1>Admin</h1>${A.sections.map((s) => `<button class="nav${s === aCur ? ' on' : ''}" data-sec="${s}">${s}</button>`).join('')}</aside><div class="asec">${AS[aCur]}</div>`;
}
$('#admin').addEventListener('click', (e) => { const b = e.target.closest('[data-sec]'); if (b) { aCur = b.dataset.sec; renderAdmin(); } });

function route(keep) {
  if (!keep) closeSheet();
  const h = location.hash.slice(1);
  document.querySelectorAll('.page').forEach((p) => p.classList.remove('on'));
  let pg = 'pad';
  if (h === 'admin') { renderAdmin(); pg = 'admin'; }
  else if (h.startsWith('kid-')) { renderKid(h.slice(4)); pg = 'kid'; }
  else renderPad();
  $('#' + pg).classList.add('on');
  document.body.classList.toggle('scroll', pg !== 'pad');
  if (!keep) scrollTo(0, 0);
}
addEventListener('hashchange', () => route()); route();
</script>
</body>
</html>
