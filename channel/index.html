<title>Home School TV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Home School"><link rel="apple-touch-icon" href="assets/app-icon.png"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Young+Serif&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
/* Layout concept: a TV channel. Home is rows of big posters; the player is a fixed 1920×1080 stage scaled to the screen, with a 96px TV-safe margin. */
:root {
  --ink: #0B0910; --plum: #17131F; --plum-2: #262033; --paper: #F5F4FA; --fg: #FBFAFF; --dim: #C9C4D6;
  --tomato: #D42A20; --yellow: #FFC400; --good: #7BE0C3; --bad: #FFB4A2; --em: #FFC400;
  --bone: #F5F1E2; --bone-line: #17131F; --bone-hi: #FFC400;
  --display: 'Bricolage Grotesque', Arial, sans-serif; --body: 'DM Sans', Arial, sans-serif; --serif: 'Young Serif', Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--ink); color: var(--fg); font-family: var(--body); }
body.playing { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
button, a { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
h1, h2 { font-family: var(--display); font-weight: 800; letter-spacing: -.02em; line-height: 1.02; text-wrap: balance; }
em { font-style: normal; color: var(--em); }
.tab { font-variant-numeric: tabular-nums; }
:focus { outline: none; }
:focus-visible { outline: 6px solid var(--yellow); outline-offset: 5px; }

/* Home */
.heroTV { position: relative; overflow: hidden; background: var(--ink); min-height: min(86vh, 56vw + 120px); display: flex; flex-direction: column; justify-content: space-between; gap: 40px;
  padding-block: max(20px, 2.4vw) max(30px, 4vw); padding-left: max(16px, env(safe-area-inset-left, 0px), 4vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 4vw); }
.heroImg { position: absolute; right: 0; top: 0; width: 50%; height: 100%; object-fit: cover; object-position: 50% 9%; -webkit-mask-image: linear-gradient(90deg, transparent, #000 34%); mask-image: linear-gradient(90deg, transparent, #000 34%); }
.heroTV > .topBar, .heroTV > .heroText { position: relative; }
.topBar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 800 clamp(22px, 2vw, 34px) var(--display); letter-spacing: -.02em; }
.brand i { font-style: normal; background: var(--tomato); padding: 0 .35em; border-radius: 8px; }
.kids { display: flex; flex-wrap: wrap; gap: 8px; }
.kids button { background: #0008; border: 2px solid #FFF5; border-radius: 99px; padding: .45em 1em; font-weight: 700; font-size: clamp(15px, 1.2vw, 22px); min-height: 44px; }
.kids button[aria-pressed="true"] { background: var(--fg); color: var(--plum); border-color: var(--fg); }
.heroText { max-width: min(760px, 100%); display: grid; gap: clamp(10px, 1.2vw, 20px); justify-items: start; }
.heroText .eyebrow { color: var(--yellow); }
.heroText h1 { font-size: clamp(44px, 6.4vw, 118px); line-height: .95; }
.blurb { font-size: clamp(17px, 1.5vw, 28px); line-height: 1.35; }
.meta { color: var(--dim); font-size: clamp(15px, 1.15vw, 22px); }
.eyebrow { font-weight: 700; letter-spacing: .09em; text-transform: uppercase; font-size: clamp(14px, 1.1vw, 22px); }
.tvBtn { display: inline-block; background: var(--tomato); color: #fff; border: 0; border-radius: 16px; padding: .55em 1.2em; font: 700 clamp(19px, 1.6vw, 34px) var(--body); text-decoration: none; min-height: 52px; }
.tvBtn.alt { background: transparent; box-shadow: inset 0 0 0 3px #FFF8; }
.rowTV { padding-block: clamp(14px, 1.6vw, 30px); padding-left: max(16px, env(safe-area-inset-left, 0px), 4vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 4vw); }
.rowTV h2 { font-size: clamp(24px, 2.3vw, 44px); margin-bottom: clamp(10px, 1vw, 18px); }
.posterRow { display: flex; gap: clamp(10px, 1vw, 20px); overflow-x: auto; padding: 10px; margin: -10px; scrollbar-width: none; }
.photoPoster, .artPoster { flex: 0 0 clamp(210px, 22vw, 420px); aspect-ratio: 16 / 10; border: 0; border-radius: 16px; padding: clamp(10px, 1vw, 18px); text-align: left; color: #fff; display: flex; flex-direction: column; justify-content: flex-end; transition: transform .15s; position: relative; overflow: hidden; }
.photoPoster { background-size: cover; background-position: 50% 25%; }
.photoPoster:focus, .artPoster:focus, .photoPoster:hover, .artPoster:hover { transform: scale(1.04); }
.photoPoster b, .artPoster b { font: 800 clamp(20px, 1.9vw, 36px)/1.04 var(--display); letter-spacing: -.01em; position: relative; }
.photoPoster small, .artPoster small { font: 700 clamp(13px, .95vw, 18px) var(--body); position: relative; }
.pArt { position: absolute; right: -2%; top: -6%; height: 88%; opacity: .92; }
.scoreRow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(8px, 1vw, 18px); }
.scoreCard { background: var(--plum-2); border-radius: 16px; padding: clamp(12px, 1.3vw, 24px); display: grid; gap: 4px; min-width: 0; }
.scoreCard b { font-size: clamp(15px, 1.2vw, 22px); }
.scoreCard span { font: 800 clamp(20px, 2.6vw, 50px)/1.05 var(--display); }
.scoreCard small { color: var(--dim); font-size: clamp(13px, .95vw, 18px); }
.fine { color: var(--dim); margin-top: 10px; font-size: clamp(14px, 1vw, 18px); }
.creditsTV { padding-block: 24px 50px; padding-left: max(16px, env(safe-area-inset-left, 0px), 4vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 4vw); color: var(--dim); font-size: 14px; line-height: 1.5; display: grid; gap: 8px; }
.creditsTV h2 { font-size: 20px; color: var(--fg); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--plum); font-weight: 700; padding: 14px 22px; border-radius: 12px; z-index: 30; max-width: calc(100% - 32px); }

/* Learning map */
.mapPage { min-height: 100vh; padding-block: max(16px, 2vw); padding-left: max(16px, env(safe-area-inset-left, 0px), 4vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 4vw); display: flex; flex-direction: column; gap: clamp(14px, 1.6vw, 28px); }
.mapTop { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
.mapSwitch { display: flex; flex-wrap: wrap; gap: 4px; background: var(--plum-2); padding: 4px; border-radius: 14px; }
.mapSwitch button { border: 0; background: none; padding: .5em 1em; border-radius: 10px; font-weight: 700; font-size: clamp(15px, 1.15vw, 22px); min-height: 44px; }
.mapSwitch button[aria-pressed="true"] { background: var(--fg); color: var(--plum); }
.mapIntro { color: var(--dim); font-size: clamp(16px, 1.3vw, 24px); }
.mapFine { color: var(--dim); font-size: clamp(14px, 1vw, 18px); }
/* A: one path */
.pathStage { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 3fr) minmax(0, 1fr); gap: clamp(8px, 1.2vw, 22px); align-items: stretch; min-height: min(58vh, 620px); }
.pathSide { background: var(--plum-2); border: 0; border-radius: 18px; padding: clamp(10px, 1.2vw, 22px); text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 0; color: var(--fg); }
.pathSide.empty { background: transparent; }
.pathSide small { color: var(--dim); font-size: clamp(13px, 1vw, 18px); font-weight: 700; }
.pathSide b { font: 800 clamp(16px, 1.7vw, 30px)/1.1 var(--display); overflow-wrap: anywhere; }
.pathMain { background: var(--plum-2); border-radius: 24px; padding: clamp(18px, 3vw, 56px); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: clamp(8px, 1.1vw, 20px); min-width: 0; }
.pathMain.now { background: var(--tomato); }
.pathLabel { font-weight: 700; font-size: clamp(15px, 1.4vw, 26px); }
.pathMain h1 { font-size: clamp(32px, 5.6vw, 110px); line-height: .98; }
.pathNote { font-size: clamp(17px, 1.8vw, 32px); line-height: 1.25; max-width: 28em; }
.pathStatus { font-weight: 700; font-size: clamp(14px, 1.1vw, 20px); box-shadow: inset 0 0 0 2px currentColor; padding: .25em .8em; border-radius: 99px; }
.tvBtn.light { background: var(--fg); color: var(--plum); }
.pathLine { list-style: none; margin: 0; padding: 0; display: flex; justify-content: space-between; position: relative; }
.pathLine::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 4px; background: var(--plum-2); }
.pathLine li { position: relative; }
.pathLine button { display: block; width: 44px; height: 44px; padding: 14px; border: 0; background: none; }
.pathLine button::before { content: ""; display: block; width: 16px; height: 16px; border-radius: 50%; background: var(--dim); }
.pathLine li.on button { padding: 6px; }
.pathLine li.on button::before { width: 32px; height: 32px; background: var(--yellow); }
.pathLine li.now:not(.on) button::before { background: var(--tomato); }
.pathCrumb { text-align: center; color: var(--dim); font-size: clamp(14px, 1.05vw, 20px); }
@media (max-width: 760px) { .pathStage { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .pathMain { grid-column: 1 / -1; grid-row: 1; min-height: 340px; } }
/* B: zoom in */
.zoomCrumb { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: clamp(16px, 1.3vw, 24px); }
.zoomCrumb button { background: none; border: 0; text-decoration: underline; min-height: 44px; padding: 0 4px; color: var(--dim); }
.zoomCrumb span { color: var(--dim); }
.zoomContinue { background: var(--tomato); color: #fff; border: 0; border-radius: 20px; padding: clamp(16px, 2vw, 36px); text-align: left; display: grid; gap: 4px; }
.zoomContinue small { font-weight: 700; font-size: clamp(14px, 1.1vw, 20px); }
.zoomContinue b { font: 800 clamp(26px, 3.4vw, 64px)/1.03 var(--display); }
.zoomContinue span { font-size: clamp(16px, 1.3vw, 24px); }
.zoomGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 45%), 1fr)); gap: clamp(8px, 1vw, 18px); }
.zoomGrid.three { flex: 1; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.zoomTile { --c: var(--plum-2); background: var(--c); color: #fff; border: 0; border-radius: 18px; padding: clamp(14px, 1.6vw, 30px); text-align: left; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; min-height: clamp(110px, 12vw, 220px); }
.zoomTile.off { background: var(--plum-2); color: var(--dim); }
.zoomTile b { font: 800 clamp(22px, 2.6vw, 48px)/1.05 var(--display); }
.zoomTile small { font-size: clamp(13px, 1vw, 18px); }
.zoomYear { display: grid; gap: 8px; }
.zoomYear h2 { font-size: clamp(22px, 2vw, 38px); }
.zoomYear h2 small { font: 500 clamp(14px, 1vw, 18px) var(--body); color: var(--dim); letter-spacing: 0; }
.zoomList { display: grid; gap: 6px; }
.zoomRow { display: flex; justify-content: space-between; gap: 12px; background: var(--plum-2); color: var(--fg); border: 0; border-radius: 12px; padding: clamp(12px, 1vw, 20px) clamp(14px, 1.3vw, 24px); text-align: left; font-size: clamp(16px, 1.4vw, 26px); }
.zoomRow span { color: var(--dim); white-space: nowrap; font-size: .8em; }
.zoomRow.here { background: var(--yellow); color: var(--plum); }
.zoomRow.here span { color: var(--plum); }
.zoomLessons { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.zoomLessons li { display: flex; align-items: center; gap: clamp(10px, 1.2vw, 22px); background: var(--plum-2); border-radius: 14px; padding: clamp(12px, 1.2vw, 22px); flex-wrap: wrap; }
.zoomLessons li.ready { background: var(--tomato); }
.zoomLessons li > span { font: 800 clamp(24px, 2.6vw, 48px) var(--display); width: 1.2em; }
.zoomLessons li > div { flex: 1 1 220px; display: grid; gap: 2px; min-width: 0; }
.zoomLessons b { font-size: clamp(18px, 1.7vw, 32px); }
.zoomLessons small { font-size: clamp(14px, 1.05vw, 20px); }
.zoomLessons em { font-style: normal; color: var(--dim); font-size: clamp(13px, 1vw, 18px); }
.zoomEmpty { color: var(--dim); font-size: clamp(16px, 1.3vw, 24px); }
/* C: school year */
.yearTabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.yearTabs button { background: var(--plum-2); color: var(--fg); border: 0; border-radius: 12px; padding: .5em .6em; font: 800 clamp(17px, 1.6vw, 30px) var(--display); display: grid; }
.yearTabs small { font: 500 clamp(12px, .95vw, 18px) var(--body); color: var(--dim); }
.yearTabs button[aria-pressed="true"] { background: var(--fg); color: var(--plum); }
.yearTabs button[aria-pressed="true"] small { color: var(--plum); }
.yearNow { background: var(--tomato); color: #fff; border: 0; border-radius: 18px; padding: clamp(14px, 1.6vw, 28px); text-align: left; display: grid; gap: 2px; }
.yearNow small { font-weight: 700; font-size: clamp(14px, 1.05vw, 20px); }
.yearNow b { font: 800 clamp(24px, 2.8vw, 54px)/1.05 var(--display); }
.yearNow span { font-size: clamp(16px, 1.3vw, 24px); }
.yearTerms { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 1.2vw, 22px); }
.yearTerms section { display: grid; gap: 6px; align-content: start; min-width: 0; }
.yearTerms h2 { font-size: clamp(20px, 1.8vw, 34px); }
.yearUnit { display: flex; gap: 10px; background: var(--plum-2); border-radius: 12px; padding: clamp(10px, .9vw, 16px); min-width: 0; }
.yearUnit i { flex: none; width: 8px; border-radius: 4px; }
.yearUnit div { display: grid; gap: 2px; min-width: 0; }
.yearUnit b { font-size: clamp(15px, 1.2vw, 23px); line-height: 1.15; }
.yearUnit small { color: var(--dim); font-size: clamp(12px, .9vw, 17px); }
.yearUnit.here { background: var(--yellow); color: var(--plum); }
.yearUnit.here small { color: var(--plum); }
@media (max-width: 760px) { .yearTerms { grid-template-columns: minmax(0, 1fr); } }
.whoTest { display: grid; gap: 40px; justify-items: start; padding-top: 110px; }
.whoRow { display: flex; flex-wrap: wrap; gap: 16px; }
.whoHead { margin-top: 10px; }

/* Program versions in the channel's own look */
.mapSwitch button { white-space: nowrap; }
.flushRow { padding-left: 0; padding-right: 0; }
.shelfCount { font: 500 clamp(14px, 1.05vw, 20px) var(--body); color: var(--dim); letter-spacing: 0; }
.progNow { display: grid; grid-template-columns: clamp(90px, 16vw, 300px) minmax(0, 1fr) auto; gap: clamp(12px, 2vw, 36px); align-items: center; background: var(--plum-2); border: 0; border-radius: 18px; padding: 0 clamp(14px, 2vw, 36px) 0 0; overflow: hidden; text-align: left; color: var(--fg); min-height: clamp(110px, 12vw, 220px); }
.progNow img { width: 100%; height: 100%; min-height: clamp(110px, 12vw, 220px); object-fit: cover; }
.progNowText { display: grid; gap: 4px; min-width: 0; }
.progNowText small { color: var(--yellow); font-weight: 700; font-size: clamp(14px, 1.15vw, 22px); }
.progNowText b { font: 800 clamp(30px, 4.2vw, 80px)/1 var(--display); letter-spacing: -.02em; }
.progNowText span { color: var(--dim); font-size: clamp(14px, 1.15vw, 22px); }
.subjectTabs { display: flex; gap: clamp(4px, .6vw, 10px); overflow-x: auto; padding: 8px; margin: -8px; scrollbar-width: none; }
.subjectTabs button { flex: 1 0 auto; border: 0; background: var(--plum-2); color: var(--fg); border-radius: 12px; padding: .6em 1em; font: 700 clamp(16px, 1.45vw, 28px) var(--body); min-height: 48px; }
.subjectTabs button[aria-pressed="true"] { background: var(--fg); color: var(--plum); }
.subjectBand { position: relative; overflow: hidden; display: grid; gap: 6px; justify-items: start; border: 0; border-radius: 18px; color: #fff; text-align: left; padding: clamp(16px, 2.4vw, 44px); }
.subjectBand small, .subjectBand span { font-size: clamp(15px, 1.2vw, 24px); font-weight: 600; position: relative; }
.subjectBand b { font: 800 clamp(32px, 4.8vw, 92px)/1 var(--display); letter-spacing: -.02em; position: relative; max-width: 75%; }
.subjectBand .pArt, .unitHead .pArt { height: 130%; top: -15%; right: 2%; opacity: .55; }
.unitPoster.isNow, .wallChip.isNow { box-shadow: 0 0 0 4px var(--yellow); }
.unitPoster.isNow small { color: var(--yellow); }
.unitPoster .pArt { opacity: .28; }
.unitBack { justify-self: start; align-self: flex-start; }
.unitHead { position: relative; overflow: hidden; border-radius: 18px; padding: clamp(16px, 2.6vw, 48px); color: #fff; display: grid; gap: 6px; }
.unitHead small, .unitHead p { font-size: clamp(16px, 1.3vw, 26px); font-weight: 600; position: relative; }
.unitHead h1 { font-size: clamp(34px, 5vw, 96px); position: relative; max-width: 78%; }
.unitEmpty { font-size: clamp(18px, 1.5vw, 28px); color: var(--dim); }
.unitNext { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; }
.wall { display: grid; gap: clamp(4px, .5vw, 8px); overflow-x: auto; }
.wallHead, .wallRow { display: grid; grid-template-columns: clamp(92px, 9vw, 170px) repeat(3, minmax(170px, 1fr)); gap: clamp(4px, .5vw, 8px); }
.wallHead b { font: 800 clamp(16px, 1.45vw, 28px) var(--display); padding-inline: 6px; }
.wallRow h2 { background: var(--plum-2); border-left: 6px solid var(--c); border-radius: 8px; padding: 8px; font-size: clamp(15px, 1.25vw, 24px); }
.wallRow h2 small { display: block; font: 500 clamp(11px, .78vw, 15px)/1.2 var(--body); color: var(--dim); letter-spacing: 0; margin-top: 3px; }
.wallCell { display: flex; flex-wrap: wrap; gap: 3px; align-content: stretch; background: #FFFFFF0A; border-radius: 8px; padding: 3px; }
.wallChip { flex: 1 1 clamp(82px, 7vw, 130px); border: 0; border-radius: 6px; color: #fff; padding: 5px 7px; text-align: left; font: 600 clamp(12px, .92vw, 17px)/1.12 var(--body); min-height: 40px; }
.wallChip small { display: block; color: var(--yellow); font-weight: 800; }
.book { display: grid; grid-template-columns: clamp(130px, 15vw, 280px) minmax(0, 1fr); gap: clamp(10px, 1.6vw, 30px); align-items: start; }
.bookNav { display: grid; gap: 3px; position: sticky; top: 12px; }
.bookNav button { display: flex; align-items: center; gap: 10px; border: 0; background: none; color: var(--fg); text-align: left; padding: .55em .7em; border-radius: 10px; font: 700 clamp(15px, 1.3vw, 25px) var(--body); min-height: 46px; }
.bookNav i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.bookNav [aria-current="page"] { background: var(--plum-2); }
.bookPage { background: var(--paper); color: var(--plum); border-radius: 6px; padding: clamp(20px, 3.6vw, 70px); display: grid; gap: clamp(10px, 1.2vw, 22px); min-width: 0; }
.bookKicker { color: #575166; font-size: clamp(14px, 1vw, 20px); }
.bookPage h1 { font: 400 clamp(38px, 5vw, 94px)/1 var(--serif); letter-spacing: 0; }
.bookLead { font-size: clamp(15px, 1.15vw, 22px); color: #575166; }
.bookPage h2 { font: 400 clamp(22px, 2vw, 38px) var(--serif); letter-spacing: 0; border-bottom: 2px solid var(--plum); padding-bottom: 4px; margin-top: 8px; }
.toc { margin: 0; padding: 0; list-style: none; }
.toc > li > button { display: flex; width: 100%; align-items: baseline; gap: 8px; border: 0; background: none; color: inherit; text-align: left; padding: .42em 0; font: 500 clamp(16px, 1.3vw, 25px)/1.2 var(--body); min-height: 40px; }
.toc > li > button i { flex: 1; border-bottom: 2px dotted #17131F55; min-width: 16px; }
.toc > li > button span:last-child { color: #575166; font-size: .82em; white-space: nowrap; }
.toc > li.isNow > button { font-weight: 800; }
.tocLessons { margin: 2px 0 12px; padding: 12px clamp(10px, 1.3vw, 24px); background: #FFC40033; border-left: 6px solid var(--yellow); list-style: none; display: grid; gap: 8px; }
.tocLessons li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; font-size: clamp(15px, 1.1vw, 21px); }
.tocLessons small { grid-column: 1; color: #575166; }
.tocLessons .tvBtn, .tocLessons em { grid-column: 2; grid-row: 1 / 3; font-size: clamp(14px, 1vw, 20px); font-style: normal; min-height: 40px; }
.tocLessons em { color: #575166; }
.tocLessons li.here b::after { content: ' (you are here)'; font-weight: 500; }
@media (max-width: 700px) { .book { grid-template-columns: minmax(0, 1fr); } .bookNav { position: static; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); } .progNow { grid-template-columns: 76px minmax(0, 1fr); padding-right: 12px; } .progNow .tvBtn { grid-column: 2; justify-self: start; margin-bottom: 12px; } }

.unitPoster .pArt.unitArt { opacity: 1; height: 62%; width: auto; top: 6%; right: 6%; filter: drop-shadow(0 8px 10px #0005); }

/* Questions: shared by quizzes and exams */
body { --q-card: #262033; --q-line: #4A4358; --q-ink: var(--fg); --q-soft: var(--dim); --q-accent: var(--yellow); --q-accent-fg: var(--plum); --q-good: #7BE0C3; --q-bad: #FFB4A2; --q-good-bg: #17634A; --q-bad-bg: #6E2A2A; }

/* Skeleton */

.skel .o { fill: none; stroke: var(--bone-line); stroke-linecap: round; stroke-linejoin: round; }
.skel .b { fill: none; stroke: var(--bone); stroke-linecap: round; stroke-linejoin: round; transition: stroke .2s; }

body:has(.kidApp) #themeMode { display: none; }
.kidGear { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 30; width: 48px; height: 48px; display: grid; place-items: center; padding: 0; background: var(--panel); color: var(--tx); border: 1px solid var(--line); border-radius: 50%; cursor: pointer; box-shadow: 0 2px 8px #0003; } .kidGear svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Lesson controls. Nothing shows while a lesson plays, except captions. Any movement or remote press brings them up, and they hide again. */

#hud { position: absolute; inset: 0; z-index: 25; pointer-events: none; color: #fff; font-family: var(--body); --hud: clamp(44px, 3.4vw, 72px); }

.hudBottom { bottom: 0; display: grid; gap: clamp(8px, .8vw, 14px); padding: clamp(50px, 6vw, 110px) clamp(16px, 4vw, 80px) clamp(14px, 2.4vw, 46px); background: linear-gradient(#0000, #000D 62%); transform: translateY(14px); }

#chapterDrawer b { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; height: calc(2 * 1.15em); margin: 8px 10px 0; font-size: clamp(13px, 1.05vw, 20px); line-height: 1.15; }

#player.paused #stage { filter: brightness(.62); transition: filter .2s; }

/* Word help: the Spanish for a key word, in the top corner while it's said. */
#wordHelp { position: absolute; right: 56px; top: 56px; z-index: 6; display: grid; gap: 14px; justify-items: end; pointer-events: none; }

.whList { display: grid; gap: 10px; }

.whList ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, max-content); gap: 4px 30px; }

.handoff.withWords .sub { font-size: 34px; }

.whList button.on { background: var(--yellow); color: #17131F; }
.whList button.on span { color: #3A3445; }
.whList li b { font-weight: 800; }
.whList li span { color: var(--dim); font-size: 18px; }
#caption { transition: bottom .22s; }
.type-chapter .col { transition: translate .22s; }
#player.drawer #caption { visibility: hidden; }
@media (max-width: 600px) { .hudBtn.wide span { display: none; } .hudBtn.wide { width: var(--hud); padding: 0; justify-content: center; } }

/* Test */
#testBox { position: absolute; inset: 0; background: var(--plum); z-index: 6; padding: 96px; color: var(--fg); }

.testMain.hasPins { grid-template-columns: 1fr 560px; align-items: start; }
.testOpts { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.testOpt { display: flex; align-items: center; gap: 26px; background: var(--plum-2); border: 4px solid transparent; border-radius: 22px; padding: 26px 30px; font: 700 46px var(--body); text-align: left; color: var(--fg); }
.testOpt b { display: grid; place-items: center; width: 74px; height: 74px; border-radius: 50%; background: var(--fg); color: var(--plum); font: 800 44px var(--display); flex: none; }

.pinWrap { position: relative; height: 780px; margin-top: -40px; }

.pin.right { background: var(--good); } .pin.wrong { background: var(--bad); }
.why { margin-block: 30px; padding: 20px 28px; border-radius: 16px; font: 600 42px/1.2 var(--body); }
.why.ok { background: #17634A; } .why.no { background: #6E2A2A; }
.resultGrid { display: grid; grid-template-columns: 1fr 760px; gap: 50px; height: 100%; align-items: center; }
.reviewList { display: grid; gap: 8px; }
.reviewList p { padding: 10px 18px; border-radius: 12px; font-size: 26px; line-height: 1.2; }
.reviewList .ok { background: #17634A; } .reviewList .no { background: #6E2A2A; }
.reviewList b { margin-right: 8px; }
.bit { position: absolute; left: 0; top: 0; width: 22px; height: 12px; display: block; }
@media (max-width: 600px) { .heroImg { width: 100%; opacity: .4; -webkit-mask-image: none; mask-image: none; } }
@media (prefers-reduced-motion: reduce) { .photoPoster, .artPoster { transition: none; } }
/* The diary, the timetable and the program document: paper pages inside the channel. */
body[data-surface="diary"], body[data-surface="doc"] { background: #2B2733; color: #1E1B26; }

/* ---------- Diary: fits one screen ---------- */
.diary { --ink: #1E1B26; --mute: #5C5766; --rule: #D8D2C4; --paper: #FDFBF4; --hi: #FFF3C4; --fs: clamp(14px, 1.72vh, 24px); --fsS: clamp(12.5px, 1.45vh, 20px); height: 100dvh; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: clamp(6px, 1vh, 12px); padding: clamp(8px, 1.2vh, 16px) max(clamp(10px, 1.2vw, 24px), env(safe-area-inset-right, 0px)) clamp(10px, 1.4vh, 20px) max(clamp(10px, 1.2vw, 24px), env(safe-area-inset-left, 0px)); box-sizing: border-box; font-family: var(--body); color: var(--ink); }
.diary:not(.tt) { grid-template-rows: auto minmax(0, 1fr); }
.diaryTop { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; color: #fff; min-width: 0; }
.diaryTop button { min-height: 40px; padding: 4px 14px; background: #FFFFFF1A; color: #fff; border: 0; border-radius: 8px; font: 700 var(--fs) var(--body); }
.diaryTop button:hover { background: #FFFFFF33; }
.diaryTop button:focus-visible, .dStrip button:focus-visible { outline: 3px solid #FFD64D; outline-offset: 1px; }
.diaryName { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.diaryName .kidFace { align-self: center; }
.diaryName h1 { margin: 0; font: 400 clamp(21px, 3vh, 38px)/1.05 var(--serif); white-space: nowrap; }
.diaryName small { font-size: var(--fsS); opacity: .8; white-space: nowrap; }
.dKids { display: flex; gap: 4px; }
.dKids [aria-pressed="true"], .dStrip [aria-pressed="true"] { background: #fff !important; color: var(--ink) !important; }
.dWeekNav { display: flex; align-items: center; gap: 6px; margin-inline: auto; }
.dWeekNav b { font-size: var(--fs); min-width: 13em; text-align: center; white-space: nowrap; }
.dWeekNav [data-week="-1"], .dWeekNav [data-week="1"] { width: 44px; min-height: 44px; padding: 0; font-size: 24px; line-height: 1; }
.dLinks { display: flex; gap: 6px; }
.dStrip { display: none; }
.spread { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px; min-height: 0; }
.dPage { display: grid; grid-template-rows: auto repeat(3, minmax(0, 1fr)); gap: clamp(3px, .5vh, 6px); background: var(--paper); padding: clamp(5px, .8vh, 10px) clamp(8px, .9vw, 16px); min-height: 0; min-width: 0; box-shadow: 0 8px 22px #0006; }
.dPage:first-child { border-radius: 10px 2px 2px 10px; background-image: linear-gradient(270deg, #0000001A 0, #0000 22px); background-color: var(--paper); }
.dPage:last-child { border-radius: 2px 10px 10px 2px; background-image: linear-gradient(90deg, #0000001A 0, #0000 22px); background-color: var(--paper); }
.dHead, .dRow { display: grid; grid-template-columns: 1.65em minmax(0, 1fr) minmax(0, 32%) 2.5em; gap: clamp(5px, .6vw, 10px); align-items: center; }
.dHead { font-size: var(--fsS); font-weight: 700; color: var(--mute); padding-inline: 4px; }
.dHead span:last-child { text-align: center; }
.dDay { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; border-top: 2px solid var(--ink); }
.dDay header { display: flex; align-items: baseline; gap: 8px; padding: 1px 4px; min-height: 1.6em; }
.dDay h2 { margin: 0; font: 400 clamp(16px, 2.1vh, 28px)/1.2 var(--serif); }
.dDay header span { font-size: var(--fsS); color: var(--mute); }
.dToday { font-style: normal; font-size: var(--fsS); font-weight: 700; background: var(--ink); color: #fff; padding: 0 8px; border-radius: 99px; align-self: center; }
.dOffBtn { margin-left: auto; background: none; border: 0; padding: 0 4px; font: 600 var(--fsS) var(--body); color: var(--mute); text-decoration: underline; min-height: 44px; padding-inline: 8px; }
.dDay.isToday { background: var(--hi); }
.dRows { display: grid; grid-auto-rows: minmax(0, 1fr); min-height: 0; }
.dRow { width: 100%; min-height: 0; padding: 0 4px; background: none; border: 0; border-top: 1px solid var(--rule); color: var(--ink); text-align: left; font: inherit; overflow: hidden; }
.dRow:hover { background: #0000000F; }
.dRow:focus-visible { outline: 3px solid #1D4ED8; outline-offset: -3px; }
.dNo { display: grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 5px; color: #fff; font-size: var(--fsS); font-weight: 700; }
.dMain { display: grid; min-width: 0; line-height: 1.16; }
.dMain b { font-size: var(--fs); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dMain small { font-size: var(--fsS); color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dExam { font-style: normal; font-weight: 700; color: #B91C1C; }
.dHw { font-size: var(--fsS); line-height: 1.15; color: var(--ink); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.dMark { justify-self: center; display: grid; place-items: center; width: 1.9em; height: 1.9em; font-size: var(--fs); font-weight: 700; color: #0F766E; }
.dMark.has { font-family: var(--serif); font-weight: 400; color: #B91C1C; border: 2px solid #B91C1C; border-radius: 50%; }
.dRow.missing .dMain b { color: var(--mute); }
.dRow.late .dHw { color: #B91C1C; font-weight: 700; }
.dRow.catch:not(.late) .dHw { color: var(--mute); }
.dRow.now .dHw { font-weight: 700; }
.dOff { margin: 0; padding: 12px 4px; font-size: var(--fs); color: var(--mute); }
.dWeekBody { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 12px; padding: 4px; min-height: 0; overflow: hidden; }
.dFacts { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; align-content: start; font-size: var(--fsS); }
.dFacts b { font-family: var(--serif); font-weight: 400; font-size: var(--fs); }
.dSign { display: grid; gap: 4px; align-content: start; min-height: 0; font-size: var(--fsS); }
.dSign label { font-weight: 700; }
.dSign textarea { width: 100%; box-sizing: border-box; resize: vertical; border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; background: #fff; font: var(--fsS) var(--body); font-size: max(16px, var(--fsS)); color: var(--ink); }
.dNoteText { margin: 0; color: var(--mute); }
.dSigned { margin: 0; font-weight: 700; color: #0F766E; }
.dUnsigned { margin: 0; color: var(--mute); }
.dBtn { min-height: 44px; padding: 6px 16px; background: var(--ink, #1E1B26); color: #fff; border: 2px solid var(--ink, #1E1B26); border-radius: 8px; font: 700 15px var(--body); }
.dBtn.ghost { background: none; color: var(--ink, #1E1B26); }
.dBtn:focus-visible { outline: 3px solid #1D4ED8; outline-offset: 2px; }
.dSign .dBtn { justify-self: start; min-height: 44px; padding-block: 2px; font-size: var(--fsS); }

/* One class, opened */
#dSheet { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: #000A; }
.dSheetBox { --ink: #1E1B26; width: min(100%, 560px); max-height: 100%; overflow: auto; box-sizing: border-box; background: #FDFBF4; color: var(--ink); border-radius: 12px; padding-bottom: 18px; font-family: var(--body); }
.dSheetBox header { background: var(--c); color: #fff; padding: 14px 20px; border-radius: 12px 12px 0 0; }
.dSheetBox header small { font-size: 15px; }
.dSheetBox h2 { margin: 0; font: 400 30px/1.1 var(--serif); }
.dSheetBox p { margin: 8px 20px 0; font-size: 16px; line-height: 1.35; }
.dSheetBox .dSheetTitle { font-size: 21px; font-weight: 700; line-height: 1.2; margin-top: 14px; }
.dSheetWhere, .dSheetNote { color: #5C5766; }
.dSheetBtns { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 20px 0; }
.dEdit { display: grid; grid-template-columns: minmax(0, 1fr) 72px; gap: 8px; margin: 16px 20px 0; padding-top: 14px; border-top: 1px solid #D8D2C4; font-size: 14px; font-weight: 700; }
.dEdit label { display: grid; gap: 3px; }
.dEdit input:not([type=checkbox]) { min-height: 40px; box-sizing: border-box; width: 100%; padding: 4px 8px; border: 1px solid #BDB6A8; border-radius: 6px; font: 16px var(--body); background: #fff; color: #1E1B26; }
.dEdit .dCheck { display: flex; align-items: center; gap: 8px; }
.dEdit .dBtn { justify-self: end; }

/* ---------- Timetable: fits one screen ---------- */
.diary.tt { grid-template-rows: auto minmax(0, 1fr); }
.ttBody { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(300px, 1fr); gap: 10px; min-height: 0; }
.ttGrid, .ttSide > section { background: var(--paper); border-radius: 10px; }
.ttGrid { padding: 10px 12px; min-height: 0; }
.ttDays { display: none; }
.ttDayCard { display: grid; gap: 8px; padding: 12px; background: #fff; border: 1px solid var(--rule, #D8D2C4); border-radius: 10px; }
.ttDayCard h3 { margin: 0; font-size: 18px; }
.ttDayCard label { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 10px; padding-left: 8px; border-left: 5px solid var(--c); }
.ttDayCard label span { display: grid; font-weight: 700; font-size: 15px; }
.ttDayCard label small { font-weight: 500; color: var(--mute, #5C5766); }
.ttDayCard select { min-height: 44px; font-size: 16px; padding: 6px 8px; border: 1px solid #BDB6A8; border-radius: 8px; background: #fff; color: var(--ink, #1E1B26); min-width: 0; width: 100%; }
.ttGrid table { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; font-size: var(--fs); }
.ttGrid thead th { font: 400 var(--fs) var(--serif); padding: 2px 4px 6px; text-align: left; }
.ttGrid thead th:first-child, .ttGrid tbody th { width: 3.6em; }
.ttGrid tbody th { text-align: left; font-weight: 700; border-top: 1px solid var(--rule); padding-right: 6px; }
.ttGrid tbody th small { display: block; font-weight: 400; font-size: var(--fsS); color: var(--mute); }
.ttGrid td { border-top: 1px solid var(--rule); padding: 3px; }
.ttGrid select { width: 100%; height: 100%; min-height: 44px; box-sizing: border-box; padding: 2px 6px; background: var(--c, #fff); color: #fff; border: 1px solid #0000; border-radius: 7px; font: 700 var(--fs) var(--body); }
.ttGrid td[style*="transparent"] select { background: #fff; color: var(--mute); border-color: var(--rule); font-weight: 500; }
.ttGrid select option { color: #1E1B26; background: #fff; }
.ttGrid select:focus-visible { outline: 3px solid #1D4ED8; outline-offset: 1px; }
.ttSide { display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 8px; min-height: 0; }
.ttSide > section { padding: 8px 12px; min-height: 0; overflow: auto; font-size: var(--fsS); }
.ttSide h2 { margin: 0; font: 400 clamp(16px, 2vh, 26px)/1.2 var(--serif); }
.ttSide p { margin: 0 0 4px; color: var(--mute); }
.ttLoad { width: 100%; border-collapse: collapse; }
.ttLoad th, .ttLoad td { text-align: left; padding: 1px 4px; font-weight: 500; }
.ttLoad thead th { color: var(--mute); }
.ttLoad tbody th { font-weight: 700; white-space: nowrap; }
.ttLoad tbody th i { display: inline-block; width: .7em; height: .7em; border-radius: 2px; margin-right: 6px; }
.ttLoad .short td:last-child { color: #B91C1C; font-weight: 700; }
.ttSet { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 10px; }
.ttSet h2 { grid-column: 1 / -1; }
.ttSet label { display: grid; gap: 1px; font-weight: 700; }
.ttSet input, .ttSet select, .ttAdd input { box-sizing: border-box; width: 100%; min-height: 44px; padding: 4px 8px; border: 1px solid #BDB6A8; border-radius: 6px; font: var(--fsS) var(--body); font-size: max(16px, var(--fsS)); background: #fff; color: var(--ink); }
.ttBreaks { list-style: none; margin: 2px 0 6px; padding: 0; }
.ttBreaks li { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--rule); padding: 1px 0; }
.ttBreaks small { color: var(--mute); margin-left: 8px; }
.ttBreaks button { background: none; border: 0; padding: 0 8px; color: var(--mute); text-decoration: underline; font: var(--fsS) var(--body); min-height: 44px; }

/* ---------- Program document ---------- */
.docWrap { font-family: var(--body); color: #1E1B26; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 40px max(12px, env(safe-area-inset-left, 0px)); }

.doc { display: grid; gap: 14px; max-width: 1760px; margin-inline: auto; }

.pUnit.now { background: #FFE27A; font-weight: 700; }
.docKey { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 8px 0 0; font-size: 13.5px; color: #4A4552; }
.docKey span { display: inline-flex; align-items: center; gap: 6px; }
.docKey i { width: 14px; height: 14px; border-radius: 3px; } .kNow { background: #FFE27A; } .kReady { background: #DDF3E4; }

.docSources { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 8px 0 0; font-size: 14.5px; }

.pTableWrap { overflow-x: auto; }

/* ---------- Small screens: one day, one column ---------- */
@media (max-width: 899px), (max-height: 519px) {
  .diary, .diary:not(.tt) { height: auto; min-height: 100dvh; grid-template-rows: auto auto minmax(0, 1fr); }

  .dWeekNav { order: 5; width: 100%; justify-content: space-between; margin: 0; }
  .dWeekNav b { min-width: 0; font-size: 15px; }
  .dThis { display: none; }
  .dLinks { margin-left: auto; }
  .dKids { order: 4; width: 100%; }
  .dKids button { flex: 1; }
  .dStrip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .dStrip button { display: grid; justify-items: center; min-height: 54px; padding: 2px; background: #FFFFFF1A; color: #fff; border: 0; border-radius: 8px; font-family: var(--body); }
  .dStrip small { font-size: 13px; } .dStrip b { font-size: 19px; }
  .dStrip .isToday:not([aria-pressed="true"]) { box-shadow: inset 0 0 0 2px #FFD64D; }
  .spread { display: block; }
  .dPage { display: contents; }
  .dHead { display: none; }
  .dDay { display: none; background: var(--paper); border-radius: 10px; border-top: 0; padding: 8px 10px; }
  .dDay.sel, .dWeek { display: block; }
  .dWeek { margin-top: 8px; }
  .dRow { grid-template-columns: 1.7em minmax(0, 1fr) 2.6em; grid-template-areas: 'no main mark' 'no hw mark'; min-height: 62px; padding: 8px 2px; }
  .dNo { grid-area: no; } .dMain { grid-area: main; } .dHw { grid-area: hw; } .dMark { grid-area: mark; }
  .dHw:empty { display: none; }
  .dMain b { font-size: 17px; } .dMain small, .dHw { font-size: 14.5px; white-space: normal; }
  .dMain small { white-space: normal; }
  .dWeekBody { grid-template-columns: minmax(0, 1fr); }
  /* On a child's phone, the week's facts sit beside the note, and anything longer scrolls inside the diary, above the tabs. */
  body[data-surface="school"] .kidMain .dWeekBody { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
  body[data-surface="school"] .kidMain .diary { height: 100%; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .diary.tt { height: auto; }
  .ttBody { grid-template-columns: minmax(0, 1fr); }
  /* On a phone or an upright iPad, the week is one card per day instead of a wide grid. */
  .ttGrid table { display: none; }
  .ttDays { display: grid; gap: 12px; }
  .ttAdd { grid-template-columns: minmax(0, 1fr) !important; }
  .docHead { grid-template-columns: minmax(0, 1fr); }
  .docHead dl { grid-template-columns: minmax(0, 1fr); }
  .docBarGap { display: none; }
  .pMap { min-width: 0; }
  .pMap thead { display: none; }
  .pMap, .pMap tbody, .pMap tr, .pMap td, .pMap th { display: block; width: auto; border-left: 0; }
  .pMap tbody { display: grid; gap: 4px; }
  .pMap tbody th { padding-top: 10px; font-size: 19px; border-bottom: 2px solid #1E1B26; }
  .pMap td { border-bottom: 0; padding-block: 0; }
  .pUnit { min-height: 40px; font-size: 15px; align-items: center; }
}
@media print {
  @page { size: A4 landscape; margin: 10mm; }
  body[data-surface="doc"] { background: #fff; }
  .docBar { display: none; }
  .docWrap { padding: 0; }
  .docSheet { box-shadow: none; padding: 0; break-after: page; }
  .pSubject { break-inside: auto; }
  .pTable tr { break-inside: avoid; }
  .pUnit { font-size: 9.5pt; min-height: 0; padding: 1px 3px; }
  .pUnit, .pMap thead button, .pLesson { color: #000; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .docKey i, .pUnit.ready, .pUnit.now { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #screensPill, #screensNote { display: none !important; }
}
@media (prefers-reduced-motion: reduce) { .docBar, html { scroll-behavior: auto; } }
/* ---------- Pages to print (#print): sheets of A4 on screen, black ink on white when printed ---------- */
body[data-surface="print"] { background: #DCDAE2; color: #111; color-scheme: light; }
body[data-surface="print"] .cabinet.fit .cabMain { height: auto; min-height: 0; }
.prWrap { font-family: var(--body); color: #111; min-height: 100%; }
.prBar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px max(12px, 2vw); background: #2B2733; color: #fff; }
.prBar button { min-height: 44px; padding: 4px 16px; background: #FFFFFF1F; color: #fff; border: 0; border-radius: 8px; font: 700 16px var(--body); }
.prBar button:hover { background: #FFFFFF38; }
.prBar button:focus-visible, .prCheck input:focus-visible { outline: 3px solid #FFD64D; outline-offset: 2px; }
.prBar .prGo { background: #fff; color: #17131F; }
.prBar .prBack { background: none; padding-inline: 4px; text-decoration: underline; text-underline-offset: 4px; }

.prBarGap { flex: 1; }

.prSeg { display: inline-flex; gap: 2px; padding: 2px; background: #FFFFFF14; border-radius: 10px; }
.prSeg button[aria-pressed="true"] { background: #fff; color: #17131F; }
.prCheck { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding-inline: 8px; font: 600 16px var(--body); cursor: pointer; }
.prCheck input { width: 22px; height: 22px; accent-color: #fff; }
.prDoc { display: grid; gap: 28px; justify-items: center; padding: 28px max(10px, 2vw) 60px; }
.prSheet { box-sizing: border-box; width: min(100%, 210mm); min-height: min(297mm, 140vw); padding: clamp(18px, 5.5vw, 15mm); background: #fff; color: #111; box-shadow: 0 2px 4px #0002, 0 12px 32px #0003; font-size: 19px; line-height: 1.4; }
.prSheet h1, .prSheet h2, .prSheet h3 { color: #111; text-wrap: balance; }

/* The top of every sheet: what it is on the left, the child's boxes on the right */
.prHead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px 28px; padding-bottom: 14px; margin-bottom: 8px; border-bottom: 3px solid #111; }
.prTitle { flex: 1 1 300px; min-width: 0; }
.prTitle p { margin: 0 0 4px; font-weight: 700; font-size: 16px; }

.prFill { display: grid; gap: 8px; margin: 0; flex: 0 1 240px; }
.prFill div { display: grid; grid-template-columns: 4.2em 1fr; align-items: end; gap: 8px; }
.prFill dt { font-weight: 700; font-size: 16px; }
.prFill dd { margin: 0; min-height: 30px; border-bottom: 2px solid #111; text-align: right; }
.prFill dd span { font-size: 15px; color: #333; }

/* Questions */
.prSection { break-after: avoid; margin: 26px 0 0; padding: 6px 0; font: 800 21px var(--display); border-bottom: 1.5px solid #111; }
.prQ { padding: 22px 0 0 46px; break-inside: avoid; }

.prQ > header b { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #111; color: #fff; font-size: 17px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.prQ h3 { margin: 4px 0 0; font: 700 19px/1.35 var(--body); letter-spacing: 0; }
.prQ > header em { color: #111; font-style: normal; font-size: 15px; font-weight: 700; white-space: nowrap; padding: 3px 8px; border: 1.5px solid #111; border-radius: 6px; margin-top: 3px; }

.prFig.wide { aspect-ratio: 432 / 645; height: 480px; }

/* The answer page starts on a page of its own, so a parent can keep it */

.rmap g > *:hover, .rmap g > *:focus-visible { stroke: #101426; stroke-width: 12; }
.rmap g.on > * { stroke: #101426; stroke-width: 18; }
.rmap g.right > * { fill: #15803D; stroke: #101426; stroke-width: 10; } .rmap g.wrong > * { fill: #C81E1E; stroke: #101426; stroke-width: 10; }
.rmap text { font: 800 60px Arial, sans-serif; fill: #101426; stroke: #fff; stroke-width: 12px; paint-order: stroke; pointer-events: none; }
.qEstimate { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; align-items: stretch; max-width: 620px; }
.qEstimate input { writing-mode: vertical-lr; direction: rtl; width: 56px; height: 320px; justify-self: center; accent-color: var(--q-accent); }
.qMountain { position: relative; height: 320px; border-radius: 10px; overflow: hidden; background: linear-gradient(#BFE6FF, #EAF7FF); }
.qMountain svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.qMark { position: absolute; left: 0; right: 0; height: 0; border-top: 3px dashed #101426; }
.qMark b { position: absolute; right: 8px; top: -34px; background: #101426; color: #fff; padding: 2px 10px; border-radius: 5px; font-size: 17px; line-height: 1.5; font-variant-numeric: tabular-nums; white-space: nowrap; }
.qMark.truth { border-color: #0E7A50; } .qMark.truth b { background: #0E7A50; right: auto; left: 8px; top: 6px; }
.qOrder li > i { align-self: stretch; width: 12px; margin-block: -8px; margin-left: -12px; flex: none; border-radius: 8px 0 0 8px; }
.sortBank:empty { display: none; }
.sortBank { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; }
.sortChip { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 6px 13px; background: var(--q-card); color: var(--q-ink); border: 2px solid var(--q-line); border-radius: 10px; font: inherit; font-weight: 700; cursor: grab; }
.sortChip img { width: 40px; height: 40px; object-fit: cover; border-radius: 5px; }
.sortChip.picked { outline: 4px solid var(--q-accent); outline-offset: 2px; }
.sortChip.right { background: var(--q-good); color: #fff; border-color: var(--q-good); } .sortChip.wrong { background: var(--q-bad); color: #fff; border-color: var(--q-bad); }
.sortBins { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.sortBin { min-height: 130px; display: grid; gap: 8px; align-content: start; padding: 10px; background: transparent; color: var(--q-ink); border: 3px dashed var(--q-line); border-radius: 10px; text-align: left; font: inherit; }
.sortBin > b { font-size: 18px; font-weight: 800; }
.sortBin.over, .sortBin:hover { border-color: var(--q-accent); }
.sortIn { display: flex; flex-wrap: wrap; gap: 6px; }
.qGap { display: inline-block; min-width: 110px; min-height: 44px; padding: 3px 12px; margin: 3px; vertical-align: middle; background: var(--q-card); color: var(--q-ink); border: 2px dashed var(--q-line); border-radius: 8px; font: inherit; font-weight: 700; }
.qGap.filled { border-style: solid; border-color: var(--q-accent); }
.qGap.right { background: var(--q-good); color: #fff; border-color: var(--q-good); } .qGap.wrong { background: var(--q-bad); color: #fff; border-color: var(--q-bad); }
.qPics { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; }
.qPics button { padding: 0; overflow: hidden; background: var(--q-card); color: var(--q-ink); border: 3px solid var(--q-line); border-radius: 10px; font: inherit; font-weight: 700; }
.qPics img { display: block; width: 100%; height: 150px; object-fit: cover; }
.qPics span { display: block; padding: 7px; }
.qPics .on { border-color: var(--q-accent); outline: 3px solid var(--q-accent); }
.qPics .right { background: var(--q-good); color: #fff; border-color: var(--q-good); } .qPics .wrong { background: var(--q-bad); color: #fff; border-color: var(--q-bad); }
.matchItem.hasImg { display: flex; align-items: center; gap: 10px; padding: 0 12px 0 0; overflow: hidden; text-align: left; }
.matchItem.hasImg img { width: 92px; height: 66px; object-fit: cover; flex: none; }
.qMuscle svg { display: block; width: 100%; max-width: 620px; height: auto; margin-inline: auto; }
.qMuscleAsk[hidden] { display: none; }
@media (max-width: 600px) { .matchItem.hasImg img { width: 56px; } .qMatch { gap: 30px; } }

/* ---------- How it works: a brochure. One idea per page, sized like a slide so it fits one screen and prints as a PDF ---------- */
.promo { display: grid; gap: 16px; justify-items: center; }
.promo .docBar { width: 100%; }
.pp { --h: 5.4cqw; --h3: 1.9cqw; --b: 1.6cqw; --s: 1.2cqw; --pad: 4cqw; container-type: inline-size; position: relative; width: min(100%, calc((100dvh - 72px) * 16 / 9)); aspect-ratio: 16 / 9; overflow: hidden; box-sizing: border-box; font-family: var(--body); box-shadow: 0 10px 30px #0008; }
.pp > * { box-sizing: border-box; }
.pp h1, .pp h2 { margin: 0; font: 800 var(--h)/1.02 var(--display); letter-spacing: -.02em; text-wrap: balance; }
.pp h3 { margin: 0; font: 800 var(--h3)/1.1 var(--display); }
.pp p { margin: 0; font-size: var(--b); line-height: 1.32; }
.pp figure { margin: 0; }
.pp img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.ppLead { font-size: calc(var(--b) * 1.2) !important; font-weight: 600; }
.pp .ppSmall { font-size: var(--s); opacity: .85; }
.ppPage { position: absolute; left: var(--pad); right: var(--pad); bottom: 1.3cqw; display: flex; justify-content: space-between; font-size: var(--s); font-weight: 600; opacity: .7; }
.ppList { list-style: none; margin: 0; padding: 0; display: grid; gap: 1cqw; font-size: var(--b); line-height: 1.28; }
.ppList li { padding-left: 1.5cqw; border-left: .35cqw solid currentColor; }
.ppList b { font-weight: 800; }
/* Device frames */
.fTv > div { aspect-ratio: 16 / 9; overflow: hidden; background: #000; border: .5cqw solid #0B090F; border-radius: .7cqw; box-shadow: 0 1.2cqw 3cqw #0007; }
.fLap > div { aspect-ratio: 16 / 10; overflow: hidden; background: #fff; border: .45cqw solid #17131F; border-bottom-width: .9cqw; border-radius: .8cqw; box-shadow: 0 1cqw 2.6cqw #0005; }
.fPad > div { aspect-ratio: 1180 / 820; overflow: hidden; background: #000; border: .7cqw solid #17131F; border-radius: 1.4cqw; box-shadow: 0 1.2cqw 3cqw #0007; }
.fPhone > div { aspect-ratio: 1 / 2; overflow: hidden; background: #000; border: .55cqw solid #0B090F; border-radius: 1.8cqw; box-shadow: 0 1.2cqw 3cqw #0008; }
/* 1. Cover */
.ppCover { display: grid; grid-template-columns: 41% 1fr; align-items: center; gap: 2cqw; padding: var(--pad); background: #D42A20; color: #fff; --h: 8cqw; }
.ppCoverText { display: grid; gap: 2cqw; }
.ppBrand { font: 800 2.2cqw var(--display) !important; }
.ppBrand i { font-style: normal; background: #fff; color: #D42A20; padding: 0 .6cqw; border-radius: .4cqw; }
.ppCoverArt { position: relative; height: 100%; }
.ppCoverArt .fTv { position: absolute; left: 0; right: 4%; top: 13%; }
.ppCoverArt .fPhone { position: absolute; right: 0; bottom: -6%; width: 25%; }
/* 2. Three screens */
.ppThree { display: grid; grid-template-rows: auto 1fr; gap: 2.4cqw; padding: var(--pad); background: #FFC400; color: #17131F; }
.ppCols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2.6cqw; align-items: start; align-self: center; }
.ppCols > div { display: grid; gap: 1cqw; }
/* 3. One day */
.ppDay { display: grid; grid-template-rows: auto 1fr; gap: 2.2cqw; padding: var(--pad); background: #17131F; color: #FBFAFF; counter-reset: st; }
.ppSteps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.8cqw 2.4cqw; }
.ppSteps li { counter-increment: st; display: grid; gap: .5cqw; align-content: start; }
.ppSteps img { height: 12.2cqw; border-radius: .6cqw; object-position: left top; }
.ppSteps b { margin-top: .3cqw; font: 800 var(--h3)/1.1 var(--display); }
.ppSteps b::before { content: counter(st) ". "; color: #FFC400; }
.ppSteps p { font-size: calc(var(--s) * 1.1); opacity: .9; }
/* On a child's iPad */
.ppPad { display: grid; grid-template-columns: 58% 1fr; align-items: center; gap: 3cqw; padding: 3cqw var(--pad) 4cqw; background: #0F172A; color: #F8FAFC; --h: 4cqw; }
.ppPadText { display: grid; gap: 1.2cqw; }
.ppSections { list-style: none; margin: 0; padding: 0; display: grid; gap: .8cqw; counter-reset: s; font-size: calc(var(--b) * .96); line-height: 1.22; }
.ppSections li { counter-increment: s; display: grid; grid-template-columns: 2.2cqw 1fr; gap: .9cqw; } .ppSections li::before { content: counter(s); display: grid; place-items: center; width: 2.2cqw; height: 2.2cqw; background: #FFC400; color: #17131F; border-radius: 50%; font-weight: 800; font-size: var(--s); }
.ppSections b { font-weight: 800; }
.ppTabs { display: grid; grid-template-rows: auto 1fr; gap: 1.6cqw; padding: 3cqw var(--pad) 4cqw; background: #F1F5F9; color: #0F172A; --h: 4.2cqw; }
.ppTabGrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.6cqw; align-items: start; }
.ppTabGrid > div { display: grid; gap: .6cqw; } .ppTabGrid p { font-size: var(--s); }
.ppFinger { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: auto 1fr; gap: 1.8cqw 2cqw; padding: 3cqw var(--pad) 4cqw; background: #7C2D12; color: #FFF7ED; --h: 4.2cqw; }
.ppFinger > h2 { grid-column: 1 / -1; }
.ppFinger > div { display: grid; gap: .7cqw; align-content: start; } .ppFinger p { font-size: var(--s); }
/* 4. Lesson */
.ppLesson { display: grid; grid-template-columns: 61% 1fr; align-items: center; gap: 3cqw; padding: 3cqw var(--pad) 4cqw 3cqw; background: #0F766E; color: #fff; }
.ppSide { display: grid; align-content: center; gap: 1.8cqw; --h: 4.2cqw; }
/* 5. Tests */
.ppTests { display: grid; grid-template-rows: auto auto 1fr auto; gap: 1cqw; padding: 3cqw var(--pad) 4cqw; background: #F4F1E6; color: #17131F; }
.ppFour { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.6cqw; min-height: 0; margin-top: .8cqw; }
.ppFour figure { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: .7cqw; min-height: 0; }
.ppFour img { border-radius: .7cqw; box-shadow: 0 .5cqw 1.4cqw #0003; min-height: 0; object-position: left top; }
.ppFour figcaption { font-size: var(--b); font-weight: 700; line-height: 1.15; }
.ppFoot { padding-top: .4cqw; }
/* 6. Looks */
.ppLooks { display: grid; grid-template-columns: 38% 1fr; align-items: center; gap: 2cqw; padding: var(--pad); background: #7E22CE; color: #fff; --h: 5cqw; }
.ppLooksText { display: grid; gap: 1.8cqw; }
.ppFan { position: relative; height: 100%; }
.ppFan figure { position: absolute; width: 74%; aspect-ratio: 16 / 10; overflow: hidden; border-radius: .9cqw; box-shadow: 0 1cqw 3cqw #0007; }
.ppFan figure:nth-child(1) { left: 25%; top: 2%; transform: rotate(3deg); }
.ppFan figure:nth-child(2) { left: 13%; top: 24%; transform: rotate(-2deg); }
.ppFan figure:nth-child(3) { left: 0; top: 46%; transform: rotate(1deg); }
/* 7 to 9. Screen plus notes */
.ppDiary, .ppWeek, .ppProgram { display: grid; align-items: center; gap: 3cqw; padding: 3cqw var(--pad) 4cqw; --h: 4cqw; }
.ppDiary { grid-template-columns: 62% 1fr; background: #FDFBF4; color: #1E1B26; }
.ppWeek { grid-template-columns: 1fr 58%; background: #1D4ED8; color: #fff; }
.ppProgram { grid-template-columns: 1fr 58%; background: #4D7C0F; color: #fff; }
.ppNotes, .ppNums { display: grid; gap: 1.6cqw; }
.ppNums dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.4cqw; margin: 0; }
.ppNums dt { font: 800 5.4cqw/1 var(--display); }
.ppNums dd { margin: .2cqw 0 0; font-size: var(--s); line-height: 1.2; font-weight: 600; }
/* 10. In charge */
.ppCharge { display: grid; grid-template-rows: auto 1fr; gap: 1.6cqw; padding: 3cqw var(--pad) 4cqw; background: #FFF; color: #17131F; }
.ppSplit { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4cqw; padding-inline: 5cqw; min-height: 0; }
.ppSplit > div { display: grid; gap: .8cqw; align-content: start; min-height: 0; }
/* 11. Last */
.ppWords { background: #4C1D95; }
.ppFamily { grid-template-columns: 1fr 56%; background: #FDFBF4; color: #1E1B26; }
.ppComing { display: grid; grid-template-rows: auto auto; align-content: center; gap: 3.4cqw; padding: 3.4cqw var(--pad) 4cqw; background: #FFC400; color: #17131F; --h: 4.6cqw; }
.ppComingHead { display: grid; gap: 1cqw; }
.ppComingCols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3cqw; align-content: start; }
.ppComingCols > div { display: grid; gap: 1.4cqw; align-content: start; background: #FFF8DC; border-radius: 1cqw; padding: 2.2cqw; }
.ppLadder { display: grid; grid-template-rows: auto auto auto; align-content: center; gap: 3cqw; padding: 3.4cqw var(--pad) 4cqw; background: #17131F; color: #FBFAFF; --h: 4.6cqw; }
.ppRungs { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1.2cqw; align-items: stretch; counter-reset: rung; }
.ppRungs li { display: flex; flex-direction: column; gap: .8cqw; min-height: 26cqw; padding: 1.6cqw; border-radius: 1cqw; background: #262033; border-top: .5cqw solid #4A4358; }
.ppRungs li.key { background: #FBFAFF; color: #17131F; border-top-color: #D42A20; }
.ppRungs small { font-size: var(--s); font-weight: 700; opacity: .8; }
.ppRungs h3 { font-size: calc(var(--h3) * 1.05); }
.ppRungs p { font-size: calc(var(--b) * .95); }
.ppRungs span { margin-top: auto; font-size: var(--s); opacity: .8; }
.ppAssessCover { background: #1D4ED8; }
.ppAssessCover .ppCoverArt .fLap { position: absolute; left: 0; right: 4%; top: 15%; }
.ppExams { background: #FDFBF4; color: #1E1B26; }
.ppMarks { background: #0F766E; color: #fff; }
.ppRetests { background: #FFF3D6; color: #17131F; }
.ppLast { display: grid; grid-template-columns: 54% 1fr; gap: 4cqw; align-items: center; padding: var(--pad); background: #17131F; color: #FBFAFF; --h: 4.6cqw; }
.ppChecks { list-style: none; margin: 2cqw 0 0; padding: 0; display: grid; gap: 1cqw; font-size: calc(var(--b) * 1.1); font-weight: 600; }
.ppChecks li::before { content: "✓"; color: #5EDB9E; font-weight: 800; margin-right: 1cqw; }
.ppHonest { display: grid; gap: 1.2cqw; padding: 2.4cqw; background: #2C2440; border-radius: 1cqw; }
.ppBtns { display: flex; flex-wrap: wrap; gap: 1cqw; margin-top: .6cqw; }
.ppBtns .tvBtn { font-size: var(--b); min-height: 3.4cqw; padding: .4em 1em; }
@media (max-width: 820px), (max-height: 480px) {
  .pp { --h: 34px; --h3: 20px; --b: 17px; --s: 14px; --pad: 18px; width: 100%; aspect-ratio: auto; overflow: visible; padding: var(--pad) var(--pad) 44px !important; grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: none !important; gap: 16px !important; }
  .ppPage { left: var(--pad); right: var(--pad); bottom: 14px; }
  .ppList { gap: 10px; } .ppList li { padding-left: 10px; border-left-width: 3px; }
  .fTv > div, .fLap > div { border-width: 4px; border-radius: 8px; } .fPhone > div { border-width: 5px; border-radius: 18px; }
  .ppCover { --h: 44px; } .ppBrand { font-size: 20px !important; } .ppBrand i { padding-inline: 5px; border-radius: 4px; } .ppCoverText { gap: 12px; }
  .ppCoverArt { position: relative; height: auto; padding-bottom: 6%; } .ppCoverArt .fTv, .ppAssessCover .ppCoverArt .fLap { position: static; } .ppCoverArt .fPhone { display: none; }
  .ppCols, .ppFour, .ppSplit, .ppNums dl, .ppTabGrid, .ppFinger { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-inline: 0; }
  .ppSections { gap: 8px; } .ppSections li { grid-template-columns: 26px 1fr; gap: 8px; } .ppSections li::before { width: 26px; height: 26px; }
  .fPad > div { border-width: 5px; border-radius: 12px; }
  .ppNums dl { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ppNums dt { font-size: 38px; }
  .ppSteps { grid-template-columns: minmax(0, 1fr); gap: 16px; } .ppSteps li { gap: 6px; } .ppSteps img { height: auto; aspect-ratio: 16 / 10; border-radius: 6px; }
  .ppCols > div, .ppSplit > div, .ppFour figure { gap: 8px; }
  .ppSide { gap: 12px; --h: 30px; }
  .ppFour figure { display: block; } .ppFour img { height: auto; aspect-ratio: 16 / 10; border-radius: 8px; } .ppFour figcaption { margin-top: 6px; }
  .ppFan { display: grid; gap: 10px; height: auto; } .ppFan figure { position: static; width: 100%; transform: none !important; border-radius: 8px; }
  .ppLooksText, .ppNotes, .ppNums { gap: 12px; } .ppWeek .ppNotes, .ppProgram .ppNums { order: -1; }
  .ppChecks { margin-top: 12px; gap: 8px; } .ppChecks li::before { margin-right: 8px; } .ppHonest { padding: 16px; gap: 10px; border-radius: 10px; }
  .ppBtns { gap: 8px; } .ppBtns .tvBtn { min-height: 48px; }
}
@media print {
  .promo { display: block; }
  .pp { width: 100%; box-shadow: none; break-after: page; break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .ppBtns { display: none; }
}
