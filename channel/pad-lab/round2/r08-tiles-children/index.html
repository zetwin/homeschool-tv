<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big tiles per child</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Round 2, from 08 Big tiles. Keeps round 1's dark stage on purpose, so it can be compared with r07.
   Tests: if each child gets the biggest tile, with their own day inside it, does the parent still find
   Play on the TV fast enough in a small Now tile? */
:root{
  --page:#0E1322; --paper:#1D2539; --paperHi:#263049; --ink:#FFFFFF; --quiet:#BAC2D8; --line:rgba(255,255,255,.12);
  --violet:#4B2FC4; --violetDeep:#24166B; --act:#B9AEFF; --star:#FFFFFF;
  --amber:#F4B63F; --amberDeep:#241600;
  --late:#9B1C13; --lateBg:#FDE2E0; --amberBg:#FFE08A; --amberInk:#3D2800; --okBg:#DDF3E4; --okInk:#14622F;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:18px;-webkit-text-size-adjust:100%}
html[data-size="large"]{font-size:19.5px}
html[data-size="xl"]{font-size:21px}
body{font-family:Lexend,system-ui,sans-serif;color:var(--ink);line-height:1.25;height:100vh;overflow:hidden;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 520px at 22% -10%,rgba(75,47,196,.38),transparent 70%),var(--page)}
body.isAdmin{height:auto;min-height:100vh;overflow:auto}
button,a,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:3px solid #fff;outline-offset:4px;border-radius:14px}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- pad ---------- */
.pad{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) minmax(0,auto);gap:16px;padding:20px 28px 26px}
.top{display:flex;align-items:center;gap:16px;min-height:56px}
.top h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
.top .clock{font-size:1.6rem;font-weight:400;color:var(--quiet)}
.tools{margin-left:auto;display:flex;gap:10px}
.icon{min-height:52px;min-width:52px;padding:0 18px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.09);font-weight:600;text-decoration:none}

/* the main thing: one huge tile per child, with their own day inside */
.kids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;min-height:0}
.ktile{position:relative;overflow:hidden;border-radius:30px;background:var(--c);padding:22px 24px 22px;display:flex;flex-direction:column;gap:14px;min-height:0;cursor:pointer;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.ktile:active{transform:scale(.985)}
.ktile::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(0,0,0,.18));pointer-events:none}
.ktile>*{position:relative}
.kh{display:flex;align-items:center;gap:16px}
.kface{width:78px;height:78px;border-radius:24px;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:2.6rem;flex:none;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.kh b{display:block;font-size:2.1rem;font-weight:800;letter-spacing:-.02em;line-height:1}
.kh div span{display:block;font-weight:500;margin-top:4px}
.kh .chev{margin-left:auto;width:28px;height:28px}
.know{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.05rem;background:rgba(0,0,0,.18);border-radius:14px;padding:10px 14px}
.know i{width:12px;height:12px;border-radius:50%;background:#fff;flex:none;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%,100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
.kday{list-style:none;display:grid;gap:6px}
.kday li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:40px}
.kday .b{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.kday .b svg{width:20px;height:20px;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.kday .s-done .b{background:#fff}
.kday .s-done .b svg{stroke:var(--c)}
.kday .s-now .b{background:transparent;box-shadow:inset 0 0 0 3px #fff}
.kday .s-now .b::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.kday .s-missed .b{background:rgba(0,0,0,.28)}
.kday .s-missed .b svg{stroke:#fff}
.kday .s-later .b{background:transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.kday .sj{font-weight:600;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kday .r{font-weight:700;white-space:nowrap}
.kday .s-missed .r{background:#fff;color:var(--late);border-radius:8px;padding:0 8px}
.kfoot{margin-top:auto;display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px}
.kfoot .avg{font-size:1.6rem;font-weight:800;white-space:nowrap}
.kfoot .avg small{font-size:1rem;font-weight:500;margin-left:6px}
.kfoot .bd{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.badge{min-height:44px;padding:0 14px;border-radius:14px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:1rem;white-space:nowrap}
.badge.amber{background:var(--amberBg);color:var(--amberInk)}
.badge.red{background:#fff;color:var(--late)}
.badge.green{background:rgba(255,255,255,.92);color:var(--okInk)}

/* the small tiles */
.small{display:grid;grid-template-columns:3.6fr 2fr 3.4fr 3fr;gap:16px;min-height:0}
.st{position:relative;overflow:hidden;border-radius:24px;padding:16px 20px;background:var(--paper);display:flex;flex-direction:column;gap:6px;min-width:0;min-height:150px;cursor:pointer}
.st:active{transform:scale(.985)}
.st h2{font-size:1rem;font-weight:600;color:var(--quiet)}
.st-now{background:linear-gradient(150deg,var(--violet),var(--violetDeep))}
.st-now h2{color:#DCD4FF;display:flex;align-items:center;gap:10px}
.st-now h2 i{width:10px;height:10px;border-radius:50%;background:#fff;animation:pulse 2s infinite}
.nowrow{display:flex;align-items:baseline;gap:12px}
.nowrow .sj{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.nowrow small{font-size:1rem;font-weight:500;color:#DCD4FF;white-space:nowrap}
.play{margin-top:auto;min-height:58px;padding:0 22px 0 18px;border-radius:18px;background:#fff;color:#1B1340;font-weight:800;font-size:1.1rem;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.play.on{background:var(--amber);color:var(--amberDeep)}
.st-need{background:var(--amber);color:var(--amberDeep)}
.st-need h2{color:var(--amberDeep)}
.st-need b{font-size:3.6rem;font-weight:800;line-height:.9;margin-top:auto}
.trio{display:flex;gap:8px;margin-top:auto}
.trio div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.trio .f{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--c);font-size:1.2rem}
.trio b{font-size:1rem;font-weight:700;white-space:nowrap}
.st-prog{background:var(--paperHi)}
.st-prog p{margin-top:auto;font-weight:700;font-size:1.1rem;line-height:1.2}
.segs{display:flex;gap:5px}
.segs i{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.2)}
.segs i.on{background:#fff}
.st-prog span{color:var(--quiet)}

/* faces and ticks used in the layers */
.tk{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);flex:none}
.tk svg{width:22px;height:22px;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tk.s-done{background:var(--kc);box-shadow:none}
.tk.s-done svg{stroke:#fff}
.tk.s-now{box-shadow:inset 0 0 0 3px #fff}
.tk.s-now::after{content:"";width:12px;height:12px;border-radius:50%;background:#fff}
.tk.s-missed{background:var(--lateBg);box-shadow:none}
.tk.s-missed svg{stroke:var(--late)}

/* ---------- sheet ---------- */
.layer[hidden]{display:none}
.layer{position:fixed;inset:0;z-index:20}
.scrim{position:absolute;inset:0;background:rgba(16,22,34,.4);opacity:0;transition:opacity .3s}
.sheet{position:absolute;left:50%;bottom:0;width:min(980px,100vw);height:min(90vh,1000px);transform:translate(-50%,104%);transition:transform .42s cubic-bezier(.2,.8,.2,1);background:var(--paper);border-radius:28px 28px 0 0;display:flex;flex-direction:column;box-shadow:0 -20px 60px rgba(0,0,0,.18)}
.layer.in .scrim{opacity:1}
.layer.in .sheet{transform:translate(-50%,0)}
.sHead{display:flex;align-items:center;gap:12px;padding:24px 28px 8px;position:relative}
.sHead::before{content:"";position:absolute;left:50%;top:10px;width:54px;height:6px;border-radius:3px;background:#C3CAD5;transform:translateX(-50%)}
.sHead h2{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;flex:1}
.txtBtn{min-height:48px;padding:0 18px;border-radius:999px;font-weight:700;color:var(--act);font-size:1.05rem;display:inline-flex;align-items:center;gap:6px}
.txtBtn.solid{background:var(--act);color:#fff}
.seg{display:flex;gap:4px;background:var(--page);border-radius:16px;padding:5px;margin:6px 28px 4px}
.seg button{flex:1;min-height:50px;border-radius:12px;font-weight:600;font-size:1rem;text-align:center;color:var(--quiet);display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.sBody{flex:1;overflow:auto;padding:8px 28px 20px}
.sFoot{padding:14px 28px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--quiet);font-size:1rem}
.rows{list-style:none}
.rows>li+li{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:4.4rem minmax(0,1fr) auto;gap:16px;align-items:center;width:100%;padding:12px 0;min-height:72px}
.row .tm{color:var(--quiet);font-variant-numeric:tabular-nums}
.row .sb{font-weight:700;font-size:1.1rem}
.row .sb small{display:block;font-weight:400;font-size:1rem;color:var(--quiet)}
.row .faces{display:flex;gap:6px}
.fs{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;position:relative;box-shadow:inset 0 0 0 3px #D3D9E2}
.fs.s-done{box-shadow:inset 0 0 0 3px var(--kc);background:color-mix(in srgb,var(--kc) 14%,#fff)}
.fs.s-now{box-shadow:inset 0 0 0 3px var(--kc)}
.fs.s-missed{box-shadow:inset 0 0 0 3px var(--late);background:var(--lateBg)}
.fs.s-later{filter:grayscale(1);opacity:.55}
.pill{min-height:50px;padding:0 20px;border-radius:999px;background:var(--page);font-weight:700;color:var(--act);white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.pill.solid{background:var(--act);color:#fff}
.pill.star{background:var(--star);color:#1B1A10}
.muted{color:var(--quiet)}
.big{font-size:1.45rem;font-weight:700;line-height:1.3;margin:10px 0 6px}
.kidRow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;min-height:68px}
.kidRow b{font-size:1.1rem}
.kidRow .st{color:var(--quiet)}
.stats{display:flex;gap:12px;margin:6px 0 12px;flex-wrap:wrap}
.stat{flex:1 1 150px;background:var(--page);border-radius:18px;padding:14px 16px}
.stat b{display:block;font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{color:var(--quiet)}
.h3{font-size:1.1rem;font-weight:800;margin:18px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-width:52px;height:52px;border-radius:14px;background:var(--page);text-align:center;font-weight:700;padding:0 14px}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff}
.fld{display:block;margin-top:16px;font-weight:700}
.fld textarea{display:block;width:100%;margin-top:8px;min-height:120px;border-radius:16px;border:2px solid var(--line);padding:12px 16px;font-weight:400;background:#fff;resize:none}
.who{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.who button{min-height:52px;padding:0 18px 0 8px;border-radius:999px;background:var(--page);font-weight:700;display:inline-flex;align-items:center;gap:10px}
.who button.all{padding:0 20px}
.who button[aria-pressed="true"]{background:var(--ink);color:#fff}
.who .fs{width:36px;height:36px;font-size:1.1rem;background:#fff}
.qa{padding:14px 0}
.qa h3{font-size:1.15rem}
.qa blockquote{margin:10px 0;padding:12px 16px;background:var(--page);border-radius:14px}
.stars{display:flex;gap:8px;margin:14px 0}
.stars button{width:64px;height:64px;border-radius:18px;background:var(--page);display:grid;place-items:center;color:#8A93A3}
.stars button.on{color:#B07A00}
.stars svg{width:36px;height:36px}
.stars button.on svg{fill:currentColor}

.pop[hidden]{display:none}
.pop{position:fixed;right:32px;top:78px;background:var(--paper);border-radius:20px;box-shadow:0 0 0 1px var(--line),0 18px 50px rgba(0,0,0,.16);padding:8px;width:270px;z-index:30}
.pop button{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:54px;padding:0 14px;border-radius:12px;font-weight:600}
.pop button[aria-pressed="true"]{background:var(--page);font-weight:800}
.toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-200%);visibility:hidden;background:var(--ink);color:#fff;padding:14px 24px;border-radius:999px;font-weight:600;transition:transform .3s;z-index:40}
.toast.show{transform:translate(-50%,0);visibility:visible}

/* ---------- admin: its own page ---------- */
#admin{display:none;min-height:100vh;padding:24px 32px 60px}
.isAdmin #admin{display:block}
.isAdmin .pad,.isAdmin .layer{display:none}
.aWrap{max-width:780px;margin:0 auto}
.aBack{display:inline-flex;align-items:center;gap:6px;min-height:52px;padding:0 20px 0 12px;border-radius:999px;background:var(--paper);box-shadow:0 0 0 1px var(--line);font-weight:700;text-decoration:none;color:var(--act)}
.aWrap h1{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;margin:26px 0 4px}
.aWrap .lead{color:var(--quiet)}
.grp h2{font-size:1.05rem;color:var(--quiet);font-weight:700;margin:28px 0 10px 18px}
.grp ul{list-style:none;background:var(--paper);border-radius:22px;box-shadow:0 0 0 1px var(--line)}
.grp li{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;min-height:64px;padding:10px 20px}
.grp li+li{border-top:1px solid var(--line)}
.grp li>span{color:var(--quiet);text-align:right}
.grp li .fs{display:inline-grid;margin-right:12px;vertical-align:middle;box-shadow:inset 0 0 0 3px var(--kc)}
.grp li button{color:var(--act);font-weight:700;min-height:48px;padding:0 6px}
.grp .note{color:var(--quiet);margin:10px 18px 0}

/* dark versions of the shared layers; each tile opens its own full screen */
.sheet{left:0;top:0;bottom:0;width:100vw;height:100vh;border-radius:0;transform:scale(.97);opacity:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .22s;background:#151B2F;box-shadow:none}
.layer.in .sheet{transform:none;opacity:1}
.scrim{background:rgba(5,8,18,.6)}
.sHead{padding:22px 28px 10px}
.sHead::before{display:none}
.sHead h2{font-size:2.1rem;font-weight:800}
.sBody,.sFoot{width:100%;max-width:1000px;margin-left:auto;margin-right:auto}
.sFoot{border-top:0}
.rows{background:var(--paper);border-radius:24px;padding:4px 22px}
.stat{background:var(--paper)}
.seg{background:var(--paper)}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:#fff;color:#10142A}
@media (min-width:1060px){.seg{margin:6px auto 4px;max-width:944px}}
.pill{background:rgba(255,255,255,.1)}
.pill.solid,.txtBtn.solid{background:#fff;color:#10142A}
.pill.star{background:#fff;color:#1B1340}
.chips button,.who button,.stars button{background:rgba(255,255,255,.1)}
.chips button[aria-pressed="true"],.who button[aria-pressed="true"]{background:#fff;color:#10142A}
.stars button{color:#9AA3BD}.stars button.on{color:var(--amber)}
.fld textarea{background:rgba(0,0,0,.25);color:#fff;border-color:rgba(255,255,255,.2)}
.fld textarea::placeholder{color:#9AA3BD}
.qa blockquote{background:var(--paper)}
.toast{background:#fff;color:#10142A}
.fs{box-shadow:inset 0 0 0 3px rgba(255,255,255,.3)}
.grp ul{box-shadow:none}
.aBack{background:rgba(255,255,255,.09);box-shadow:none;color:#fff}
.pop{box-shadow:0 24px 60px rgba(0,0,0,.55)}

/* ---------- upright: each child becomes a wide band ---------- */
@media (orientation:portrait){
  .pad{padding:20px 24px 24px;grid-template-rows:auto minmax(0,1fr) auto}
  .top .clock{display:none}
  .kids{grid-template-columns:1fr;grid-template-rows:repeat(3,minmax(0,1fr))}
  .ktile{display:grid;grid-template-columns:150px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"kh know" "kh kday" "kh kfoot";gap:10px 22px;padding:18px 22px}
  .kh{grid-area:kh;flex-direction:column;align-items:flex-start;gap:10px}
  .kh .chev{position:absolute;right:0;top:0;display:none}
  .know{grid-area:know;padding:8px 12px}
  .kday{grid-area:kday;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-self:center}
  .kday li{grid-template-columns:1fr;justify-items:center;text-align:center;gap:4px;min-height:0}
  .kday .b{width:40px;height:40px}
  .kday .sj{font-size:1rem;max-width:100%}
  .kday .r{display:none}
  .kfoot{grid-area:kfoot;margin-top:0}
  .small{grid-template-columns:1fr 1fr;grid-template-rows:auto auto}
  .st{min-height:132px}
}
html[data-size="large"] .kface{width:68px;height:68px;font-size:2.2rem}
html[data-size="large"] .kday li{min-height:32px}
html[data-size="large"] .kday .b{width:30px;height:30px}
html[data-size="large"] .kh b{font-size:1.85rem}
html[data-size="xl"] .know{display:none}
@media (orientation:landscape){html[data-size="large"] .st{min-height:136px} html[data-size="large"] .ktile{gap:10px;padding-top:18px;padding-bottom:18px}}
@media (orientation:portrait){html[data-size="large"] .kday .b{width:36px;height:36px} html[data-size="large"] .st{min-height:124px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="pad" id="pad"></div>
<div class="layer" id="layer" hidden><div class="scrim" data-close></div><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle"></section></div>
<div class="pop" id="pop" role="menu" aria-label="Text size" hidden></div>
<div class="toast" id="toast" role="status"></div>
<div id="admin"></div>

<script src="../../data.js"></script>
<script>
(() => {
const P = window.PAD, $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/(\d+) of (\d+)/g, '$1\u00A0of\u00A0$2');
const SVG = {
  play: '<path d="M7 4.5v15l12.5-7.5z" fill="currentColor" stroke="none"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', cross: '<path d="M7 7l10 10M17 7L7 17"/>',
  back: '<path d="M15 5l-7 7 7 7"/>', chev: '<path d="M9 5l7 7-7 7"/>', up: '<path d="M6 15l6-6 6 6"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5A8 8 0 1 1 21 12z"/>',
  star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
};
const ic = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${SVG[n]}</svg>`;

/* ---------- facts, all from data.js ---------- */
const nowI = P.classes.findIndex((c) => c.now), NOW = P.classes[nowI], NEXT = P.classes[nowI + 1];
const mins = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const LEFT = mins(NEXT.time) - mins(P.now), GONE = (mins(P.now) - mins(NOW.time)) / (mins(NEXT.time) - mins(NOW.time));
const MARK = P.needsYou.find((n) => n.what.startsWith('Mark '));
const MARK_KID = P.kids.findIndex((k) => MARK.what.includes(k.name));
const MARK_N = +(MARK.detail.match(/(\d+) answers/) || [0, 0])[1];
const LATE = P.needsYou.find((n) => / late$/.test(n.what));
const RATE = P.needsYou.find((n) => n.action === 'Rate');
const STATE = { done: 'Done', now: 'Watching', missed: 'Missed', later: 'Later' };
const todayScore = (ki) => P.scores.find((s) => s.kid === P.kids[ki].name && s.when === 'Today');
const kidOf = (name) => P.kids.findIndex((k) => k.name === name);
function nowLine(ki) {
  const s = NOW.state[ki];
  if (s === 'now') return `Watching ${NOW.subject}`;
  if (s === 'done') { const sc = todayScore(ki); return `Finished ${NOW.subject}${sc ? `, ${sc.score}` : ''}`; }
  return `${STATE[s]}: ${NOW.subject}`;
}
function badges(ki) {
  const k = P.kids[ki], out = [];
  if (ki === MARK_KID) out.push({ go: 'mark', t: `${MARK_N} answers to mark`, c: 'amber' });
  if (k.late) out.push({ go: `kid:${ki}`, t: `${k.late} homework late`, c: 'red' });
  P.classes.forEach((c) => { if (c.state[ki] === 'missed') out.push({ go: `kid:${ki}`, t: `Missed ${c.subject}`, c: 'red' }); });
  if (!out.length) out.push({ go: `kid:${ki}`, t: 'All good', c: 'green', ok: true });
  return out;
}
const tick = (s, k) => `<i class="tk s-${s}" style="--kc:${k.color}">${s === 'done' ? `<svg viewBox="0 0 24 24">${SVG.check}</svg>` : s === 'missed' ? `<svg viewBox="0 0 24 24">${SVG.cross}</svg>` : ''}</i>`;
const fs = (k, s = 'done') => `<span class="fs s-${s}" style="--kc:${k.color}" aria-hidden="true">${k.face}</span>`;

let playing = false;
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 2400); }

/* ---------- the pad ---------- */
SVG.text = '<path d="M4 19l5-14 5 14M5.8 14h6.4M15 19l3-8 3 8M15.9 16.5h4.2"/>';
function renderPad() {
  const [unit, lesson] = P.program.where.split(': ')[1].split(', ');
  const [ln, lof] = lesson.match(/\d+/g).map(Number);
  const box = (s) => `<span class="b" aria-hidden="true">${s === 'done' ? `<svg viewBox="0 0 24 24">${SVG.check}</svg>` : s === 'missed' ? `<svg viewBox="0 0 24 24">${SVG.cross}</svg>` : ''}</span>`;
  $('#pad').innerHTML = `
  <header class="top">
    <h1>${esc(P.today)}</h1><span class="clock">${esc(P.now)}</span>
    <div class="tools">
      <button class="icon" data-go="feedback">${ic('chat')}Feedback</button>
      <button class="icon" id="aa" aria-label="Text size" aria-haspopup="menu">${ic('text')}</button>
      <a class="icon" href="#admin">${ic('gear')}Admin</a>
    </div>
  </header>
  <section class="kids" aria-label="The children">
    ${P.kids.map((k, ki) => {
      const bd = badges(ki).filter((b) => !b.t.startsWith('Missed'));
      return `<article class="ktile" style="--c:${k.color}" data-go="kid:${ki}" role="button" tabindex="0" aria-label="${esc(k.name)}: ${k.done} of ${k.of} classes done. Open">
      <div class="kh"><span class="kface" aria-hidden="true">${k.face}</span><div><b>${esc(k.name)}</b><span>${esc(k.year)}</span></div>${ic('chev', 'i chev')}</div>
      <p class="know">${NOW.state[ki] === 'now' ? '<i aria-hidden="true"></i>' : ''}${esc(nowLine(ki))}</p>
      <ol class="kday" aria-label="Today, ${k.done} of ${k.of} done">${P.classes.map((c) => { const s = c.state[ki], m = c.marks?.[ki], t = c.now && s === 'done' ? todayScore(ki) : null;
        return `<li class="s-${s}">${box(s)}<span class="sj">${esc(c.subject)}</span><span class="r">${m ? esc(m) : t ? esc(t.score.split(' of ')[0]) : s === 'missed' ? 'Missed' : ''}</span></li>`; }).join('')}</ol>
      <div class="kfoot"><span class="avg">${esc(k.average)}<small>average</small></span><span class="bd">${bd.map((b) => `<button class="badge ${b.c}" data-go="${b.go}">${b.ok ? ic('check') : ''}${esc(b.t.replace(' homework late', ' late'))}</button>`).join('')}</span></div>
    </article>`; }).join('')}
  </section>
  <section class="small" aria-label="More">
    <div class="st st-now" data-go="class:${nowI}" role="button" tabindex="0" aria-label="On now: ${esc(NOW.subject)}. Open this class">
      <h2><i aria-hidden="true"></i>On now</h2>
      <div class="nowrow"><span class="sj">${esc(NOW.subject)}</span><small>${LEFT} minutes left</small></div>
      <button class="play ${playing ? 'on' : ''}" id="play">${playing ? 'Playing on the TV' : `${ic('play')}Play on the TV`}</button>
    </div>
    <div class="st st-need" data-go="needs" role="button" tabindex="0"><h2>Needs you</h2><b>${P.needsYou.length}</b></div>
    <div class="st" data-go="rest:scores" role="button" tabindex="0"><h2>Latest scores</h2>
      <div class="trio">${P.scores.map((s) => `<div style="--c:${P.kids[kidOf(s.kid)].color}"><span class="f" aria-hidden="true">${P.kids[kidOf(s.kid)].face}</span><b>${esc(s.score)}</b></div>`).join('')}</div></div>
    <div class="st st-prog" data-go="rest:program" role="button" tabindex="0"><h2>Program</h2><p>${esc(unit)}</p>
      <span class="segs" aria-hidden="true">${Array.from({ length: lof }, (_, n) => `<i class="${n < ln ? 'on' : ''}"></i>`).join('')}</span><span>Lesson ${ln} of ${lof}</span></div>
  </section>`;
  $('#pad').querySelectorAll('[role=button]').forEach((t) => t.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); t.click(); } }));
}


/* ---------- one sheet; its content changes, with Back ---------- */
let stack = [], tab = 'classes';
const bodies = {
  classes: () => `<ul class="rows">${P.classes.map((c, ci) => `<li><button class="row" data-go="class:${ci}">
      <span class="tm">${esc(c.time)}</span><span class="sb">${esc(c.subject)}${c.now ? ', on now' : ''}<small>${esc(c.title)}</small></span>
      <span class="faces">${P.kids.map((k, ki) => fs(k, c.state[ki])).join('')}</span></button></li>`).join('')}</ul>`,
  scores: () => `<ul class="rows">${P.scores.map((s) => `<li class="kidRow">${fs(P.kids[kidOf(s.kid)])}<div><b>${esc(s.kid)}</b><div class="st">${esc(s.what)}, ${esc(s.when.toLowerCase())}</div></div><b style="font-size:1.35rem">${esc(s.score)}</b></li>`).join('')}
      <li class="kidRow"><span class="fs" aria-hidden="true">${ic('star')}</span><div><b>${esc(RATE.what)}</b><div class="st">${esc(RATE.detail)}</div></div><button class="pill" data-go="rate">${esc(RATE.action)}</button></li></ul>`,
  program: () => `<p class="muted" style="margin-top:10px">Where the children are now</p><p class="big">${esc(P.program.where)}</p><p class="muted">${P.program.subjects} subjects, following ${esc(P.admin.plan)}. ${P.program.readyLessons} TV lessons ready.</p><button class="pill solid" style="margin-top:18px" data-toast="The full program opens as its own page">Open the full program</button>`,
};
function view(v) {
  if (v === 'rest') return { title: 'The rest of today', tabs: true, body: bodies[tab](), foot: `<span>${esc(P.today)}</span><button class="txtBtn" data-go="feedback">Send feedback</button>` };
  const [kind, n] = v.split(':'); const i = +n;
  if (kind === 'class') {
    const c = P.classes[i];
    return { title: `${c.subject}, ${c.time}`, body: `<p class="muted">${esc(c.title)}</p>
      <ul class="rows" style="margin-top:8px">${P.kids.map((k, ki) => {
        const s = c.state[ki], m = c.marks?.[ki], sc = c.now && s === 'done' ? todayScore(ki) : null;
        const right = m ? `<b style="font-size:1.3rem">${esc(m)} of 12</b>` : sc ? `<span class="st">Test: <b>${esc(sc.score)}</b></span>` : s === 'done' && !c.lesson ? `<button class="pill" data-go="give:${i}:${ki}">Give a mark</button>` : '';
        return `<li class="kidRow">${fs(k, s)}<div><b>${esc(k.name)}</b><div class="st">${esc(STATE[s])}${sc ? ', marked by the test' : ''}</div></div>${right}</li>`;
      }).join('')}</ul>`,
      foot: `${c.lesson ? `<button class="pill star" id="play2">${ic('play')}Play on the TV</button>` : '<span></span>'}<button class="pill solid" data-go="homework:${i}">Add homework</button>` };
  }
  if (kind === 'give') {
    const [, ci, ki] = v.split(':').map(Number); const c = P.classes[ci], k = P.kids[ki];
    return { title: `${k.name}, ${c.subject}`, body: `<p class="muted">${esc(c.title)}. Out of 12.</p><div class="chips" style="margin-top:14px" role="group" aria-label="Mark out of 12">${Array.from({ length: 12 }, (_, m) => `<button aria-pressed="false" data-chip>${m + 1}</button>`).join('')}</div>`,
      foot: `<span></span><button class="pill solid" data-done="Mark saved for ${esc(k.name)}">Save the mark</button>` };
  }
  if (kind === 'homework') {
    const c = P.classes[i];
    return { title: `Homework, ${c.subject}`, body: `<p class="fld">For</p><div class="who" role="group" aria-label="Who it is for">
        <button class="all" aria-pressed="true" data-pick>Everyone</button>${P.kids.map((k) => `<button aria-pressed="false" data-pick>${fs(k)}Only ${esc(k.name)}</button>`).join('')}</div>
      <label class="fld">What to do<textarea placeholder="For example: read pages 16 to 18"></textarea></label>
      <p class="fld">Due</p><div class="who"><button class="all" aria-pressed="true" data-pick>Tomorrow</button><button class="all" aria-pressed="false" data-pick>Friday</button></div>`,
      foot: `<span></span><button class="pill solid" data-done="Homework added">Add homework</button>` };
  }
  if (kind === 'kid') {
    const k = P.kids[i], sc = P.scores.filter((s) => s.kid === k.name);
    const late = k.late && LATE && LATE.what.includes(k.name);
    return { title: `${k.face} ${k.name}, ${k.year}`, body: `
      <div class="stats"><div class="stat"><b>${k.done} of ${k.of}</b><span>classes done today</span></div><div class="stat"><b>${esc(k.average)}</b><span>average</span></div><div class="stat"><b>${k.homework}</b><span>homework${k.late ? `, ${k.late} late` : ''}</span></div></div>
      ${i === MARK_KID ? `<div class="kidRow"><span class="badge amber">${MARK_N}</span><div><b>${MARK_N} answers to mark</b><div class="st">${esc(MARK.detail.split(',')[0])}</div></div><button class="pill solid" data-go="mark">Mark</button></div>` : ''}
      ${late ? `<div class="kidRow"><span class="badge red">!</span><div><b>Homework is late</b><div class="st">${esc(LATE.detail)}</div></div><button class="pill" data-toast="${esc(k.name)} will see a reminder">Remind</button></div>` : ''}
      <p class="h3">Today</p>
      <ul class="rows">${P.classes.map((c, ci) => { const s = c.state[i], m = c.marks?.[i], t = c.now && s === 'done' ? todayScore(i) : null;
        return `<li><button class="row" data-go="class:${ci}" style="grid-template-columns:auto minmax(0,1fr) auto">${tick(s, k)}<span class="sb">${esc(c.subject)}<small>${esc(c.time)}, ${esc(c.title)}</small></span><span class="muted">${m ? `<b style="color:var(--ink)">${esc(m)} of 12</b>` : t ? `<b style="color:var(--ink)">${esc(t.score)}</b>` : esc(STATE[s])}</span></button></li>`; }).join('')}</ul>
      ${sc.length ? `<p class="h3">Latest scores</p><ul class="rows">${sc.map((s) => `<li class="kidRow" style="grid-template-columns:minmax(0,1fr) auto"><div><b>${esc(s.what)}</b><div class="st">${esc(s.when)}</div></div><b style="font-size:1.3rem">${esc(s.score)}</b></li>`).join('')}</ul>` : ''}` };
  }
  if (v === 'mark') {
    const qs = [['Why is spongy bone useful?', 2, 'It makes the bone lighter but it is still strong.'],
      ['Why is there cartilage at the ends of bones in a joint?', 2, 'So the bones don’t rub together.'],
      ['Explain how the biceps and triceps bend and straighten your arm.', 4, 'The biceps pulls to bend the arm and the triceps pulls to straighten it.']];
    return { title: `${P.kids[MARK_KID].name}’s answers`, body: `<p class="muted">${esc(MARK.detail)}. The rest of the exam marked itself.</p>${qs.map(([q, m, a]) => `<div class="qa"><h3>${esc(q)}</h3><blockquote>${esc(a)}</blockquote><div class="chips" role="group" aria-label="Marks out of ${m}">${Array.from({ length: m + 1 }, (_, x) => `<button aria-pressed="false" data-chip>${x}</button>`).join('')}<span class="muted" style="align-self:center;margin-left:6px">out of ${m}</span></div></div>`).join('')}`,
      foot: `<span></span><button class="pill solid" data-done="Marks saved for ${esc(P.kids[MARK_KID].name)}">Save marks</button>` };
  }
  if (v === 'needs') return { title: 'Needs you', body: `<ul class="rows">${P.needsYou.map((n, i) => { const ki = P.kids.findIndex((k) => n.what.includes(k.name)); const go = n === MARK ? 'data-go="mark"' : n === RATE ? 'data-go="rate"' : `data-toast="${esc(P.kids[ki]?.name || 'Everyone')} will see a reminder"`;
      return `<li class="kidRow">${ki >= 0 ? fs(P.kids[ki]) : `<span class="fs" aria-hidden="true">${ic('star')}</span>`}<div><b>${esc(n === MARK ? `${P.kids[ki].name}: ${MARK_N} answers to mark` : n.what)}</b><div class="st">${esc(n.detail)}</div></div><button class="pill ${i === 0 ? 'solid' : ''}" ${go}>${esc(n.action === 'Mark now' ? 'Mark' : n.action)}</button></li>`; }).join('')}</ul>` };
  if (v === 'rate') return { title: RATE.what, body: `<p class="muted">${esc(RATE.detail)}. How good was it?</p><div class="stars">${[1, 2, 3, 4, 5].map((s) => `<button data-star="${s}" aria-label="${s} stars">${ic('star')}</button>`).join('')}</div>`, foot: `<span></span><button class="pill solid" data-done="Thank you. Rating saved">Save</button>` };
  if (v === 'feedback') return { title: 'Send feedback', body: `<p class="muted">An idea or a problem. It goes to Admin, Feedback and checks.</p><label class="fld">Your message<textarea></textarea></label>`, foot: `<span></span><button class="pill solid" data-done="Sent. Thank you">Send</button>` };
}
function renderSheet() {
  const v = view(stack[stack.length - 1]);
  $('#sheet').innerHTML = `<div class="sHead">${stack.length > 1 ? `<button class="txtBtn" data-back>${ic('back')}Back</button>` : ''}<h2 id="sTitle">${esc(v.title)}</h2><button class="txtBtn" data-close>Close</button></div>
    ${v.tabs ? `<div class="seg" role="tablist">${[['classes', 'Classes'], ['scores', 'Scores'], ['program', 'Program']].map(([k, t]) => `<button role="tab" aria-selected="${k === tab}" data-tab="${k}">${t}</button>`).join('')}</div>` : ''}
    <div class="sBody">${v.body}</div>${v.foot ? `<div class="sFoot">${v.foot}</div>` : ''}`;
}
function open(v, push) {
  const L = $('#layer');
  if (v.startsWith('rest:')) { tab = v.slice(5); v = 'rest'; }
  if (push && !L.hidden) stack.push(v); else stack = [v];
  renderSheet();
  if (L.hidden) { L.hidden = false; requestAnimationFrame(() => requestAnimationFrame(() => L.classList.add('in'))); }
}
function close() { const L = $('#layer'); L.classList.remove('in'); setTimeout(() => { L.hidden = true; }, 380); }

/* ---------- admin ---------- */
function renderAdmin() {
  const A = P.admin;
  const g = (t, rows, note = '') => `<section class="grp"><h2>${t}</h2><ul>${rows.map(([a, b]) => `<li><div>${a}</div>${b}</li>`).join('')}</ul>${note ? `<p class="note">${note}</p>` : ''}</section>`;
  $('#admin').innerHTML = `<div class="aWrap"><a class="aBack" href="#">${ic('back')}Back to today</a><h1>Admin</h1><p class="lead">The account, the family and the plan. Teaching stays on the pad.</p>
    ${g(A.sections[0], [['Name', `<span>${esc(A.account.name)}</span>`], ['Username', `<span>${esc(A.account.username)}</span>`], ['Text size', `<span>${esc(A.account.textSize)}</span>`], ['Password', '<button>Change</button>']])}
    ${g(A.sections[1], [...P.parents.map((p) => [`<b>${esc(p.name)}</b>`, `<span>${p.you ? 'You' : 'Parent'}</span>`]), ...P.kids.map((k) => [`${fs(k)}<b>${esc(k.name)}</b>`, `<span>${esc(k.year)}</span>`]), ['Add a parent or a child', '<button>Add</button>']], 'Children sign in on their own device. They don’t need an email address.')}
    ${g(A.sections[2], [['Program', `<span>${esc(A.plan)}</span>`], ['Spanish key words', `<span>${esc(A.wordHelp.split(': ')[1] === 'off' ? 'Off' : 'On')}</span>`], ['Exam PIN', `<span>${esc(A.examPin)}</span>`]])}
    ${g(A.sections[3], [['Your plan', `<span>${esc(A.billing)}</span>`], ['Payment details', '<span>None asked for</span>']])}
    ${g(A.sections[4], [['Send an idea or a problem', '<button data-go="feedback">Write</button>'], ['The last 7 days', '<span>No problems</span>']])}
  </div>`;
}

/* ---------- text size ---------- */
const SIZES = [['std', 'Standard', 1], ['large', 'Large', 1.1], ['xl', 'Extra large', 1.2]];
function renderPop() { const cur = document.documentElement.dataset.size || 'std'; $('#pop').innerHTML = SIZES.map(([k, t, z]) => `<button role="menuitemradio" aria-pressed="${k === cur}" data-size="${k}" style="font-size:${z}rem">${t}${k === cur ? ' <span aria-hidden="true">✓</span>' : ''}</button>`).join(''); }

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, a, [data-go]');
  if (!e.target.closest('#pop') && !(t && t.id === 'aa')) $('#pop').hidden = true;
  if (!t) return;
  if (t.id === 'aa') { renderPop(); $('#pop').hidden = !$('#pop').hidden; return; }
  if (t.dataset.size) { document.documentElement.dataset.size = t.dataset.size; $('#pop').hidden = true; return; }
  if (t.id === 'play' || t.id === 'play2') { playing = !playing; renderPad(); toast(playing ? `${NOW.subject} is playing on the TV` : 'Stopped on the TV'); return; }
  if (t.dataset.go) { e.stopPropagation(); if (location.hash === '#admin') { location.hash = ''; setTimeout(() => open(t.dataset.go), 60); return; } open(t.dataset.go, !$('#layer').hidden); return; }
  if (t.dataset.tab) { tab = t.dataset.tab; renderSheet(); return; }
  if (t.hasAttribute('data-back')) { stack.pop(); renderSheet(); return; }
  if (t.hasAttribute('data-close')) return close();
  if (t.dataset.done) { close(); toast(t.dataset.done); return; }
  if (t.dataset.toast) { toast(t.dataset.toast); return; }
  if (t.hasAttribute('data-chip') || t.hasAttribute('data-pick')) { t.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', 'false')); t.setAttribute('aria-pressed', 'true'); return; }
  if (t.dataset.star) { t.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', +b.dataset.star <= +t.dataset.star)); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { close(); $('#pop').hidden = true; } });
function route() {
  const admin = location.hash === '#admin';
  document.body.classList.toggle('isAdmin', admin);
  if (admin) { $('#layer').hidden = true; renderAdmin(); scrollTo(0, 0); }
}
addEventListener('hashchange', route);
renderPad(); route();
window.__open = open;
})();
</script>
